# The single source of tool versions.
#
# Humans run `mise install`; CI runs jdx/mise-action against this file; the
# Makefile reads the same values (hack/common.mk, `mise_v`) when a tool is not
# on PATH; `make doctor` compares the host against it. Nothing else in the
# tree states a tool version, except what no tool manager can carry: the base
# image digests in the Dockerfile and the release workflow's cosign installer
# (hack/check-toolchain.sh keeps that one equal to the cosign pin below), and
# the pins in the e2e scripts. Keys are quoted on purpose: hack/common.mk
# parses this file with awk, one `"tool" = "version"` per line.
#
# Dependabot does not read this file; the quarterly toolchain day bumps it by
# hand (docs/site/docs/development/ci.md, "Dependencies"). Pin only versions
# that have been published for at least two weeks.

min_version = "2026.10.0"

[tools]
"go" = "1.27.3"
"node" = "24.22.1"
"pnpm" = "12.16.1"
"helm" = "4.3.1"
"kind" = "0.33.0"
"kubectl" = "1.37.1"
"actionlint" = "1.7.12"
"hadolint" = "2.15.1"
"zizmor" = "1.31.1"
"aqua:koalaman/shellcheck" = "0.11.0"
# The Helm chart gates (hack/chart-gates.sh). untt is helm-unittest's standalone
# binary; mise installs it from the GitHub release, the others from their release
# archives (kube-linter from its GitHub release: the aqua package verifies a cosign key the project no longer publishes).
"aqua:helm/chart-testing" = "3.15.0"
"aqua:yannh/kubeconform" = "0.8.0"
"github:stackrox/kube-linter" = "0.8.3"
"github:helm-unittest/helm-unittest" = "1.2.1"
# promtool checks the alert rules the pgtools chart ships and runs their unit
# tests (make rules-test, in the chart job). It comes in the Prometheus release
# archive; 3.5.0 is the LTS line.
"aqua:prometheus/prometheus" = "3.5.0"
# helm-docs renders the Values reference of the chart READMEs (make chart-docs).
"go:github.com/norwoodj/helm-docs/cmd/helm-docs" = "1.14.2"
# operator-sdk validates the OLM bundle (make bundle-validate). From its GitHub
# release binary: building it from source needs cgo and libgpgme.
"github:operator-framework/operator-sdk" = { version = "1.42.3", matching = "operator-sdk_" } # the release also ships helm-operator_* and ansible-operator_* binaries
# Docs hygiene (make docs-spell, make docs-links; the docs job): codespell is
# a Python tool that mise installs through pipx or uv (both are on GitHub's
# runners). lychee is a release binary from the aqua registry.
"aqua:lycheeverse/lychee" = "0.24.2"
"pipx:codespell" = "2.4.3"
# Security and release tooling (the security workflow, `make verify-image`).
# gitleaks scans the history for secrets, grype scans the built images,
# osv-scanner reads the npm and Go lockfiles, cosign verifies signatures.
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:anchore/grype" = "0.121.0"
"aqua:google/osv-scanner" = "2.7.0"
"aqua:sigstore/cosign" = "3.1.4"
# Go-built tools are compiled by mise with the Go above, so a linter is never
# older than the language version it is asked to analyse.
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "0.23.0"
# crd-ref-docs renders the api/v1alpha1 reference page (make crd-ref-docs); the
# page is committed and `make docs` fails when it drifts.
"go:github.com/elastic/crd-ref-docs" = "0.3.0"
# setup-envtest is the tools/setup-envtest module of controller-runtime; its
# tags follow controller-runtime's (v0.25.2 is the release the go.mod requires).
"go:sigs.k8s.io/controller-runtime/tools/setup-envtest" = "0.25.2"
