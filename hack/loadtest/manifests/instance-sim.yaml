# loadgen instance-sim: answers /pg/status (TLS 1.3, certificate per server
# name signed by the CA the console trusts) and the exporter for the fake
# Pods. hostNetwork on the real node: cluster.sh routes the KWOK Pod CIDRs to
# the node's loopback, so a connection to a fake Pod's IP lands here.
apiVersion: v1
kind: ServiceAccount
metadata: {name: instance-sim, namespace: loadtest}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: loadtest-instance-sim}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: loadtest-instance-sim}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: loadtest-instance-sim}
subjects: [{kind: ServiceAccount, name: instance-sim, namespace: loadtest}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: instance-sim, namespace: loadtest}
spec:
  replicas: 1
  selector: {matchLabels: {app: instance-sim}}
  template:
    metadata: {labels: {app: instance-sim}}
    spec:
      serviceAccountName: instance-sim
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {type: real}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: sim
          image: __SIM_IMAGE__
          imagePullPolicy: Never
          args: [instance-sim, --in-cluster, --ca-cert=/ca/tls.crt, --ca-key=/ca/tls.key]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts: [{name: ca, mountPath: /ca, readOnly: true}]
      volumes:
        - name: ca
          secret: {secretName: instance-sim-ca}
