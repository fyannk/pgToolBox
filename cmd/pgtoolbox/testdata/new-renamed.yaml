# The definitions in force: two Clusters and objects that are not Clusters.
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: orders
  namespace: team-a
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  postgresql:
    parameters:
      max_connections: "100"
      work_mem: 4MB
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: invoices
  namespace: team-a
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
---
apiVersion: v1
kind: Service
metadata:
  name: orders-extra
  namespace: team-a
spec:
  ports:
    - port: 5432
