# pgAdmin without the operator on OpenShift: the oauth-proxy, a re-encrypting
# Route; fsGroup left null, so none where the API server serves
# security.openshift.io/v1 (the restricted SCC assigns one).
pgadmin:
  enabled: true
  auth:
    provider: openshift
  exposure:
    type: route
    host: pgadmin.apps.example.org
  fsGroup: null
  servers:
    - cluster: orders
      endpoint: rw
      credentials:
        application: {secret: orders-app}
