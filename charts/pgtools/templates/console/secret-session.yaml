{{- if and .Values.console.enabled (not .Values.console.auth.sessionKey.existingSecret) }}
{{- /*
The cookie-sealing key, generated once. `lookup` finds the Secret on upgrade so
the key (and every open session) survives a `helm upgrade`; under `helm
template` there is no cluster and a fresh value is rendered, which is why a
GitOps tool that renders client-side should set sessionKey.existingSecret.
The console never reads this Secret through the API: it is a mounted file.
*/ -}}
{{- $name := include "pgtools.console.sessionSecret" . }}
{{- $key := .Values.console.auth.sessionKey.key }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgtools.console.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing (hasKey $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
