{{- $c := .Values.console }}
{{- if and $c.enabled $c.mcp.enabled }}
{{- $mcpCtx := merge (dict "mcpPod" true) . }}
{{- $fullname := include "pgtools.console.fullname" . }}
{{- $mcp := include "pgtools.console.mcpLeader" . }}
{{- /* With MCP on, one Pod serves the MCP paths and writes the grants: the
one replica of this Deployment, the console's own template with mcpPod set
(_workload.tpl). The Lease below keeps a single writer while an old and a new
Pod overlap in a roll; the console's own replicas never campaign
(MCP_CANDIDATE=false) and the exposure sends them no MCP path. */}}
{{ include "pgtools.console.workload" $mcpCtx }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $mcp }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgtools.console.labels" $mcpCtx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pgtools.console.selectorLabels" $mcpCtx | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ $mcp }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgtools.console.labels" $mcpCtx | nindent 4 }}
{{- if $c.rbac.create }}
---
# get and update on that one Lease, by name: no create (it exists above),
# nothing on Pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $mcp }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgtools.console.labels" $mcpCtx | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ $mcp | quote }}]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $mcp }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgtools.console.labels" $mcpCtx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $mcp }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
