{{- if .Values.console.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pgtools.console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgtools.console.labels" . | nindent 4 }}
  {{- if eq .Values.console.auth.provider "openshift" }}
  annotations:
    # The ServiceAccount is the OpenShift OAuth client; OpenShift redirects only to
    # the URIs listed here.
    serviceaccounts.openshift.io/oauth-redirecturi.console: {{ required "console.auth.openshift.redirectURI is required with auth.provider=openshift (the console's public callback URL)" .Values.console.auth.openshift.redirectURI | quote }}
  {{- end }}
# The API token is a projected volume mounted into the console container only
# (deployment.yaml), never a pod-wide automount.
automountServiceAccountToken: false
{{- with .Values.console.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
