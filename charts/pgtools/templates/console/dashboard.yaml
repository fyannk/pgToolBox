{{- if and .Values.console.enabled .Values.console.metrics.grafanaDashboard.enabled }}
# Picked up by the Grafana dashboard sidecar (label grafana_dashboard) in the
# release's namespace; with the Grafana Operator, point a GrafanaDashboard at it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pgtools.console.fullname" . }}-mcp-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgtools.console.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    {{- with .Values.console.metrics.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  pgtoolbox-mcp.json: |
    {{- .Files.Get "files/dashboards/mcp.json" | nindent 4 }}
{{- end }}
