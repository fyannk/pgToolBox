{{- if .Values.pgadmin.enabled }}
{{- $name := include "pgtools.pgadmin.fullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgtools.pgadmin.labels" . | nindent 4 }}
  {{- if eq .Values.pgadmin.auth.provider "openshift" }}
  annotations:
    # The proxy's OAuth client is this ServiceAccount; it may redirect only to its Route.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: {{ printf `{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"%s"}}` $name | squote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
