{{- if .Values.pgadmin.enabled }}
{{- /*
Generated once and kept: `lookup` finds them on upgrade. pgAdmin's internal
owner account (the bootstrap password, never used to sign in: there is no
local login) and, with auth.provider openshift, the proxy's cookie secret
unless auth.openshift.cookieSecret.existingSecret names one. Under `helm
template` there is no cluster and fresh values are rendered.
*/ -}}
{{- $bootstrap := include "pgtools.pgadmin.bootstrapSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $bootstrap }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $bootstrap }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgtools.pgadmin.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing (hasKey $existing.data "password") }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 43 | b64enc }}
  {{- end }}
{{- if and (eq .Values.pgadmin.auth.provider "openshift") (not .Values.pgadmin.auth.openshift.cookieSecret.existingSecret) }}
{{- $cookie := include "pgtools.pgadmin.cookieSecret" . }}
{{- $existingCookie := lookup "v1" "Secret" .Release.Namespace $cookie }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cookie }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgtools.pgadmin.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existingCookie (hasKey $existingCookie.data "cookie-secret") }}
  cookie-secret: {{ index $existingCookie.data "cookie-secret" }}
  {{- else }}
  # oauth-proxy wants a 16, 24 or 32-byte cookie secret.
  cookie-secret: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
