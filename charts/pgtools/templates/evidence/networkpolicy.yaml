{{- include "pgtools.evidence.validate" . }}
{{- if and .Values.evidence.agents .Values.evidence.networkPolicy.enabled }}
{{- /*
OPTIONAL, OFF BY DEFAULT, like console.networkPolicy: it isolates the agent
pods of this release. Ingress: the console pods only, on the agent port.
Egress: DNS, the API server (the agent reads its Cluster, ObjectStore and
Secrets) and the object store.
*/ -}}
{{- $np := .Values.evidence.networkPolicy }}
{{- $addresses := list }}
{{- $ports := $np.apiServer.ports }}
{{- if eq $np.apiServer.mode "addresses" }}
{{- $api := include "pgtools.apiServerAddresses" (dict "np" $np "path" "evidence.networkPolicy") | fromJson }}
{{- $addresses = $api.addresses }}
{{- $ports = $api.ports }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgtools.safeName" (printf "%s-evidence" .Release.Name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgtools.evidence.releaseLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: evidence-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: evidence-agent
  policyTypes: [Ingress, Egress]
  ingress:
    # The console pods of this release, on the agent port only.
    - from:
        - podSelector:
            matchLabels:
              {{- include "pgtools.console.selectorLabels" . | nindent 14 }}
      ports:
        - {port: 8443, protocol: TCP}
  egress:
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dns.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $np.dns.podLabels | nindent 14 }}
      ports:
        {{- range $port := $np.dns.ports }}
        - {port: {{ $port }}, protocol: UDP}
        - {port: {{ $port }}, protocol: TCP}
        {{- end }}
    # The API server.
    {{- if eq $np.apiServer.mode "any" }}
    - ports:
        {{- range $port := $ports }}
        - {port: {{ $port }}, protocol: TCP}
        {{- end }}
    {{- else }}
    - to:
        {{- range $ip := $addresses }}
        - ipBlock:
            cidr: {{ if contains "/" (toString $ip) }}{{ $ip }}{{ else if contains ":" (toString $ip) }}{{ $ip }}/128{{ else }}{{ $ip }}/32{{ end }}
        {{- end }}
      ports:
        {{- range $port := $ports }}
        - {port: {{ $port }}, protocol: TCP}
        {{- end }}
    {{- end }}
    # The object store: the peers of evidence.networkPolicy.objectStore.to,
    # or any address on its ports.
    - {{- with $np.objectStore.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        {{- range $port := $np.objectStore.ports }}
        - {port: {{ $port }}, protocol: TCP}
        {{- end }}
{{- /*
Workload identity: an agent whose entry opts in (workloadIdentity.platform)
also reaches its platform's link-local credential endpoint. A second policy
selecting that agent only: policies add up, and no other agent (nor one on
another platform) gets the metadata address.
*/}}
{{- range $agent := .Values.evidence.agents }}
{{- $platform := (($agent.workloadIdentity | default dict).platform | default "") }}
{{- if or (eq $platform "gke") (eq $platform "eksPodIdentity") }}
{{- $ctx := dict "root" $ "agent" $agent }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgtools.safeName" (printf "%s-workload-identity" (include "pgtools.evidence.name" $ctx)) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pgtools.evidence.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pgtools.evidence.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- if eq $platform "gke" }}
    # The GKE metadata server (workload identity), and its Dataplane V2 port.
    - to: [{ipBlock: {cidr: 169.254.169.254/32}}]
      ports: [{port: 80, protocol: TCP}]
    - to: [{ipBlock: {cidr: 169.254.169.252/32}}]
      ports: [{port: 988, protocol: TCP}]
    {{- else }}
    # The EKS Pod Identity Agent.
    - to: [{ipBlock: {cidr: 169.254.170.23/32}}, {ipBlock: {cidr: "fd00:ec2::23/128"}}]
      ports: [{port: 80, protocol: TCP}]
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
