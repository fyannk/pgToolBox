{{- include "pgtools.evidence.validate" . }}
{{- if and .Values.evidence.agents (not .Values.evidence.token.existingSecret) }}
{{- /*
The shared token the console presents to the agents, generated once. `lookup`
finds the Secret on upgrade so the value survives `helm upgrade`; `helm
template` and client-side GitOps renderers have no cluster and render a new
value each time: they should set evidence.token.existingSecret. Neither the
console nor the agents read this Secret through the API: it is a mounted file.
*/ -}}
{{- $name := include "pgtools.evidence.tokenSecret" . }}
{{- $key := .Values.evidence.token.key }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgtools.evidence.releaseLabels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
