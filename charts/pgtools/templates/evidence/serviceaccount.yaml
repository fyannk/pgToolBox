{{- include "pgtools.evidence.validate" . }}
{{- range $agent := .Values.evidence.agents }}
{{- $ctx := dict "root" $ "agent" $agent }}
{{- $name := include "pgtools.evidence.name" $ctx }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $agent.serviceAccountName | default $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pgtools.evidence.labels" $ctx | nindent 4 }}
  {{- /* Workload-identity annotations only (the schema's allow-list). */}}
  {{- with ($agent.workloadIdentity | default dict).serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The Pod mounts a projected token of its own; nothing is automounted.
automountServiceAccountToken: false
{{- end }}
