# NOTES.txt warns when restore drills run without the cluster-scoped delete
# guard, which a namespace admin cannot install.
suite: restore drills guard notes
templates:
  - templates/NOTES.txt
release:
  name: pgc
  namespace: team-a
tests:
  - it: warns when drills are on and the guard is off
    set: {console.restoreDrills.enabled: true}
    asserts:
      - matchRegexRaw: {pattern: "Restore drills are ENABLED without the delete guard"}

  - it: is quiet when the guard is rendered
    set: {console.restoreDrills.enabled: true, console.restoreDrills.admissionPolicy.create: true}
    asserts:
      - notMatchRegexRaw: {pattern: "Restore drills are ENABLED"}

  - it: is quiet when drills are off
    asserts:
      - notMatchRegexRaw: {pattern: "Restore drills are ENABLED"}

  - it: warns when the guard is rendered but Deny is not a validation action
    set:
      console.restoreDrills.enabled: true
      console.restoreDrills.admissionPolicy.create: true
      console.restoreDrills.admissionPolicy.validationActions: [Warn, Audit]
    asserts:
      - matchRegexRaw: {pattern: "rendered but NOT ENFORCED"}
      - matchRegexRaw: {pattern: "Warn, Audit"}

  - it: is quiet about enforcement when Deny is among the actions
    set:
      console.restoreDrills.enabled: true
      console.restoreDrills.admissionPolicy.create: true
      console.restoreDrills.admissionPolicy.validationActions: [Warn, Deny]
    asserts:
      - notMatchRegexRaw: {pattern: "NOT ENFORCED"}
