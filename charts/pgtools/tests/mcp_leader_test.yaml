# With MCP on, one Pod serves it: the one replica of the <fullname>-mcp
# Deployment, behind a Service of its own; the console's replicas never
# campaign for the Lease and the exposure sends the MCP paths to that
# Service. MCP off renders none of it. Render order of mcp.yaml (Helm sorts
# by kind): Role, RoleBinding, Service, Deployment, Lease.
suite: console MCP leader
templates:
  - templates/console/mcp.yaml
  - templates/console/exposure.yaml
  - templates/console/deployment.yaml
  - templates/console/service.yaml
  - templates/console/networkpolicy.yaml
release:
  name: pgc
  namespace: team-a
tests:
  - it: renders nothing with MCP off
    template: templates/console/mcp.yaml
    asserts:
      - hasDocuments: {count: 0}

  - it: renders no leader variable with MCP off
    template: templates/console/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: MCP_LEASE, value: pgc-console-mcp}

  - it: renders one MCP replica, rolled with a surge, beside the console's
    template: templates/console/mcp.yaml
    set: {console.mcp.enabled: true, console.publicURL: "https://pgc.example.org"}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: metadata.name, value: pgc-console-mcp}
      - equal: {path: spec.replicas, value: 1}
      - equal: {path: spec.strategy.rollingUpdate, value: {maxSurge: 1, maxUnavailable: 0}}
      - equal:
          path: spec.selector.matchLabels
          value: {app.kubernetes.io/name: pgtoolbox-console, app.kubernetes.io/instance: pgc, app.kubernetes.io/component: console-mcp}
      - equal: {path: 'spec.template.metadata.labels["app.kubernetes.io/component"]', value: console-mcp}
      - equal: {path: spec.template.spec.serviceAccountName, value: pgc-console}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MCP_LEASE, value: pgc-console-mcp}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: MCP_CANDIDATE, value: "false"}
      - notExists: {path: spec.template.spec.affinity}

  - it: keeps the console's own replicas out of the election
    template: templates/console/deployment.yaml
    set: {console.mcp.enabled: true, console.publicURL: "https://pgc.example.org"}
    asserts:
      - equal: {path: metadata.name, value: pgc-console}
      - equal: {path: 'spec.selector.matchLabels["app.kubernetes.io/component"]', value: console}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MCP_LEASE, value: pgc-console-mcp}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MCP_CANDIDATE, value: "false"}

  - it: gives the MCP Pod in-memory history and no digest delivery, even with persistent history
    template: templates/console/mcp.yaml
    set:
      console.mcp.enabled: true
      console.publicURL: "https://pgc.example.org"
      console.history.persistent: true
      console.digest.delivery.chat.existingSecret: chat
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - isKind: {of: Deployment}
      - notExists: {path: spec.volumeClaimTemplates}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: HISTORY_ENABLED, value: "true"}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: DIGEST_LEASE, value: pgc-console-digest}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: DIGEST_CHAT_WEBHOOK_URL_FILE, value: /var/run/console/digest/chat/url}

  - it: selects the MCP Pod alone with its Service; the console's Service does not
    set: {console.mcp.enabled: true, console.publicURL: "https://pgc.example.org"}
    asserts:
      - template: templates/console/mcp.yaml
        documentSelector: {path: kind, value: Service}
        equal:
          path: spec.selector
          value: {app.kubernetes.io/name: pgtoolbox-console, app.kubernetes.io/instance: pgc, app.kubernetes.io/component: console-mcp}
      - template: templates/console/mcp.yaml
        documentSelector: {path: kind, value: Service}
        equal: {path: "spec.ports[0]", value: {name: http, port: 80, targetPort: http, protocol: TCP}}
      - template: templates/console/service.yaml
        equal: {path: 'spec.selector["app.kubernetes.io/component"]', value: console}

  - it: admits the MCP Pod in the console's NetworkPolicy
    template: templates/console/networkpolicy.yaml
    set:
      console.mcp.enabled: true
      console.publicURL: "https://pgc.example.org"
      console.networkPolicy.enabled: true
      console.networkPolicy.apiServer.addresses: [10.96.0.1]
    asserts:
      - notExists: {path: 'spec.podSelector.matchLabels["app.kubernetes.io/component"]'}

  - it: grants get and update on the Lease by name, no create, nothing on Pods
    template: templates/console/mcp.yaml
    set: {console.mcp.enabled: true, console.publicURL: "https://pgc.example.org"}
    documentSelector: {path: kind, value: Role}
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              resourceNames: [pgc-console-mcp]
              verbs: [get, update]

  - it: renders the Lease, and no Role with console.rbac.create false
    template: templates/console/mcp.yaml
    set: {console.mcp.enabled: true, console.publicURL: "https://pgc.example.org", console.rbac.create: false}
    asserts:
      - hasDocuments: {count: 3}
      - containsDocument: {kind: Lease, apiVersion: coordination.k8s.io/v1, name: pgc-console-mcp, any: true}

  - it: sends the MCP paths to the MCP Service through an Ingress, the rest to the console
    template: templates/console/exposure.yaml
    set: {console.mcp.enabled: true, console.exposure.type: ingress, console.exposure.host: pgc.example.org}
    asserts:
      - lengthEqual: {path: "spec.rules[0].http.paths", count: 5}
      - equal: {path: "spec.rules[0].http.paths[0].path", value: /mcp}
      - equal: {path: "spec.rules[0].http.paths[0].backend.service.name", value: pgc-console-mcp}
      - equal: {path: "spec.rules[0].http.paths[3].path", value: /logout}
      - equal: {path: "spec.rules[0].http.paths[3].pathType", value: Exact}
      - equal: {path: "spec.rules[0].http.paths[4].path", value: /}
      - equal: {path: "spec.rules[0].http.paths[4].backend.service.name", value: pgc-console}

  - it: renders one Route per MCP path on OpenShift
    template: templates/console/exposure.yaml
    set: {console.mcp.enabled: true, console.exposure.type: route, console.exposure.host: pgc.apps.example.org}
    asserts:
      - hasDocuments: {count: 5}
      - documentIndex: 4
        equal: {path: metadata.name, value: pgc-console-mcp-logout}
      - documentIndex: 4
        equal: {path: spec.path, value: /logout}
      - documentIndex: 4
        equal: {path: spec.to.name, value: pgc-console-mcp}
      - documentIndex: 4
        equal: {path: 'metadata.annotations["haproxy.router.openshift.io/timeout"]', value: 1h}

  - it: adds one HTTPRoute rule for the MCP paths, with the stream's timeout
    template: templates/console/exposure.yaml
    set:
      console.mcp.enabled: true
      console.exposure.type: httpRoute
      console.exposure.host: pgc.example.org
      console.exposure.httpRoute.parentRefs: [{name: gw}]
    asserts:
      - lengthEqual: {path: spec.rules, count: 2}
      - equal: {path: "spec.rules[0].backendRefs[0].name", value: pgc-console-mcp}
      - equal: {path: "spec.rules[0].timeouts.request", value: 1h}
      - equal: {path: "spec.rules[0].matches[3]", value: {path: {type: Exact, value: /logout}}}
