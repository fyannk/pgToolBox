# Each credential kind: what the offer ConfigMap carries and exactly which
# objects the Role names. Only named objects, get and watch, never list; a kind
# with no name gets no rule (empty resourceNames would grant every object).
suite: pgadmin credentials and Role
templates:
  - templates/pgadmin/configmap-servers.yaml
  - templates/pgadmin/rbac.yaml
release:
  name: pgc
  namespace: team-a
set:
  pgadmin.enabled: true
tests:
  - it: application names the Cluster, its CA Secret and the application Secret
    set:
      pgadmin.servers:
        - {cluster: orders, endpoint: rw, credentials: {application: {secret: orders-app}}}
    asserts:
      - template: templates/pgadmin/configmap-servers.yaml
        equal:
          path: data["servers.json"]
          value: '{"servers":[{"cluster":"orders","credentials":{"application":{"secret":"orders-app"}},"endpoint":"rw"}],"version":1}'
      - template: templates/pgadmin/rbac.yaml
        documentIndex: 0
        equal:
          path: rules
          value:
            - {apiGroups: [postgresql.cnpg.io], resources: [clusters], resourceNames: [orders], verbs: [get, watch]}
            - {apiGroups: [""], resources: [secrets], resourceNames: [orders-app, orders-ca], verbs: [get, watch]}

  - it: superuser on a Pooler names the Pooler too
    set:
      pgadmin.servers:
        - {cluster: orders, endpoint: "pooler:orders-pool", credentials: {superuser: {secret: orders-superuser}}}
    asserts:
      - template: templates/pgadmin/rbac.yaml
        documentIndex: 0
        equal:
          path: rules
          value:
            - {apiGroups: [postgresql.cnpg.io], resources: [clusters], resourceNames: [orders], verbs: [get, watch]}
            - {apiGroups: [postgresql.cnpg.io], resources: [poolers], resourceNames: [orders-pool], verbs: [get, watch]}
            - {apiGroups: [""], resources: [secrets], resourceNames: [orders-ca, orders-superuser], verbs: [get, watch]}

  - it: databaseRole names the DatabaseRole and its password Secret
    set:
      pgadmin.servers:
        - cluster: orders
          endpoint: ro
          credentials: {databaseRole: {name: orders-reporting, secret: orders-reporting-password}}
    asserts:
      - template: templates/pgadmin/configmap-servers.yaml
        equal:
          path: data["servers.json"]
          value: '{"servers":[{"cluster":"orders","credentials":{"databaseRole":{"name":"orders-reporting","secret":"orders-reporting-password"}},"endpoint":"ro"}],"version":1}'
      - template: templates/pgadmin/rbac.yaml
        documentIndex: 0
        equal:
          path: rules
          value:
            - {apiGroups: [postgresql.cnpg.io], resources: [clusters], resourceNames: [orders], verbs: [get, watch]}
            - {apiGroups: [postgresql.cnpg.io], resources: [databaseroles], resourceNames: [orders-reporting], verbs: [get, watch]}
            - {apiGroups: [""], resources: [secrets], resourceNames: [orders-ca, orders-reporting-password], verbs: [get, watch]}

  - it: secret names your Secret, with the declared user and database
    set:
      pgadmin.servers:
        - {cluster: billing, endpoint: rw, database: billing, user: billing_owner, credentials: {secret: billing-owner}}
    asserts:
      - template: templates/pgadmin/configmap-servers.yaml
        equal:
          path: data["servers.json"]
          value: '{"servers":[{"cluster":"billing","credentials":{"secret":"billing-owner"},"database":"billing","endpoint":"rw","user":"billing_owner"}],"version":1}'
      - template: templates/pgadmin/rbac.yaml
        documentIndex: 0
        equal:
          path: rules
          value:
            - {apiGroups: [postgresql.cnpg.io], resources: [clusters], resourceNames: [billing], verbs: [get, watch]}
            - {apiGroups: [""], resources: [secrets], resourceNames: [billing-ca, billing-owner], verbs: [get, watch]}

  - it: none names no credential Secret, only the CA (caSecret when declared)
    set:
      pgadmin.servers:
        - {cluster: legacy, endpoint: rw, database: app, user: alice, caSecret: legacy-server-ca, credentials: none}
    asserts:
      - template: templates/pgadmin/configmap-servers.yaml
        equal:
          path: data["servers.json"]
          value: '{"servers":[{"caSecret":"legacy-server-ca","cluster":"legacy","credentials":"none","database":"app","endpoint":"rw","user":"alice"}],"version":1}'
      - template: templates/pgadmin/rbac.yaml
        documentIndex: 0
        equal:
          path: rules
          value:
            - {apiGroups: [postgresql.cnpg.io], resources: [clusters], resourceNames: [legacy], verbs: [get, watch]}
            - {apiGroups: [""], resources: [secrets], resourceNames: [legacy-server-ca], verbs: [get, watch]}

  - it: never grants list, a verb other than get and watch, or a rule without names
    set:
      pgadmin.servers:
        - {cluster: orders, endpoint: rw, credentials: {application: {secret: orders-app}}}
        - {cluster: orders, endpoint: ro, credentials: {databaseRole: {name: r, secret: r-password}}}
        - {cluster: legacy, endpoint: rw, database: app, user: alice, credentials: none}
    template: templates/pgadmin/rbac.yaml
    documentIndex: 0
    asserts:
      # clusters, databaseroles, secrets: no poolers rule, since none is named
      - lengthEqual: {path: rules, count: 3}
      - equal: {path: "rules[0].verbs", value: [get, watch]}
      - equal: {path: "rules[1].verbs", value: [get, watch]}
      - equal: {path: "rules[2].verbs", value: [get, watch]}
      - equal: {path: "rules[2].resourceNames", value: [legacy-ca, orders-app, orders-ca, r-password]}

  - it: renders an empty Role (no rule at all) for an empty list
    template: templates/pgadmin/rbac.yaml
    documentIndex: 0
    asserts:
      - equal: {path: rules, value: []}

  - it: binds the Role to pgAdmin's ServiceAccount only
    set:
      pgadmin.servers:
        - {cluster: orders, endpoint: rw, credentials: {application: {secret: orders-app}}}
    template: templates/pgadmin/rbac.yaml
    documentIndex: 1
    asserts:
      - isKind: {of: RoleBinding}
      - equal:
          path: subjects
          value: [{kind: ServiceAccount, name: pgc-pgadmin, namespace: team-a}]
      - equal: {path: roleRef.kind, value: Role}

  # Decision 6: the sidecar reads only the Secrets named in values. With a
  # caSecret or a caConfigMap on every server, the Role names exactly the
  # Secrets the values name, nothing derived.
  - it: names no Secret absent from values when every server states its CA source
    set:
      pgadmin.servers:
        - {cluster: orders, endpoint: rw, caConfigMap: orders-ca-crt, credentials: {application: {secret: orders-app}}}
        - {cluster: orders, endpoint: ro, caConfigMap: orders-ca-crt, credentials: {databaseRole: {name: orders-reporting, secret: orders-reporting-password}}}
        - {cluster: orders, endpoint: "pooler:orders-pool", caConfigMap: orders-ca-crt, credentials: {superuser: {secret: orders-superuser}}}
        - {cluster: billing, endpoint: rw, database: billing, user: billing_owner, caSecret: billing-server-ca, credentials: {secret: billing-owner}}
        - {cluster: legacy, endpoint: rw, database: app, user: alice, caSecret: legacy-server-ca, credentials: none}
    template: templates/pgadmin/rbac.yaml
    documentIndex: 0
    asserts:
      - lengthEqual: {path: rules, count: 4}
      - equal:
          path: rules[3]
          value: {apiGroups: [""], resources: [secrets], resourceNames: [billing-owner, billing-server-ca, legacy-server-ca, orders-app, orders-reporting-password, orders-superuser], verbs: [get, watch]}

  - it: with caConfigMap names no CA Secret, and the ConfigMap reaches the sidecar's list
    set:
      pgadmin.servers:
        - {cluster: orders, endpoint: rw, caConfigMap: orders-ca-crt, credentials: {application: {secret: orders-app}}}
    asserts:
      - template: templates/pgadmin/configmap-servers.yaml
        equal:
          path: data["servers.json"]
          value: '{"servers":[{"caConfigMap":"orders-ca-crt","cluster":"orders","credentials":{"application":{"secret":"orders-app"}},"endpoint":"rw"}],"version":1}'
      # A ConfigMap is mounted, never read through the API: no configmaps rule.
      - template: templates/pgadmin/rbac.yaml
        documentIndex: 0
        equal:
          path: rules
          value:
            - {apiGroups: [postgresql.cnpg.io], resources: [clusters], resourceNames: [orders], verbs: [get, watch]}
            - {apiGroups: [""], resources: [secrets], resourceNames: [orders-app], verbs: [get, watch]}

  - it: with caConfigMap and credentials none names no Secret at all
    set:
      pgadmin.servers:
        - {cluster: legacy, endpoint: rw, database: app, user: alice, caConfigMap: legacy-ca-crt, credentials: none}
    template: templates/pgadmin/rbac.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: rules
          value:
            - {apiGroups: [postgresql.cnpg.io], resources: [clusters], resourceNames: [legacy], verbs: [get, watch]}

  - it: the only Secret not named in values is the warned derived default
    set:
      pgadmin.servers:
        - {cluster: orders, endpoint: rw, credentials: {application: {secret: orders-app}}}
        - {cluster: billing, endpoint: rw, caConfigMap: billing-ca-crt, credentials: {application: {secret: billing-app}}}
    template: templates/pgadmin/rbac.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: rules[1].resourceNames
          value: [billing-app, orders-app, orders-ca]

  - it: refuses caSecret and caConfigMap on one server
    set:
      pgadmin.servers:
        - {cluster: orders, endpoint: rw, caSecret: orders-ca, caConfigMap: orders-ca-crt, credentials: {application: {secret: orders-app}}}
    template: templates/pgadmin/rbac.yaml
    asserts:
      - failedTemplate:
          errorPattern: "pgadmin/servers/0|caSecret and caConfigMap are exclusive"
