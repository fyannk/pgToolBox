# The lookup keeps every ready address and every port of the kubernetes
# EndpointSlice: a control plane serving on two ports loses no egress to the
# API server, and an endpoint marked not ready is left out.
suite: API server lookup across endpoints
templates:
  - templates/console/networkpolicy.yaml
release:
  name: pgc
  namespace: team-a
kubernetesProvider:
  scheme:
    "discovery.k8s.io/v1/EndpointSlice": {gvr: {group: discovery.k8s.io, version: v1, resource: endpointslices}, namespaced: true}
  # Floats: the fake client deep-copies JSON numbers (float64) only.
  objects:
    - apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata: {name: kubernetes, namespace: default}
      addressType: IPv4
      endpoints:
        - addresses: [10.0.0.1]
          conditions: {ready: true}
        - addresses: [10.0.0.2]
        - addresses: [10.0.0.3]
          conditions: {ready: true}
        - addresses: [10.0.0.9]
          conditions: {ready: false}
      ports:
        - {name: https, port: 6443.0, protocol: TCP}
        - {name: https-alt, port: 443.0, protocol: TCP}
set:
  console.networkPolicy.enabled: true
tests:
  - it: allows every ready address on every port
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - {ipBlock: {cidr: 10.0.0.1/32}}
              - {ipBlock: {cidr: 10.0.0.2/32}}
              - {ipBlock: {cidr: 10.0.0.3/32}}
            ports:
              - {port: 6443, protocol: TCP}
              - {port: 443, protocol: TCP}
