# The lookup keeps the addresses and the ports of every subset of the
# kubernetes Endpoints: a control plane whose endpoints serve on two ports
# (two subsets) loses no egress to the API server.
suite: API server lookup across subsets
templates:
  - templates/console/networkpolicy.yaml
release:
  name: pgc
  namespace: team-a
kubernetesProvider:
  scheme:
    "v1/Endpoints": {gvr: {group: "", version: v1, resource: endpoints}, namespaced: true}
  # Floats: the fake client deep-copies JSON numbers (float64) only.
  objects:
    - apiVersion: v1
      kind: Endpoints
      metadata: {name: kubernetes, namespace: default}
      subsets:
        - addresses: [{ip: 10.0.0.1}, {ip: 10.0.0.2}]
          ports: [{name: https, port: 6443.0, protocol: TCP}]
        - addresses: [{ip: 10.0.0.3}]
          ports: [{name: https, port: 443.0, protocol: TCP}]
set:
  console.networkPolicy.enabled: true
tests:
  - it: allows every subset's addresses on every subset's ports
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - {ipBlock: {cidr: 10.0.0.1/32}}
              - {ipBlock: {cidr: 10.0.0.2/32}}
              - {ipBlock: {cidr: 10.0.0.3/32}}
            ports:
              - {port: 6443, protocol: TCP}
              - {port: 443, protocol: TCP}
