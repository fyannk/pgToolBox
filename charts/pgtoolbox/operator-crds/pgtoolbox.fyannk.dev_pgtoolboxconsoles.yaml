---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: pgtoolboxconsoles.pgtoolbox.fyannk.dev
spec:
  group: pgtoolbox.fyannk.dev
  names:
    categories:
    - pgtoolbox
    kind: PgToolBoxConsole
    listKind: PgToolBoxConsoleList
    plural: pgtoolboxconsoles
    shortNames:
    - pgc
    singular: pgtoolboxconsole
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .status.image
      name: Image
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PgToolBoxConsole runs the pgToolBox console for the CloudNativePG Clusters of
          its namespace: the same console the chart installs, kept converged by the
          operator. The console's own authority is read-only in this namespace;
          whoever may create a PgToolBoxConsole may create a Deployment here anyway.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PgToolBoxConsoleSpec declares one console in this namespace: the console the
              chart installs, run and kept converged by the operator. It watches the
              CloudNativePG Clusters of its own namespace only; every reader still sees
              only what their own RBAC allows (SubjectAccessReview).
            properties:
              auth:
                default:
                  provider: token
                description: How people sign in.
                properties:
                  oidc:
                    description: OpenID Connect, for provider oidc.
                    properties:
                      caConfigMapRef:
                        description: |-
                          A ConfigMap with ca.crt trusting a private IdP. Omitted: the system
                          roots.
                        properties:
                          name:
                            description: The name of the referenced object.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      clientID:
                        description: The client id.
                        maxLength: 256
                        minLength: 1
                        type: string
                      clientSecretRef:
                        description: The Secret key holding the client secret, mounted
                          as a file.
                        properties:
                          key:
                            default: client-secret
                            description: The key.
                            maxLength: 253
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          name:
                            description: The Secret name.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      grantClient:
                        description: |-
                          A second client of the same issuer for the identity provider sign-ins
                          of console grants (MCP clients), registered with the same redirect
                          URI. An identity provider that keeps one refresh token per person and
                          client (dex) otherwise ends the browser session's renewal each time an
                          assistant connects. The API server's JWT authenticator must accept
                          this client's audience too. Omitted: grants sign in as clientID.
                        properties:
                          clientID:
                            description: The client id.
                            maxLength: 256
                            minLength: 1
                            type: string
                          clientSecretRef:
                            description: The Secret key holding the client secret,
                              mounted as a file.
                            properties:
                              key:
                                default: client-secret
                                description: The key.
                                maxLength: 253
                                pattern: ^[-._a-zA-Z0-9]+$
                                type: string
                              name:
                                description: The Secret name.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - clientID
                        - clientSecretRef
                        type: object
                      issuerURL:
                        description: The issuer, https only.
                        maxLength: 512
                        pattern: ^https://
                        type: string
                      redirectURL:
                        description: The callback URL. Defaults to <publicURL>/auth/oidc/callback.
                        maxLength: 512
                        pattern: ^https://
                        type: string
                      requireEmailVerified:
                        description: |-
                          Refuse a login whose ID token lacks email_verified=true. Default true;
                          set false only for an IdP that omits the claim.
                        type: boolean
                      scopes:
                        description: 'Scopes requested. Default: openid, email, profile,
                          offline_access.'
                        items:
                          maxLength: 128
                          type: string
                        maxItems: 16
                        type: array
                    required:
                    - clientID
                    - clientSecretRef
                    - issuerURL
                    type: object
                    x-kubernetes-validations:
                    - fieldPath: .grantClient.clientID
                      message: oidc.grantClient.clientID must differ from oidc.clientID
                      reason: FieldValueInvalid
                      rule: '!has(self.grantClient) || self.grantClient.clientID !=
                        self.clientID'
                  openshift:
                    description: OpenShift OAuth, for provider openshift.
                    properties:
                      caConfigMapRef:
                        description: |-
                          A ConfigMap with ca.crt trusting the OAuth server. Omitted: the
                          service CA OpenShift publishes in every namespace.
                        properties:
                          name:
                            description: The name of the referenced object.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      clientSecretRef:
                        description: |-
                          The Secret key holding a long-lived ServiceAccount token to present as
                          the client secret. Omitted: the console presents its projected token.
                        properties:
                          key:
                            description: The key.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          name:
                            description: The Secret name.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                  provider:
                    default: token
                    description: The sign-in provider.
                    enum:
                    - token
                    - oidc
                    - openshift
                    type: string
                  sessionIdleTimeout:
                    description: Idle timeout of a session. Default 1h.
                    type: string
                    x-kubernetes-validations:
                    - message: sessionIdleTimeout must be between 1m and 12h
                      reason: FieldValueInvalid
                      rule: duration(self) >= duration('1m') && duration(self) <=
                        duration('12h')
                  sessionMaxAge:
                    description: Maximum age of a session whatever its activity. Default
                      12h.
                    type: string
                    x-kubernetes-validations:
                    - message: sessionMaxAge must be between 5m and 168h
                      reason: FieldValueInvalid
                      rule: duration(self) >= duration('5m') && duration(self) <=
                        duration('168h')
                  tokenLogin:
                    description: |-
                      Shows the break-glass form (paste an API-server token) next to SSO.
                      Default true.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - fieldPath: .sessionIdleTimeout
                  message: sessionIdleTimeout must not exceed sessionMaxAge
                  reason: FieldValueInvalid
                  rule: '!has(self.sessionIdleTimeout) || !has(self.sessionMaxAge)
                    || duration(self.sessionIdleTimeout) <= duration(self.sessionMaxAge)'
              clusterSelector:
                description: |-
                  Narrows the Clusters shown to those this selector matches, on top of
                  what each user's own RBAC allows. Omitted: every Cluster of the
                  namespace.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              digest:
                description: |-
                  The daily digest: a summary page per day, kept with the history, and
                  optional delivery to chat, a webhook or mail. Delivery needs
                  history.persistent (the message links to the digest's page); only the
                  replica holding the Lease <console>-digest delivers.
                properties:
                  delivery:
                    description: |-
                      Where each digest is sent: a summary and a link, never the details.
                      Omitted: nowhere (the page only).
                    properties:
                      chatWebhookSecretRef:
                        description: |-
                          A Slack or Mattermost incoming-webhook URL (https), which receives
                          POST {"text": ...}.
                        properties:
                          key:
                            description: The key.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          name:
                            description: The Secret name.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      smtp:
                        description: Mail over TLS.
                        properties:
                          address:
                            description: The mail server, host:port.
                            maxLength: 261
                            pattern: ^[A-Za-z0-9]([-A-Za-z0-9.]*[A-Za-z0-9])?:[0-9]{1,5}$
                            type: string
                          from:
                            description: The sender, one bare address.
                            maxLength: 254
                            minLength: 3
                            type: string
                          passwordSecretRef:
                            description: The password.
                            properties:
                              key:
                                description: The key.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[-._a-zA-Z0-9]+$
                                type: string
                              name:
                                description: The Secret name.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          tls:
                            default: starttls
                            description: |-
                              starttls (required, never optional) or tls (implicit, port 465).
                              Default starttls.
                            enum:
                            - starttls
                            - tls
                            type: string
                          to:
                            description: The recipients, bare addresses.
                            items:
                              maxLength: 254
                              type: string
                            maxItems: 20
                            minItems: 1
                            type: array
                          username:
                            description: The user for AUTH PLAIN (over TLS only).
                            maxLength: 256
                            type: string
                        required:
                        - address
                        - from
                        - to
                        type: object
                        x-kubernetes-validations:
                        - message: smtp.username and smtp.passwordSecretRef are set
                            together
                          reason: FieldValueInvalid
                          rule: has(self.username) == has(self.passwordSecretRef)
                      timeout:
                        description: Bound of one delivery attempt. Default 10s.
                        type: string
                        x-kubernetes-validations:
                        - message: digest.delivery.timeout must be between 1s and
                            1m
                          reason: FieldValueInvalid
                          rule: duration(self) >= duration('1s') && duration(self)
                            <= duration('1m')
                      webhookSecretRef:
                        description: |-
                          A generic webhook URL (https), which receives the digest's JSON
                          summary.
                        properties:
                          key:
                            description: The key.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          name:
                            description: The Secret name.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: digest.delivery names no channel
                      reason: FieldValueRequired
                      rule: has(self.chatWebhookSecretRef) || has(self.webhookSecretRef)
                        || has(self.smtp)
                  enabled:
                    description: |-
                      Make a digest every day. Default: on with persistent history; with
                      in-memory history each replica would make its own, so it is on only
                      when set.
                    type: boolean
                  hour:
                    description: The UTC hour at which each digest closes its 24 hours.
                      Default 7.
                    format: int32
                    maximum: 23
                    minimum: 0
                    type: integer
                  retention:
                    description: How long digests are kept. Default 720h (30 days).
                    type: string
                    x-kubernetes-validations:
                    - message: digest.retention must be between 24h and 8784h
                      reason: FieldValueInvalid
                      rule: duration(self) >= duration('24h') && duration(self) <=
                        duration('8784h')
                type: object
              evidence:
                description: Repository evidence from the namespace's EvidenceAgents.
                properties:
                  enabled:
                    description: |-
                      Read repository evidence from the namespace's EvidenceAgents. Default
                      true. Off, the backups screen says "disabled".
                    type: boolean
                  interval:
                    description: 'How often each agent is asked again. Omitted: the
                      console''s default.'
                    type: string
                    x-kubernetes-validations:
                    - message: evidence.interval must be between 30s and 1h
                      reason: FieldValueInvalid
                      rule: duration(self) >= duration('30s') && duration(self) <=
                        duration('1h')
                type: object
              exposure:
                default:
                  type: clusterIP
                description: |-
                  Exposure of the console. The console streams events over SSE; the
                  operator sets the long edge timeouts it knows for each type.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      Annotations added to the exposure object; keys under
                      pgtoolbox.fyannk.dev/ are rejected.
                    maxProperties: 32
                    type: object
                    x-kubernetes-validations:
                    - message: annotation keys under pgtoolbox.fyannk.dev/ are reserved
                      reason: FieldValueForbidden
                      rule: self.all(k, !k.startsWith('pgtoolbox.fyannk.dev/'))
                  gateway:
                    description: Gateway API attachment, for gateway exposure only.
                    properties:
                      parentRef:
                        description: The Gateway listener to attach to.
                        properties:
                          name:
                            description: Gateway name.
                            maxLength: 253
                            minLength: 1
                            type: string
                          namespace:
                            description: Gateway namespace; defaults to the CR's namespace.
                            maxLength: 63
                            type: string
                          sectionName:
                            description: Listener (section) name on the Gateway.
                            maxLength: 253
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - parentRef
                    type: object
                  hostname:
                    description: The external hostname. Required for route, ingress
                      and gateway.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  ingressClassName:
                    description: IngressClass name, for ingress exposure only.
                    maxLength: 253
                    type: string
                  labels:
                    additionalProperties:
                      type: string
                    description: |-
                      Labels added to the exposure object under the operator's own
                      identity labels, which always win. Ingress controllers and OpenShift
                      router shards select by label; keys under pgtoolbox.fyannk.dev/ are
                      rejected.
                    maxProperties: 32
                    type: object
                    x-kubernetes-validations:
                    - message: label keys under pgtoolbox.fyannk.dev/ are reserved
                      reason: FieldValueForbidden
                      rule: self.all(k, !k.startsWith('pgtoolbox.fyannk.dev/'))
                  tls:
                    description: |-
                      TLS for route and ingress exposure. A Route always terminates TLS at
                      the edge; an Ingress uses certificateSecretRef, or the controller's
                      default certificate when it is omitted. For gateway exposure TLS
                      terminates at the Gateway listener.
                    properties:
                      certificateSecretRef:
                        description: |-
                          TLS certificate Secret (kubernetes.io/tls) in the CR's namespace,
                          for ingress exposure.
                        properties:
                          name:
                            description: The name of the referenced object.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                  type:
                    default: clusterIP
                    description: The exposure mechanism.
                    enum:
                    - clusterIP
                    - route
                    - ingress
                    - gateway
                    type: string
                type: object
                x-kubernetes-validations:
                - fieldPath: .hostname
                  message: hostname is required for route, ingress and gateway exposure
                  reason: FieldValueRequired
                  rule: '!has(self.type) || self.type == ''clusterIP'' || (has(self.hostname)
                    && size(self.hostname) > 0)'
                - fieldPath: .gateway
                  message: gateway is required exactly when type is gateway
                  reason: FieldValueInvalid
                  rule: (has(self.type) && self.type == 'gateway') == has(self.gateway)
                - fieldPath: .ingressClassName
                  message: ingressClassName applies to ingress exposure only
                  reason: FieldValueForbidden
                  rule: (has(self.type) && self.type == 'ingress') || !has(self.ingressClassName)
                - fieldPath: .tls.certificateSecretRef
                  message: tls.certificateSecretRef applies to ingress exposure only
                  reason: FieldValueForbidden
                  rule: (has(self.type) && self.type == 'ingress') || !has(self.tls)
                    || !has(self.tls.certificateSecretRef)
              history:
                default:
                  persistent: true
                description: |-
                  The history journal, and with it the state snapshots, the timeline
                  and the digests. Persistent by default: the console is then a
                  StatefulSet with one volume per replica.
                properties:
                  persistent:
                    default: true
                    description: |-
                      Keep the history on a volume per replica, across restarts: the
                      console is a StatefulSet whose claim template makes
                      history-<console>-<ordinal> for each replica. false: history in
                      memory, a Deployment. Default true.
                    type: boolean
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      Size of each replica's history volume. Default 1Gi, which holds the
                      default retention of a console of a few hundred instances. A change
                      replaces the StatefulSet (its Pods keep running) and applies to
                      volumes made later; grow an existing one by editing its claim.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: |-
                      StorageClass of the history volumes. Omitted: the cluster default.
                      Like size, a change applies to volumes made later.
                    maxLength: 253
                    type: string
                type: object
              image:
                description: |-
                  The console image. Omitted, the operator's default applies (the
                  console released with the operator). The repository must be in the
                  operator's allow-list (--console-image-repositories; by default the
                  default image's repository only).
                properties:
                  digest:
                    description: Image digest; when set it is what the Pod runs.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  pullPolicy:
                    description: |-
                      Image pull policy. Defaults to IfNotPresent for a digest and Always
                      for a tag alone.
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  pullSecrets:
                    description: Pull secrets for the image registry, in the CR's
                      namespace.
                    items:
                      description: |-
                        LocalObjectReference names an object in the referencing object's own
                        namespace. Cross-namespace references do not exist in v1alpha1; a future
                        one goes through an explicit grant object in the target
                        namespace, never through a selector.
                      properties:
                        name:
                          description: The name of the referenced object.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 8
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  repository:
                    description: Image repository, without tag or digest (registry/path/name).
                    maxLength: 255
                    minLength: 1
                    pattern: ^[a-z0-9]+([._-][a-z0-9]+)*(:[0-9]{1,5})?(/[a-z0-9]+([._-][a-z0-9]+)*)*$
                    type: string
                  tag:
                    description: Image tag; informative when a digest is set.
                    maxLength: 128
                    pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$
                    type: string
                required:
                - repository
                type: object
                x-kubernetes-validations:
                - message: an image needs a tag, a digest or both
                  reason: FieldValueRequired
                  rule: has(self.tag) || has(self.digest)
              instanceCABundleRef:
                description: |-
                  The CA bundle the console verifies each instance's /pg/status with:
                  a ConfigMap with the key ca.crt holding the PEM server CAs of the
                  namespace's Clusters. Omitted (recommended): the operator keeps
                  <name>-instance-ca itself, copying only the public ca.crt of each
                  selected Cluster's server CA Secret, and follows CloudNativePG's CA
                  renewals and Clusters coming and going; the console still reads no
                  Secret. Set: the console mounts the named ConfigMap, which you keep
                  current yourself (CloudNativePG renews its self-signed CA every 90
                  days, so a one-off copy expires). A Cluster missing from the bundle
                  is shown as "not verifiable", never read unverified.
                properties:
                  name:
                    description: The name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              lifecycleConfigMapRef:
                description: |-
                  The end-of-life table the diagnostics read. Omitted, the operator
                  creates <console>-lifecycle with its built-in table and keeps it at
                  the operator's table until someone edits it (or annotates it
                  pgtoolbox.fyannk.dev/user-managed=true); from then on it is left
                  alone. Set, the console reads that ConfigMap (key lifecycle.json) and
                  the operator creates none.
                properties:
                  name:
                    description: The name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              mcp:
                description: |-
                  The read-only MCP endpoint at /mcp, for AI agents and IDE
                  assistants. Off by default.
                properties:
                  callTimeout:
                    description: |-
                      The time limit of one tool call (MCP_CALL_TIMEOUT). Omitted: the
                      console's default, 20s. Used only with enabled.
                    type: string
                    x-kubernetes-validations:
                    - message: mcp.callTimeout must be between 1s and 50s
                      reason: FieldValueInvalid
                      rule: duration(self) >= duration('1s') && duration(self) <=
                        duration('50s')
                  enabled:
                    description: Serve the read-only MCP endpoint. Default false.
                    type: boolean
                  maxResultBytes:
                    description: |-
                      The cap on one tool result's JSON, in bytes (MCP_MAX_RESULT_BYTES);
                      a larger result is shortened and says so. Omitted: the console's
                      default, 262144 (256 KiB). Used only with enabled.
                    format: int32
                    maximum: 4194304
                    minimum: 16384
                    type: integer
                  oauthAccessTTL:
                    description: |-
                      The lifetime of an access token the console issues to an MCP client
                      (MCP_OAUTH_ACCESS_TTL); the client renews it with its refresh token.
                      Omitted: the console's default, 1h. Used only with enabled.
                    type: string
                    x-kubernetes-validations:
                    - message: mcp.oauthAccessTTL must be between 10s and 1h
                      reason: FieldValueInvalid
