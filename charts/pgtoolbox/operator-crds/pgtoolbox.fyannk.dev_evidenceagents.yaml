---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: evidenceagents.pgtoolbox.fyannk.dev
spec:
  group: pgtoolbox.fyannk.dev
  names:
    categories:
    - pgtoolbox
    kind: EvidenceAgent
    listKind: EvidenceAgentList
    plural: evidenceagents
    shortNames:
    - pgea
    singular: evidenceagent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EvidenceAgent deploys a read-only evidence agent for the backup repository
          of one CloudNativePG Cluster in its namespace. Whoever may get an
          EvidenceAgent may read the evidence it serves.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EvidenceAgentSpec declares one evidence agent: a read-only reader of the
              backup repository of one CloudNativePG Cluster in this namespace, serving
              evidence/v1alpha1 to the console over in-cluster HTTPS.
            properties:
              allowInsecureEndpoint:
                description: |-
                  Admit a plain-http object-store endpoint, over which the credentials
                  cross the network in clear text. Off, such an endpoint is refused
                  (UnsupportedObjectStore), except for the deprecated behaviour of an
                  empty allowedSecrets.
                type: boolean
              allowedSecrets:
                description: |-
                  The Secrets, in this namespace, the agent may read: whoever may edit
                  the Cluster or the ObjectStore chooses which Secrets the backup
                  configuration names, and the agent reads only those also listed
                  here. A configuration naming another is refused by name
                  (ConfigurationValid=False, UnsupportedObjectStore). Empty is the
                  deprecated behaviour, kept for an ObjectStore of the barman-cloud
                  plugin only: every Secret that ObjectStore names; the Cluster's own
                  spec.backup.barmanObjectStore is then refused.
                items:
                  maxLength: 253
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              clusterRef:
                description: |-
                  The CloudNativePG Cluster, in this namespace, whose backups the agent
                  reads. Its barman-cloud plugin stanza names the ObjectStore and the
                  server name unless the fields below override them.
                properties:
                  name:
                    description: The name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              exposure:
                description: |-
                  Exposure of the agent. Only clusterIP is accepted: the console in the
                  cluster is the agent's only client.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      Annotations added to the exposure object; keys under
                      pgtoolbox.fyannk.dev/ are rejected.
                    maxProperties: 32
                    type: object
                    x-kubernetes-validations:
                    - message: annotation keys under pgtoolbox.fyannk.dev/ are reserved
                      reason: FieldValueForbidden
                      rule: self.all(k, !k.startsWith('pgtoolbox.fyannk.dev/'))
                  gateway:
                    description: Gateway API attachment, for gateway exposure only.
                    properties:
                      parentRef:
                        description: The Gateway listener to attach to.
                        properties:
                          name:
                            description: Gateway name.
                            maxLength: 253
                            minLength: 1
                            type: string
                          namespace:
                            description: Gateway namespace; defaults to the CR's namespace.
                            maxLength: 63
                            type: string
                          sectionName:
                            description: Listener (section) name on the Gateway.
                            maxLength: 253
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - parentRef
                    type: object
                  hostname:
                    description: The external hostname. Required for route, ingress
                      and gateway.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  ingressClassName:
                    description: IngressClass name, for ingress exposure only.
                    maxLength: 253
                    type: string
                  labels:
                    additionalProperties:
                      type: string
                    description: |-
                      Labels added to the exposure object under the operator's own
                      identity labels, which always win. Ingress controllers and OpenShift
                      router shards select by label; keys under pgtoolbox.fyannk.dev/ are
                      rejected.
                    maxProperties: 32
                    type: object
                    x-kubernetes-validations:
                    - message: label keys under pgtoolbox.fyannk.dev/ are reserved
                      reason: FieldValueForbidden
                      rule: self.all(k, !k.startsWith('pgtoolbox.fyannk.dev/'))
                  tls:
                    description: |-
                      TLS for route and ingress exposure. A Route always terminates TLS at
                      the edge; an Ingress uses certificateSecretRef, or the controller's
                      default certificate when it is omitted. For gateway exposure TLS
                      terminates at the Gateway listener.
                    properties:
                      certificateSecretRef:
                        description: |-
                          TLS certificate Secret (kubernetes.io/tls) in the CR's namespace,
                          for ingress exposure.
                        properties:
                          name:
                            description: The name of the referenced object.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                  type:
                    default: clusterIP
                    description: The exposure mechanism.
                    enum:
                    - clusterIP
                    - route
                    - ingress
                    - gateway
                    type: string
                type: object
                x-kubernetes-validations:
                - fieldPath: .hostname
                  message: hostname is required for route, ingress and gateway exposure
                  reason: FieldValueRequired
                  rule: '!has(self.type) || self.type == ''clusterIP'' || (has(self.hostname)
                    && size(self.hostname) > 0)'
                - fieldPath: .gateway
                  message: gateway is required exactly when type is gateway
                  reason: FieldValueInvalid
                  rule: (has(self.type) && self.type == 'gateway') == has(self.gateway)
                - fieldPath: .ingressClassName
                  message: ingressClassName applies to ingress exposure only
                  reason: FieldValueForbidden
                  rule: (has(self.type) && self.type == 'ingress') || !has(self.ingressClassName)
                - fieldPath: .tls.certificateSecretRef
                  message: tls.certificateSecretRef applies to ingress exposure only
                  reason: FieldValueForbidden
                  rule: (has(self.type) && self.type == 'ingress') || !has(self.tls)
                    || !has(self.tls.certificateSecretRef)
              image:
                description: |-
                  The agent image. Omitted, the operator's default applies. The
                  repository must be in the operator's allow-list
                  (--evidence-agent-image-repositories; by default the default image's
                  repository only): the agent Pod mounts the object-store credentials.
                properties:
                  digest:
                    description: Image digest; when set it is what the Pod runs.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  pullPolicy:
                    description: |-
                      Image pull policy. Defaults to IfNotPresent for a digest and Always
                      for a tag alone.
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  pullSecrets:
                    description: Pull secrets for the image registry, in the CR's
                      namespace.
                    items:
                      description: |-
                        LocalObjectReference names an object in the referencing object's own
                        namespace. Cross-namespace references do not exist in v1alpha1; a future
                        one goes through an explicit grant object in the target
                        namespace, never through a selector.
                      properties:
                        name:
                          description: The name of the referenced object.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 8
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  repository:
                    description: Image repository, without tag or digest (registry/path/name).
                    maxLength: 255
                    minLength: 1
                    pattern: ^[a-z0-9]+([._-][a-z0-9]+)*(:[0-9]{1,5})?(/[a-z0-9]+([._-][a-z0-9]+)*)*$
                    type: string
                  tag:
                    description: Image tag; informative when a digest is set.
                    maxLength: 128
                    pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$
                    type: string
                required:
                - repository
                type: object
                x-kubernetes-validations:
                - message: an image needs a tag, a digest or both
                  reason: FieldValueRequired
                  rule: has(self.tag) || has(self.digest)
              objectStoreRef:
                description: |-
                  The barman-cloud ObjectStore (barmancloud.cnpg.io/v1), in this
                  namespace, to read. Defaults to the Cluster's barmanObjectName
                  plugin parameter. The agent uses the same credentials the plugin
                  uses; they never leave this namespace.
                properties:
                  name:
                    description: The name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              pgbackrest:
                description: |-
                  pgBackRest settings, for a Cluster backed up with a pgBackRest plugin
                  (pgbackrest.dalibo.com or pgbackrest.cnpg.opera.com). Omitted, such a
                  Cluster is read from repo1 with the system's trusted roots.
                properties:
                  endpoint:
                    description: |-
                      Pins the repository's endpoint: a host[:port] (a DNS name, an IPv4
                      address or a bracketed IPv6 address) that the host the agent sends
                      its requests and credentials to must match, or the Cluster is refused
                      (UnsupportedObjectStore). That host is the S3 endpoint the plugin's
                      object names, or the Azure account's Blob host
                      (<account>.blob.core.windows.net host-style, the endpoint path-style).
                      Without a port, the scheme's default port. Whoever may edit the
                      Stanza or the Archive chooses where the credentials go; the pin keeps
                      that choice with this object's author. It is also the opt-in that
                      lets an Azure storage key or SAS token go to a host outside the Azure
                      Blob domains (Azurite).
                    maxLength: 261
                    pattern: ^(\[[0-9A-Fa-f:.]+\]|[A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?([.][A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?)*)(:[0-9]{1,5})?$
                    type: string
                  endpointCA:
                    description: |-
                      A CA bundle (a key of a Secret in this namespace) the agent trusts for
                      the repository endpoint, beside the system roots. It wins over the
                      Archive's endpointCA. TLS is always verified: Dalibo's verifyTLS and
                      Opera's disableVerifyTLS are not followed.
                    properties:
                      key:
                        description: The key.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: The Secret name.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  repository:
                    default: 1
                    description: |-
                      The pgBackRest repository number (repo<n>) to read. Dalibo numbers
                      the Stanza's S3 repositories first, then its Azure ones; Opera
                      numbers the Archive's repositories in order. 1 is where both plugins
                      send a backup that names no repository.
                    format: int32
                    maximum: 256
                    minimum: 1
                    type: integer
                type: object
              refreshInterval:
                description: How often the agent re-reads the repository.
                type: string
                x-kubernetes-validations:
                - message: refreshInterval must be between 30s and 24h
                  reason: FieldValueInvalid
                  rule: duration(self) >= duration('30s') && duration(self) <= duration('24h')
              resources:
                description: Compute resources of the agent container.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              serverName:
                description: |-
                  The Barman server name (the first key prefix under the destination).
                  Defaults to the Cluster's serverName plugin parameter, else the
                  Cluster's name — the same rule the barman-cloud plugin applies.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: serverName must not contain '/' or '\' and must not be
                    '.' or '..'
                  reason: FieldValueInvalid
                  rule: self != '.' && self != '..' && !self.contains('/') && !self.contains('\\')
              tls:
                description: Serving certificate.
                properties:
                  issuer:
                    default: Operator
                    description: Who issues the serving certificate.
                    enum:
                    - Operator
                    - OpenShiftServiceCA
                    type: string
                type: object
              workloadIdentity:
                description: |-
                  Workload identity of the agent, for a repository read with the Pod's
                  own cloud identity (s3Credentials.inheritFromIAMRole,
                  azureCredentials.inheritFromAzureAD or useDefaultAzureCredentials,
                  googleCredentials.gkeEnvironment, a pgBackRest key type auto or
                  web-id): the agent's ServiceAccount and Pod carry what the platform's
                  identity webhook or metadata server needs to grant the agent a role
                  that can read the repository.
                properties:
                  podLabels:
                    additionalProperties:
                      description: |-
                        LabelValue is a Kubernetes label value (the keys are allow-listed by the
                        map's own rule).
                      maxLength: 63
                      pattern: ^([A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?)?$
                      type: string
                    description: |-
                      Labels added to the agent's Pod: azure.workload.identity/use only
                      (Azure workload identity). Any other label could select the agent
                      into a Service or a policy (a CloudNativePG -rw Service, for one).
                    maxProperties: 1
                    type: object
                    x-kubernetes-validations:
                    - message: podLabels accepts only azure.workload.identity/use
                      reason: FieldValueForbidden
                      rule: self.all(k, k == 'azure.workload.identity/use')
                  serviceAccountAnnotations:
                    additionalProperties:
                      type: string
                    description: |-
                      Annotations added to the agent's ServiceAccount, among the identity
                      webhooks' own: eks.amazonaws.com/role-arn,
                      eks.amazonaws.com/sts-regional-endpoints,
                      eks.amazonaws.com/token-expiration (IRSA),
                      azure.workload.identity/client-id, azure.workload.identity/tenant-id
                      (Azure workload identity) and iam.gke.io/gcp-service-account (GKE).
                      Any other ServiceAccount annotation can change what the account is
                      (an OpenShift OAuth client, for one) and is refused.
                    maxProperties: 6
                    type: object
                    x-kubernetes-validations:
                    - message: serviceAccountAnnotations accepts only the workload-identity
                        annotations eks.amazonaws.com/role-arn, eks.amazonaws.com/sts-regional-endpoints,
                        eks.amazonaws.com/token-expiration, azure.workload.identity/client-id,
                        azure.workload.identity/tenant-id and iam.gke.io/gcp-service-account
                      reason: FieldValueForbidden
                      rule: self.all(k, k in ['eks.amazonaws.com/role-arn', 'eks.amazonaws.com/sts-regional-endpoints',
                        'eks.amazonaws.com/token-expiration', 'azure.workload.identity/client-id',
                        'azure.workload.identity/tenant-id', 'iam.gke.io/gcp-service-account'])
                type: object
            required:
            - clusterRef
            type: object
            x-kubernetes-validations:
            - fieldPath: .exposure.type
              message: 'the evidence agent is reachable in-cluster only: exposure.type
                must be clusterIP'
              reason: FieldValueForbidden
              rule: '!has(self.exposure) || self.exposure.type == ''clusterIP'''
            - fieldPath: .pgbackrest
              message: 'pgbackrest reads a Cluster backed up with a pgBackRest plugin:
                objectStoreRef and serverName are barman-cloud settings'
              reason: FieldValueForbidden
              rule: '!has(self.pgbackrest) || (!has(self.objectStoreRef) && !has(self.serverName))'
          status:
            description: |-
              EvidenceAgentStatus is the observed state of an EvidenceAgent. A console
              reads endpoint, caBundle, fingerprint and producerEpoch to call the agent
              and to judge its answers (docs: the evidence agent channel).
            properties:
              caBundle:
                description: |-
                  PEM CA bundle that verifies the agent's serving certificate for the
                  endpoint's host. Public material, never a key.
                format: byte
                maxLength: 65536
                type: string
              conditions:
                description: |-
                  Conditions: Ready (summary), ConfigurationValid, WorkloadReady,
                  ServingCertificateReady, Progressing and Stalled.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: The in-cluster HTTPS URL of the agent's Service.
                maxLength: 512
                type: string
              fingerprint:
                description: |-
                  The repository identity the agent reads (sha256: domain-separated,
                  region-free fingerprint of endpoint, bucket, prefix, format and
                  server); a snapshot whose destination_fingerprint differs is not this
                  repository's.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              image:
                description: The image reference the agent runs.
                maxLength: 512
                type: string
              objectStoreName:
                description: The resolved ObjectStore and Barman server name.
                maxLength: 253
                type: string
              observedGeneration:
                description: The generation the status was computed from.
                format: int64
                type: integer
              pgbackrest:
                description: |-
                  The resolved pgBackRest repository, for a Cluster backed up with a
                  pgBackRest plugin.
                properties:
                  archiveStanza:
                    description: |-
                      The stanza the WAL is read under, when it differs from stanza
                      (Opera's configuration.stanza): a restore must name it.
                    maxLength: 256
                    type: string
                  kind:
                    description: |-
                      The plugin's object in this namespace: a Stanza (Dalibo) or an
                      Archive (Opera).
                    enum:
                    - Stanza
                    - Archive
                    type: string
                  objectName:
                    maxLength: 253
                    type: string
                  plugin:
                    description: 'The plugin: pgbackrest.dalibo.com or pgbackrest.cnpg.opera.com.'
                    maxLength: 253
                    type: string
                  repository:
                    description: The repository number read (repo<n>).
                    format: int32
                    type: integer
                  stanza:
                    description: The stanza the backups are read under.
                    maxLength: 256
                    type: string
                required:
                - kind
                - objectName
                - plugin
                type: object
              producerEpoch:
                description: |-
                  The configuration epoch of the running agent: the generation its
                  Deployment was rendered from, published once that rollout completed.
                  Every snapshot carries it as producer_epoch; a snapshot with an older
                  epoch comes from a superseded configuration.
                format: int64
                type: integer
              serverName:
                maxLength: 256
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be a DNS-1035 label of at most 40 characters
            (it prefixes generated object names)
          reason: FieldValueInvalid
          rule: size(self.metadata.name) <= 40 && self.metadata.name.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
