{{- if and .Values.operator.enabled .Values.operator.admissionPolicy.enabled }}
{{- /*
ON BY DEFAULT (operator.admissionPolicy.enabled): a ValidatingAdmissionPolicy, evaluated by
the API server in CEL, with no webhook to keep available. The CRDs' own CEL cannot
see who is asking; this one rule needs it. spec.image on a PgAdmin or an
EvidenceAgent replaces the operator's vetted default image, so only the listed
users and groups may set it; spec.workloadIdentity on an EvidenceAgent binds
its ServiceAccount to a cloud identity (and is the opt-in to use it), so it
has its own list. The operator's own writes are status-subresource updates,
which this policy does not match.

Third rule: whoever may edit a PgToolBoxConsole, a PgAdmin or an
EvidenceAgent could otherwise name any Secret of its namespace in a Secret
reference (SMTP password, webhook URL, OIDC client secret, Prometheus token,
pull secret, the agent's allowedSecrets, ...) and have the operator mount it
into a workload that sends it to a server the editor chose. The CRDs' CEL
cannot ask the API server who may read a Secret; the `authorizer` of a policy
can: every Secret the spec names must be one the requesting user may `get`. On
UPDATE only the references that are new or changed are checked: the operator's
own metadata writes (finalizers, annotations) and unrelated edits of an object
created before the policy was turned on keep working, and a Secret that was
already referenced at that field, sent to the same place, is no new
disclosure. A reference moved to another field is "new"; so is a kept
reference whose destination changed (the issuer, Prometheus URL, SMTP
address, tracing endpoint or image repository it is sent to, the CA it is
trusted with, the Cluster, ObjectStore and pgBackRest endpoint an agent sends
its allowedSecrets to). The lists
(_admissionpolicy.tpl) follow api/v1alpha1: TestSecretRefPolicyCoversTheAPI
in internal/operator/admissionpolicy walks the Go types and fails on a
missing path, a missing has() guard or a missing destination; the envtest
there evaluates each field.

Fourth rule: a PgAdmin hands whoever opens it the credentials of the Clusters
it registers (spec.credentials: the application user and DatabaseRoles by
default, the superuser on request). Their Secrets are named by the Cluster,
not by the PgAdmin, so the policy cannot name them: creating a PgAdmin that
offers credentials of Clusters of its namespace, or widening what it offers
(a credential kind, a Cluster, the selector), requires `get` on the Secrets of
the namespace. So does spec.configDatabase (the operator creates a login role
on that Cluster and hands its password to the pgAdmin Pod, which offers it),
and changing who may sign in to such a PgAdmin (spec.auth but its display
name, spec.admins) or raising the OpenShift proxy's sessionMaxAge: widening
the audience, or how long a revoked person keeps a session, hands the same
credentials to more people. Cross-namespace Clusters are the PgAdminAccess
grant's decision.

Sixth rule: spec.exposure.annotations and metadataPropagation rules for All
or Exposure land on the Ingress, Route or HTTPRoute the operator writes, rules
for All or Service on the Service it routes to. The annotations an ingress
controller reads as configuration that changes who reaches the workload, which
host it claims or where its traffic goes (snippets, external authentication,
source ranges, redirects, canaries, extra hosts, load-balancer scheme and
groups, mirroring, middlewares, plugins; the data list
pgtoolbox.admission.exposureDenyList) require create on the exposure kind in
the namespace: the operator must not write for an editor what the editor could
not write. The exposure type, hostname (EXPOSURE_ALLOWED_HOST_SUFFIXES),
ingressClassName and Gateway parentRef are not gated: choosing the exposure is
what an editor is allowed to do.

Fifth rule: spec.prometheus.projectedToken sends the console ServiceAccount's
own token to spec.prometheus.url. Setting it, or changing where it goes (URL,
CA ConfigMap, audience), requires create on serviceaccounts/token for that
ServiceAccount (<name>, or <name>-console when the name does not contain
"console"; PgToolBoxConsole.WorkloadName), the power to mint the same token.
*/ -}}
{{- $ap := .Values.operator.admissionPolicy }}
{{- $io := $ap.imageOverride }}
{{- $wi := $ap.workloadIdentity }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "pgtoolbox.fullname" . }}-image-override
  labels:
    {{- include "pgtoolbox.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [pgtoolbox.fyannk.dev]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [pgadmins, evidenceagents, pgtoolboxconsoles]
  variables:
    - name: allowedUsers
      expression: {{ toJson $io.allowedUsers | quote }}
    - name: allowedGroups
      expression: {{ toJson $io.allowedGroups | quote }}
    - name: identityUsers
      expression: {{ toJson $wi.allowedUsers | quote }}
    - name: identityGroups
      expression: {{ toJson $wi.allowedGroups | quote }}
    - name: secretRefs
      expression: >-
        {{- include "pgtoolbox.admission.secretRefs" "object" | nindent 8 }}
    - name: oldSecretRefs
      expression: >-
        oldObject == null ? [] : (
        {{- include "pgtoolbox.admission.secretRefs" "oldObject" | nindent 8 }}
        )
    - name: newSecretRefs
      expression: >-
        variables.secretRefs.filter(r, !(oldObject != null && r in variables.oldSecretRefs))
    - name: prometheusTokenTo
      expression: >-
        {{- include "pgtoolbox.admission.prometheusTokenTo" "object" | nindent 8 }}
    - name: oldPrometheusTokenTo
      expression: >-
        oldObject == null ? '' : (
        {{- include "pgtoolbox.admission.prometheusTokenTo" "oldObject" | nindent 8 }}
        )
    - name: consoleServiceAccount
      expression: >-
        object.metadata.name.contains('console') ? object.metadata.name : object.metadata.name + '-console'
    - name: pgadminAudienceKept
      expression: >-
        request.resource.resource == 'pgadmins' && (
        {{- include "pgtoolbox.admission.pgadminAudienceKept" . | nindent 8 }}
        )
    - name: credentialKinds
      expression: >-
        request.resource.resource != 'pgadmins' ? [] : (
        {{- include "pgtoolbox.admission.credentialKinds" "object" | nindent 8 }}
        )
    - name: credentialSources
      expression: >-
        request.resource.resource != 'pgadmins' ? [] : (
        {{- include "pgtoolbox.admission.credentialSources" "object" | nindent 8 }}
        )
    - name: oldCredentialKinds
      expression: >-
        oldObject == null || request.resource.resource != 'pgadmins' ? [] : (
        {{- include "pgtoolbox.admission.credentialKinds" "oldObject" | nindent 8 }}
        )
    - name: oldCredentialSources
      expression: >-
        oldObject == null || request.resource.resource != 'pgadmins' ? [] : (
        {{- include "pgtoolbox.admission.credentialSources" "oldObject" | nindent 8 }}
        )
    - name: exposureType
      expression: >-
        request.resource.resource == 'evidenceagents' || !has(object.spec.exposure) || !has(object.spec.exposure.type) ? 'clusterIP' : string(object.spec.exposure.type)
    - name: oldExposureType
      expression: >-
        oldObject == null ? '' : request.resource.resource == 'evidenceagents' || !has(oldObject.spec.exposure) || !has(oldObject.spec.exposure.type) ? 'clusterIP' : string(oldObject.spec.exposure.type)
    - name: exposureAnnotationsKept
      expression: >-
        {{- include "pgtoolbox.admission.exposureAnnotationsKept" . | nindent 8 }}
  validations:
    - expression: >-
        request.resource.resource == 'pgtoolboxconsoles' ||
        !has(object.spec.image) ||
        (oldObject != null && has(oldObject.spec.image) && object.spec.image == oldObject.spec.image) ||
        request.userInfo.username in variables.allowedUsers ||
        request.userInfo.groups.exists(g, g in variables.allowedGroups)
      message: spec.image may be set only by the users and groups the platform team listed in the operator chart (operator.admissionPolicy.imageOverride); omit it to use the operator's default image
      reason: Forbidden
    - expression: >-
        request.resource.resource != 'evidenceagents' ||
        !has(object.spec.workloadIdentity) ||
        (oldObject != null && has(oldObject.spec.workloadIdentity) && object.spec.workloadIdentity == oldObject.spec.workloadIdentity) ||
        request.userInfo.username in variables.identityUsers ||
        request.userInfo.groups.exists(g, g in variables.identityGroups)
      message: spec.workloadIdentity may be set only by the users and groups the platform team listed in the operator chart (operator.admissionPolicy.workloadIdentity)
      reason: Forbidden
    # An authorizer check costs most of an expression's CEL runtime budget
    # (about two fit), so the rule is two validations: a change that adds
    # more than two Secret references needs get on every Secret of the
    # namespace (one check), and one that adds one or two is checked name
    # by name (get on the namespace's Secrets covers those names too).
    - expression: >-
        variables.newSecretRefs.size() <= 2 ||
        authorizer.group('').resource('secrets').namespace(object.metadata.namespace).check('get').allowed()
      message: editing a PgToolBoxConsole, a PgAdmin or an EvidenceAgent requires get on every Secret it references; a change that adds more than two Secret references at once requires get on every Secret of the namespace (a kept reference whose destination changed counts as added)
      reason: Forbidden
    - expression: >-
        variables.newSecretRefs.size() == 0 || variables.newSecretRefs.size() > 2 ||
        variables.newSecretRefs.all(r,
        authorizer.group('').resource('secrets').namespace(object.metadata.namespace).name(r.n).check('get').allowed())
      message: editing a PgToolBoxConsole, a PgAdmin or an EvidenceAgent requires get on every Secret it references (a Secret reference you may not read is refused, whichever field names it, and a kept reference whose destination changed is checked again)
      reason: Forbidden
    # The projected Prometheus token is the console ServiceAccount's own
    # token: sending it to a new URL (or trusting a new CA, or another
    # audience) takes what minting it takes.
    - expression: >-
        variables.prometheusTokenTo == '' ||
        (oldObject != null && variables.prometheusTokenTo == variables.oldPrometheusTokenTo) ||
        authorizer.group('').resource('serviceaccounts').subresource('token').namespace(object.metadata.namespace).name(variables.consoleServiceAccount).check('create').allowed()
      message: a PgToolBoxConsole that sends its projected ServiceAccount token to Prometheus (spec.prometheus.projectedToken) requires create on serviceaccounts/token for the console's ServiceAccount; changing the URL, the CA ConfigMap or the audience is checked again
      reason: Forbidden
    - expression: >-
        request.resource.resource != 'pgadmins' ||
        ((variables.credentialKinds.size() == 0 || variables.credentialSources.size() == 0) && !has(object.spec.configDatabase)) ||
        (oldObject != null &&
        variables.credentialKinds.all(k, k in variables.oldCredentialKinds) &&
        variables.credentialSources.all(s, s in variables.oldCredentialSources) &&
        (!has(object.spec.clusterSelector) || (has(oldObject.spec.clusterSelector) && object.spec.clusterSelector == oldObject.spec.clusterSelector)) &&
        (!has(object.spec.configDatabase) || (has(oldObject.spec.configDatabase) && object.spec.configDatabase == oldObject.spec.configDatabase)) &&
        variables.pgadminAudienceKept) ||
        authorizer.group('').resource('secrets').namespace(object.metadata.namespace).check('get').allowed()
      message: a PgAdmin that offers the credentials of Clusters of its namespace (spec.credentials) or keeps its settings on one (spec.configDatabase, whose login role pgAdmin holds) requires get on the Secrets of the namespace, since whoever opens pgAdmin holds them; adding a credential kind or a Cluster, changing who may sign in (spec.auth, spec.admins) or raising the OpenShift proxy's sessionMaxAge is checked again
      reason: Forbidden
    # An ingress controller reads some annotations as configuration
    # (pgtoolbox.admission.exposureDenyList): the operator would write them
    # on the Ingress, Route, HTTPRoute or Service for an editor who may not
    # create the exposure object. Adding or changing one takes create on
    # that kind in the namespace.
    - expression: >-
        variables.exposureAnnotationsKept ||
        authorizer.group(variables.exposureType == 'route' ? 'route.openshift.io' : variables.exposureType == 'gateway' ? 'gateway.networking.k8s.io' : 'networking.k8s.io').resource(variables.exposureType == 'route' ? 'routes' : variables.exposureType == 'gateway' ? 'httproutes' : 'ingresses').namespace(object.metadata.namespace).check('create').allowed()
      message: an exposure annotation that an ingress controller reads as configuration (a snippet, authentication, a source range, a redirect, a canary, an extra host, a load-balancer scheme or group, mirroring, a middleware or plugin; see the security documentation), on the exposure object or the Service, requires create on the exposure kind (ingresses, routes or httproutes) in the namespace; adding or changing one, or changing the exposure type, is checked again
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "pgtoolbox.fullname" . }}-image-override
  labels:
    {{- include "pgtoolbox.labels" . | nindent 4 }}
spec:
  policyName: {{ include "pgtoolbox.fullname" . }}-image-override
  validationActions:
    {{- toYaml $ap.validationActions | nindent 4 }}
{{- end }}
