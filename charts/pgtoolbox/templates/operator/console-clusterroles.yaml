{{- if .Values.operator.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgtoolbox-console
  labels:
    {{- include "pgtoolbox.labels" . | nindent 4 }}
rules:
# CloudNativePG kinds the read model watches.
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  - backups
  - scheduledbackups
  - poolers
  - databases
  - databaseroles
  - publications
  - subscriptions
  - failoverquorums
  - imagecatalogs
  verbs:
  - get
  - list
  - watch
# Where plugin-based backups report their recovery window (barman-cloud
# ObjectStores, and the pgBackRest plugins' Stanzas and Archives).
- apiGroups:
  - barmancloud.cnpg.io
  resources:
  - objectstores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pgbackrest.dalibo.com
  resources:
  - stanzas
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pgbackrest.cnpg.opera.com
  resources:
  - archives
  verbs:
  - get
  - list
  - watch
# Link-outs to the objects the operator owns.
- apiGroups:
  - pgtoolbox.fyannk.dev
  resources:
  - pgadmins
  - evidenceagents
  - pgaccessrequests
  verbs:
  - get
  - list
  - watch
# Instance and pooler pods, their claims, the Services clients dial.
- apiGroups:
  - ""
  resources:
  - pods
  - persistentvolumeclaims
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  - resourcequotas
  verbs:
  - list
  - watch
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
# Major-upgrade Jobs.
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
# Pooler pods are owned through Pod -> ReplicaSet -> Deployment -> Pooler.
- apiGroups:
  - apps
  resources:
  - replicasets
  - deployments
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgtoolbox-console-pod-logs
  labels:
    {{- include "pgtoolbox.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgtoolbox-console-restore-drills
  labels:
    {{- include "pgtoolbox.labels" . | nindent 4 }}
rules:
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - pgtoolbox.fyannk.dev
  resources:
  - restoredrills
  verbs:
  - teardown
{{- end }}
