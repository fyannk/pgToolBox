{{- if and .Values.operator.enabled .Values.operator.config.watchNamespaces }}
{{- /* watchNamespaces set: the manager ClusterRole is bound only in the
listed namespaces, so the operator's own namespace grants it nothing unless
listed. At start it reads its optional ConfigMap and Secret there (cmd/operator
--config-map and --config-secret, which the chart leaves at their default
pgtoolbox-operator-config; hack/validate-packaging.sh checks both match): get
on those two names and nothing else. Leader election and its events have their
own Role (leader-election-role.yaml). Harmless when the release namespace is
also watched: RBAC is additive. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pgtoolbox.fullname" . }}-config
  namespace: {{ include "pgtoolbox.namespace" . }}
  labels:
    {{- include "pgtoolbox.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resourceNames:
  - pgtoolbox-operator-config
  resources:
  - configmaps
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pgtoolbox.fullname" . }}-config
  namespace: {{ include "pgtoolbox.namespace" . }}
  labels:
    {{- include "pgtoolbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pgtoolbox.fullname" . }}-config
subjects:
- kind: ServiceAccount
  name: {{ include "pgtoolbox.fullname" . }}
  namespace: {{ include "pgtoolbox.namespace" . }}
{{- end }}
