{{- $guard := .Values.operator.restoreDrillGuard.enabled }}
{{- if and .Values.operator.enabled (or (eq (toString $guard) "true") (and (eq (toString $guard) "auto") (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy"))) }}
# Generated from config/admission/restore_drill_guard.yaml by hack/sync-manifests.sh; do not edit.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pgtoolbox-console-restore-drills
  labels:
    app.kubernetes.io/part-of: pgtoolbox
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - postgresql.cnpg.io
      apiVersions:
      - '*'
      operations:
      - DELETE
      resources:
      - clusters
  matchConditions:
  # Any ServiceAccount, whatever its name or namespace: the drills role's
  # marker, not a naming convention, says it is a console. A ServiceAccount of
  # another namespace is concerned too: the operator, which may bind the drills
  # role in the namespaces it watches, must not be able to delete their
  # Clusters by binding it to itself (or to anyone outside the namespace).
  - name: service-account
    expression: >-
      request.userInfo.username.startsWith('system:serviceaccount:')
  variables:
  # Bound to the drills ClusterRole in this namespace.
  - name: drillTeardown
    expression: >-
      authorizer.group('pgtoolbox.fyannk.dev').resource('restoredrills').namespace(request.namespace).check('teardown').allowed()
  # A ServiceAccount holding every verb on restoredrills in this namespace
  # (a wildcard rule: cluster-admin, admin of everything, a namespaced GitOps
  # controller's */*/* Role) is an administrator, not a console: not
  # concerned, wherever it lives. The drills role names the verb teardown,
  # never *, so binding it, even cluster-wide, does not make an
  # administrator; and nobody can grant * without holding it (RBAC
  # escalation prevention): the operator, whose bind covers only the three
  # console roles and which holds no right on restoredrills, cannot.
  - name: administrator
    expression: >-
      authorizer.group('pgtoolbox.fyannk.dev').resource('restoredrills').namespace(request.namespace).check('*').allowed()
  validations:
  - expression: >-
      !variables.drillTeardown || variables.administrator ||
      (has(oldObject.metadata.labels) &&
      'pgtoolbox.fyannk.dev/drill-owner' in oldObject.metadata.labels &&
      oldObject.metadata.labels['pgtoolbox.fyannk.dev/drill-owner'] == request.namespace &&
      'pgtoolbox.fyannk.dev/restore-drill-of' in oldObject.metadata.labels &&
      has(oldObject.metadata.annotations) &&
      'pgtoolbox.fyannk.dev/restore-drill-seal' in oldObject.metadata.annotations)
    message: a ServiceAccount holding the restore-drill teardown right may delete only the restore drill Clusters it created (drill-owner label, drill label, drill seal)
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pgtoolbox-console-restore-drills
  labels:
    app.kubernetes.io/part-of: pgtoolbox
spec:
  policyName: pgtoolbox-console-restore-drills
  validationActions:
  - Deny
{{- end }}
