{{- $guard := .Values.operator.restoreDrillGuard.enabled }}
{{- if and .Values.operator.enabled (or (eq (toString $guard) "true") (and (eq (toString $guard) "auto") (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy"))) }}
# Generated from config/admission/restore_drill_guard.yaml by hack/sync-manifests.sh; do not edit.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pgtoolbox-console-restore-drills
  labels:
    app.kubernetes.io/part-of: pgtoolbox
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - postgresql.cnpg.io
      apiVersions:
      - '*'
      operations:
      - DELETE
      resources:
      - clusters
  matchConditions:
  # Any ServiceAccount, whatever its name or namespace: the drills role's
  # marker, not a naming convention, says it is a console. A ServiceAccount of
  # another namespace is concerned too: the operator, which may bind the drills
  # role in the namespaces it watches, must not be able to delete their
  # Clusters by binding it to itself (or to anyone outside the namespace).
  - name: service-account
    expression: >-
      request.userInfo.username.startsWith('system:serviceaccount:')
  variables:
  # Bound to the drills ClusterRole in this namespace.
  - name: drillTeardown
    expression: >-
      authorizer.group('pgtoolbox.fyannk.dev').resource('restoredrills').namespace(request.namespace).check('teardown').allowed()
  # A ServiceAccount of another namespace holding every verb on every
  # namespace's restoredrills (a wildcard: cluster-admin, a GitOps controller)
  # is an administrator, not a console: not concerned. The drills role names
  # the verb teardown, never *, so binding it, even cluster-wide, does not
  # make an administrator.
  - name: administrator
    expression: >-
      !request.userInfo.username.startsWith('system:serviceaccount:' + request.namespace + ':') &&
      authorizer.group('pgtoolbox.fyannk.dev').resource('restoredrills').check('*').allowed()
  validations:
  - expression: >-
      !variables.drillTeardown || variables.administrator ||
      (has(oldObject.metadata.labels) &&
      'pgtoolbox.fyannk.dev/drill-owner' in oldObject.metadata.labels &&
      oldObject.metadata.labels['pgtoolbox.fyannk.dev/drill-owner'] == request.namespace &&
      'pgtoolbox.fyannk.dev/restore-drill-of' in oldObject.metadata.labels &&
      has(oldObject.metadata.annotations) &&
      'pgtoolbox.fyannk.dev/restore-drill-seal' in oldObject.metadata.annotations)
    message: a ServiceAccount holding the restore-drill teardown right may delete only the restore drill Clusters it created (drill-owner label, drill label, drill seal)
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pgtoolbox-console-restore-drills
  labels:
    app.kubernetes.io/part-of: pgtoolbox
spec:
  policyName: pgtoolbox-console-restore-drills
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pgtoolbox-console-restore-drill-prefix
  labels:
    app.kubernetes.io/part-of: pgtoolbox
spec:
  failurePolicy: Ignore
  paramKind:
    apiVersion: pgtoolbox.fyannk.dev/v1alpha1
    kind: PgToolBoxConsole
  matchConstraints:
    resourceRules:
    - apiGroups:
      - postgresql.cnpg.io
      apiVersions:
      - '*'
      operations:
      - DELETE
      resources:
      - clusters
  matchConditions:
  - name: namespace-service-account
    expression: >-
      request.userInfo.username.startsWith('system:serviceaccount:' + request.namespace + ':')
  variables:
  # The console's ServiceAccount: PgToolBoxConsole.WorkloadName().
  - name: account
    expression: >-
      'system:serviceaccount:' + params.metadata.namespace + ':' +
      (params.metadata.name.contains('console') ? params.metadata.name : params.metadata.name + '-console')
  - name: prefix
    expression: >-
      has(params.spec.restoreDrills) && has(params.spec.restoreDrills.prefix) && params.spec.restoreDrills.prefix != '' ?
      params.spec.restoreDrills.prefix : 'drill-'
  validations:
  - expression: >-
      request.userInfo.username != variables.account ||
      oldObject.metadata.name.startsWith(variables.prefix)
    message: a console's ServiceAccount may delete only Clusters named with its restore drill prefix
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pgtoolbox-console-restore-drill-prefix
  labels:
    app.kubernetes.io/part-of: pgtoolbox
spec:
  policyName: pgtoolbox-console-restore-drill-prefix
  paramRef:
    selector: {}
    parameterNotFoundAction: Allow
  validationActions:
  - Deny
{{- end }}
