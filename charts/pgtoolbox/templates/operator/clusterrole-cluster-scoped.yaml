{{- if and .Values.operator.enabled .Values.operator.config.watchNamespaces }}
{{- /* The rules of the manager ClusterRole that name cluster-scoped resources
(or the one namespaced object the API server serves in `default`), bound
cluster-wide when watchNamespaces is set. Every rule here is a copy of one in
clusterrole.yaml (the generated one); hack/validate-packaging.sh checks it is a
subset and that nothing else in the manager role is cluster-scoped.
Not here: `bind` on the console ClusterRoles. The operator binds them only by
RoleBindings in a watched namespace, where the per-namespace RoleBinding of the
manager role grants `bind`; held cluster-wide next to `create
clusterrolebindings`, it would let the operator's token bind
pgtoolbox-console-restore-drills (delete Clusters) or -pod-logs to itself in
every namespace. hack/validate-packaging.sh refuses bind, escalate,
impersonate and every namespaced resource in this role. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "pgtoolbox.labels" . | nindent 4 }}
  name: {{ include "pgtoolbox.fullname" . }}-manager-cluster-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - list
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - discovery.k8s.io
  resourceNames:
  - kubernetes
  resources:
  - endpointslices
  verbs:
  - get
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  - clusterroles
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resourceNames:
  - pgtoolbox-evidence-agent
  resources:
  - clusterrolebindings
  - clusterroles
  verbs:
  - patch
  - update
- apiGroups:
  - security.openshift.io
  resources:
  - securitycontextconstraints
  verbs:
  - list
{{- end }}
