{{- if .Values.operator.enabled }}
{{- /* watchNamespaces set: the manager ClusterRole is bound per namespace, so
the operator holds Secrets, workloads and RBAC objects only where it watches.
The namespaces must exist at install time. */}}
{{- range $ns := .Values.operator.config.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pgtoolbox.fullname" $ }}-manager
  namespace: {{ $ns | quote }}
  labels:
    {{- include "pgtoolbox.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pgtoolbox.fullname" $ }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "pgtoolbox.fullname" $ }}
  namespace: {{ include "pgtoolbox.namespace" $ }}
{{- end }}
{{- end }}
