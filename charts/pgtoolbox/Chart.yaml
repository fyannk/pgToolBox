apiVersion: v2
name: pgtoolbox
description: The pgToolBox operator for CloudNativePG - reconciles PgToolBoxConsole, PgAdmin and EvidenceAgent, once per cluster or per set of namespaces.
type: application
# Kubernetes 1.28 or newer, as the product documents. The pre-release suffix
# keeps managed distributions (1.28.3-gke.100, v1.29.4+k3s1) in range.
kubeVersion: ">=1.28.0-0"
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - operator
  - postgresql
  - cloudnativepg
  - pgadmin
  - openshift
home: https://github.com/fyannk/pgToolBox
icon: https://raw.githubusercontent.com/fyannk/pgToolBox/v0.1.0/docs/site/static/img/logo.png
sources:
  - https://github.com/fyannk/pgToolBox
maintainers:
  - name: fyannk
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
