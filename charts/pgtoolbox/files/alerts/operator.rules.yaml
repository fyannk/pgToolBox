# Alerts on the operator's start-up decisions (docs/site/docs/operator/metrics.md).
# Plain Prometheus rule groups: the chart wraps them in a PrometheusRule
# (operator.metrics.prometheusRule.enabled) and `make rules-test` runs
# hack/rules/operator.rules.test.yaml against this file with promtool.
#
# pgtoolbox_watch_namespaces_dropped{reason} is set at start and changes only
# with a restart, or when the background review of a review-failed namespace
# turns too large or too slow (the namespace moves to that reason, which no
# restart of its own follows); every replica exports it, hence max, not sum.
groups:
  - name: pgtoolbox-operator
    rules:
      - alert: PgToolBoxOperatorNamespacesDropped
        expr: max by (namespace, reason) (pgtoolbox_watch_namespaces_dropped) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The pgToolBox operator in {{ $labels.namespace }} left {{ $value }} watched namespace(s) out at start ({{ $labels.reason }})"
          description: "Namespaces of WATCH_NAMESPACES are not reconciled: their PgAdmins, consoles and evidence agents keep a status nobody updates. The operator log names each namespace. {{ if eq $labels.reason \"permissions\" }}The operator lacks a permission of its manager role there (a narrower Role): restore the chart's manager RoleBinding, then restart the operator.{{ else if eq $labels.reason \"review-failed\" }}The permission review there failed (an API server error, a reset or refused connection, or no answer from the API server at all): the operator reviews it again every minute and restarts on its own to watch it once it passes twice in a row and the process has run ten minutes; check the API server if this lasts.{{ else if eq $labels.reason \"review-too-large\" }}The permission review there answered too much (its RoleBindings grant the operator far more rules than its manager role): remove the extra bindings, then restart the operator; only a start reviews it again.{{ else if eq $labels.reason \"review-too-slow\" }}The permission review there got no answer in time at every attempt while the API server answered other requests (most likely its RoleBindings grant the operator far more rules than its manager role; or the API server is overloaded): remove the extra bindings or check the API server, then restart the operator; only a start reviews it again.{{ else if eq $labels.reason \"clusters-unlistable\" }}CloudNativePG Clusters may not be listed there (the namespace deleted, or the operator not bound): recreate or bind it, then restart the operator.{{ end }}"
          runbook_url: "https://github.com/fyannk/pgToolBox/blob/main/docs/site/docs/operator/index.md#namespaces-dropped-from-the-watch"
