# NOTES.txt tells the installer what was created, how to check it and what to do
# next; with the operator off it says the release is empty.
suite: install notes
templates:
  - templates/NOTES.txt
release:
  name: pgtoolbox
  namespace: pgtoolbox
tests:
  - it: names the installed version, the checks and the next steps
    asserts:
      - matchRegexRaw: {pattern: "pgToolBox operator [0-9]+\\.[0-9]+\\.[0-9]+.* is installed in namespace pgtoolbox"}
      - matchRegexRaw: {pattern: "kubectl -n pgtoolbox rollout status deploy/pgtoolbox"}
      - matchRegexRaw: {pattern: "kubectl get crd \\| grep pgtoolbox.fyannk.dev"}
      - matchRegexRaw: {pattern: "Next steps"}
      - matchRegexRaw: {pattern: "pgtoolbox-console-viewer"}
      - matchRegexRaw: {pattern: "github.com/fyannk/pgToolBox/tree/main/docs/site/docs/operator/"}
  - it: says which namespaces it watches
    set: {operator.config.watchNamespaces: [team-a, team-b]}
    asserts:
      - matchRegexRaw: {pattern: "watching team-a, team-b"}
  - it: points at the metrics pieces according to the values
    set: {operator.metrics.podMonitor.enabled: true, operator.metrics.readerClusterRole: true}
    asserts:
      - matchRegexRaw: {pattern: "a PodMonitor scrapes"}
      - matchRegexRaw: {pattern: "pgtoolbox-metrics-reader"}
  - it: says the release is empty when the operator is off
    set: {operator.enabled: false}
    asserts:
      - matchRegexRaw: {pattern: "operator.enabled is false: this release renders nothing"}
  - it: warns when the restore-drill guard is disabled
    set: {operator.restoreDrillGuard.enabled: false}
    asserts:
      - matchRegexRaw: {pattern: "restore-drill delete guard is NOT rendered"}
      - matchRegexRaw: {pattern: "restoreDrillGuard.enabled=false"}
  - it: warns when the guard is auto and the cluster serves no policy API
    set: {operator.restoreDrillGuard.enabled: auto}
    asserts:
      - matchRegexRaw: {pattern: "serves no ValidatingAdmissionPolicy API"}
  - it: is quiet about the guard when it is rendered
    asserts:
      - notMatchRegexRaw: {pattern: "restore-drill delete guard is NOT rendered"}
  - it: is quiet about the guard when auto finds the API
    set: {operator.restoreDrillGuard.enabled: auto}
    capabilities:
      apiVersions: [admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy]
    asserts:
      - notMatchRegexRaw: {pattern: "restore-drill delete guard is NOT rendered"}
