apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pgtoolbox.fullname" . }}-leader-election
  namespace: {{ include "pgtoolbox.namespace" . }}
  labels:
    {{- include "pgtoolbox.labels" . | nindent 4 }}
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
