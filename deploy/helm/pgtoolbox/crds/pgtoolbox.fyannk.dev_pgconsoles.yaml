                        format: int32
                        maximum: 2000
                        minimum: 1
                        type: integer
                      maxBytes:
                        description: Maximum bytes returned per request. Defaults
                          to 1048576 (1Mi).
                        format: int32
                        maximum: 8388608
                        minimum: 4096
                        type: integer
                    type: object
