# Default values for pgtoolbox.

# nameOverride replaces the chart name in resource names.
nameOverride: ""
# fullnameOverride replaces the fully-qualified app name in resource names.
fullnameOverride: ""

# namespace controls where the operator is installed. When create is true the
# chart creates the namespace; otherwise the release namespace is used.
namespace:
  name: pgtoolbox
  create: false

# replicaCount is the number of manager replicas.
replicaCount: 2

# image is the operator (manager) image. An empty tag means the chart's
# appVersion: a chart installed at 0.1.0 runs 0.1.0, rather than whatever a
# floating tag resolves to on the day it is installed.
image:
  repository: ghcr.io/fyannk/pgtoolbox
  tag: ""
  pullPolicy: IfNotPresent

# proxyImage is the default pgtoolbox-proxy image for consoles that name
# none. Empty means proxyImageRepository at the operator's own version: the
# proxy is released from this repository alongside the operator, and running
# a mismatched pair is not a supported combination.
proxyImage: ""
proxyImageRepository: ghcr.io/fyannk/pgtoolbox-proxy

# Default application images used when a PgConsole spec omits them. These
# are separate projects on their own release cadence, so they are pinned to
# the versions this operator was tested against.
defaultImages:
  pgConsole: ghcr.io/fyannk/pgconsole:0.6.1
  pgAdmin: ghcr.io/fyannk/pgadmin:9.17-hardened
  objectStoreViewer: ghcr.io/fyannk/pgobjectstoreviewer:0.1.2

# leaderElection enables controller-runtime leader election.
leaderElection: true

metricsBindAddress: ":8080"
healthProbeBindAddress: ":8081"

# resources for the manager container.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# podSecurityContext for the manager pod.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# securityContext for the manager container.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# livenessProbe and readinessProbe.
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

# commonLabels are added to every resource.
commonLabels: {}
# podLabels are added to the manager pod template.
podLabels: {}
# podAnnotations are added to the manager pod template.
podAnnotations: {}
