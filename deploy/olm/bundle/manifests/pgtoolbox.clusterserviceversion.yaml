apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: pgtoolbox.v0.1.0
  namespace: placeholder
  annotations:
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
spec:
  displayName: pgToolBox
  description: >-
    Manages, per CloudNativePG cluster, a complete access stack: an
    authentication proxy, an observation console, and an embedded pgAdmin —
    with declarative user/role provisioning for the proxy and pgAdmin.
  keywords:
  - postgresql
  - cloudnativepg
  - console
  - pgadmin
  - oidc
  - openshift
  version: 0.1.0
  maturity: alpha
  minKubeVersion: 1.28.0
  provider:
    name: fyannk
  links:
  - name: Source
    url: https://github.com/fyannk/pgtoolbox
  installModes:
  - type: OwnNamespace
    supported: true
  - type: SingleNamespace
    supported: false
  - type: MultiNamespace
    supported: false
  - type: AllNamespaces
    supported: true
  customresourcedefinitions:
    owned:
    - name: pgconsoles.pgtoolbox.fyannk.dev
      version: v1alpha1
      kind: PgConsole
      displayName: PgConsole
      description: A pgToolBox console attached to exactly one CloudNativePG cluster.
      resources:
      - kind: Deployment
        version: apps/v1
      - kind: Service
        version: v1
      - kind: ServiceAccount
        version: v1
      - kind: Role
        version: rbac.authorization.k8s.io/v1
      - kind: RoleBinding
        version: rbac.authorization.k8s.io/v1
      - kind: Secret
        version: v1
      - kind: PersistentVolumeClaim
        version: v1
      - kind: NetworkPolicy
        version: networking.k8s.io/v1
      specDescriptors:
      - path: cnpgClusterRef.name
        displayName: CNPG Cluster
        description: The CloudNativePG cluster this console serves.
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
    - name: pgtoolboxroles.pgtoolbox.fyannk.dev
      version: v1alpha1
      kind: PgToolBoxRole
      displayName: PgToolBoxRole
      description: One console authorization level backed by one postgres role.
    - name: pgtoolboxusers.pgtoolbox.fyannk.dev
      version: v1alpha1
      kind: PgToolBoxUser
      displayName: PgToolBoxUser
      description: One identity on one PgConsole.
    - name: pgtoolboxaccessrequests.pgtoolbox.fyannk.dev
      version: v1alpha1
      kind: PgToolBoxAccessRequest
      displayName: PgToolBoxAccessRequest
      description: One request for access to a PgConsole, reviewed by a dba-level user.
  install:
    strategy: deployment
    spec:
      permissions:
      - serviceAccountName: pgtoolbox
        rules:
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
      clusterPermissions:
      - serviceAccountName: pgtoolbox
        rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          - pods
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - list
          - watch
        - apiGroups:
          - ""
          resources:
          - persistentvolumeclaims
          - secrets
          - serviceaccounts
          - services
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - ""
          resources:
          - pods/log
          verbs:
          - get
        - apiGroups:
          - apps
          resources:
          - deployments
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - apps
          resources:
          - replicasets
          verbs:
          - get
        - apiGroups:
          - barmancloud.cnpg.io
          resources:
          - objectstores
          verbs:
          - get
        - apiGroups:
          - batch
          resources:
          - jobs
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - gateway.networking.k8s.io
          resources:
          - gateways
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - gateway.networking.k8s.io
          resources:
          - httproutes
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - networking.k8s.io
          resources:
          - ingresses
          - networkpolicies
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - pgtoolbox.fyannk.dev
          resources:
          - pgconsoles
          - pgtoolboxaccessrequests
          - pgtoolboxroles
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - pgtoolbox.fyannk.dev
          resources:
          - pgconsoles/finalizers
          verbs:
          - update
        - apiGroups:
          - pgtoolbox.fyannk.dev
          resources:
          - pgconsoles/status
          - pgtoolboxaccessrequests/status
          - pgtoolboxroles/status
          verbs:
          - get
          - patch
          - update
        - apiGroups:
          - pgtoolbox.fyannk.dev
          resources:
          - pgtoolboxusers
          verbs:
          - create
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - pgtoolbox.fyannk.dev
          resources:
          - pgtoolboxusers/status
          verbs:
          - patch
          - update
        - apiGroups:
          - policy
          resources:
          - poddisruptionbudgets
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - postgresql.cnpg.io
          resources:
          - backups
          verbs:
          - create
          - get
          - list
          - watch
        - apiGroups:
          - postgresql.cnpg.io
          resources:
          - clusterimagecatalogs
          verbs:
          - get
        - apiGroups:
          - postgresql.cnpg.io
          resources:
          - clusters
          verbs:
          - get
          - list
          - patch
          - watch
        - apiGroups:
          - postgresql.cnpg.io
          resources:
          - clusters/status
          verbs:
          - patch
        - apiGroups:
          - postgresql.cnpg.io
          resources:
          - databaseroles
          - databases
          - failoverquorums
          - imagecatalogs
          - poolers
          - publications
          - scheduledbackups
          - subscriptions
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - rbac.authorization.k8s.io
          resources:
          - clusterrolebindings
          - clusterroles
          - rolebindings
          - roles
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - route.openshift.io
          resources:
          - routes
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
      deployments:
      - name: pgtoolbox
        spec:
          replicas: 2
          selector:
            matchLabels:
              app.kubernetes.io/name: pgtoolbox
          template:
            metadata:
              labels:
                app.kubernetes.io/name: pgtoolbox
            spec:
              serviceAccountName: pgtoolbox
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              containers:
              - name: manager
                image: pgtoolbox:v0.1.0
                args:
                - --leader-elect
                - --metrics-bind-address=:8080
                - --health-probe-bind-address=:8081
                - --operator-image=pgtoolbox:v0.1.0
                ports:
                - containerPort: 8080
                  name: metrics
                  protocol: TCP
                - containerPort: 8081
                  name: probes
                  protocol: TCP
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                    - ALL
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
