      deployments:
      - name: pgtoolbox
        spec:
          replicas: 2
          selector:
            matchLabels:
              app.kubernetes.io/name: pgtoolbox
          template:
            metadata:
              labels:
                app.kubernetes.io/name: pgtoolbox
            spec:
              serviceAccountName: pgtoolbox
              terminationGracePeriodSeconds: 40
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              containers:
              - name: manager
                image: ghcr.io/fyannk/pgtoolbox-operator:0.1.0
                args:
                - --leader-elect
                - --metrics-bind-address=:8080
                - --health-probe-bind-address=:8081
                - --operator-image=ghcr.io/fyannk/pgtoolbox-operator:0.1.0
                - --default-evidence-agent-image=ghcr.io/fyannk/pgtoolbox-evidence-agent:0.1.0
                - --default-console-image=ghcr.io/fyannk/pgtoolbox-console:0.1.0
                # The webhook of webhookdefinitions: the bundle cannot ship the
                # chart's ValidatingAdmissionPolicies.
                - --admission-webhook
                env:
                # The operator's own namespace: where it reads its ConfigMap and Secret.
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                ports:
                - containerPort: 8080
                  name: metrics
                  protocol: TCP
                - containerPort: 8081
                  name: probes
                  protocol: TCP
                - containerPort: 9443
                  name: webhook
                  protocol: TCP
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                    - ALL
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
  # The operator chart's two ValidatingAdmissionPolicies (Secret references,
  # image and workload-identity allow-lists; the restore-drill delete guard),
  # which a bundle cannot ship, as webhooks the operator serves
  # (--admission-webhook, internal/operator/admissionpolicy). OLM issues,
  # mounts and rotates the serving certificate. OLM's webhook definitions
  # take no matchConditions: the guard sees every Cluster delete and admits
  # at once what is not a ServiceAccount's.
  webhookdefinitions:
  - type: ValidatingAdmissionWebhook
    generateName: vresources.pgtoolbox.fyannk.dev
    deploymentName: pgtoolbox
    containerPort: 443
    targetPort: 9443
    webhookPath: /validate-pgtoolbox-resources
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    rules:
    - apiGroups: [pgtoolbox.fyannk.dev]
      apiVersions: [v1alpha1]
      operations: [CREATE, UPDATE]
      resources: [pgadmins, evidenceagents, pgtoolboxconsoles]
  - type: ValidatingAdmissionWebhook
    generateName: vclusterdelete.pgtoolbox.fyannk.dev
    deploymentName: pgtoolbox
    containerPort: 443
    targetPort: 9443
    webhookPath: /validate-cnpg-cluster-delete
    admissionReviewVersions: [v1]
    sideEffects: None
    # Ignore, not the policy's Fail: unscoped, a closed guard would refuse
    # every Cluster delete in the install's namespaces while the operator is down.
    failurePolicy: Ignore
    timeoutSeconds: 5
    rules:
    - apiGroups: [postgresql.cnpg.io]
      apiVersions: ["*"]
      operations: [DELETE]
      resources: [clusters]
  relatedImages:
  - name: manager
    image: ghcr.io/fyannk/pgtoolbox-operator:0.1.0
  - name: pgadmin
    image: ghcr.io/fyannk/pgadmin:9.18-hardened@sha256:96576df8aba0d0057248644d6d5ad398869e42bcf3fcfba2c0f7c13d151ea17c
  - name: evidence-agent
    image: ghcr.io/fyannk/pgtoolbox-evidence-agent:0.1.0
  - name: console
    image: ghcr.io/fyannk/pgtoolbox-console:0.1.0
