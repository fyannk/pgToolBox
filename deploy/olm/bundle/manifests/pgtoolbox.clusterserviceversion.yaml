spec:
  displayName: pgToolBox
  description: >-
    The pgToolBox operator for CloudNativePG. `PgAdmin` runs one pgAdmin per team
    namespace, registered against that namespace's Clusters and signed in with
    the platform's identity provider; `EvidenceAgent` runs a read-only reader of
    one Cluster's backup repository and publishes its endpoint and CA for the
    console. The bundle also ships the `pgtoolbox-console-viewer` and `pgtoolbox-console-operator`
    ClusterRoles to bind per namespace. The team console itself is installed from
    the Helm chart or `config/console`, not from this bundle.

  keywords:
  - postgresql
  - cloudnativepg
  - console
  - pgadmin
  - oidc
  - openshift
  - evidence
  version: 0.1.0
  maturity: alpha
  minKubeVersion: 1.34.0
  icon:
  - base64data: 
    mediatype: image/png
  provider:
    name: fyannk
  links:
  - name: Source
    url: https://github.com/fyannk/pgToolBox
  installModes:
  - type: OwnNamespace
    supported: false
  - type: SingleNamespace
    supported: false
  - type: MultiNamespace
    supported: false
  - type: AllNamespaces
    supported: true
  customresourcedefinitions:
    owned:
    - name: pgaccessrequests.pgtoolbox.fyannk.dev
      version: v1alpha1
      kind: PgAccessRequest
      displayName: PgAccessRequest
      description: A request for the console's viewer or operator role in a namespace; approving it in the console creates the RoleBinding, the operator removes it on expiry or revocation.
      resources:
      - kind: RoleBinding
        version: rbac.authorization.k8s.io/v1
    - name: evidenceagents.pgtoolbox.fyannk.dev
      version: v1alpha1
      kind: EvidenceAgent
      displayName: EvidenceAgent
      description: A read-only evidence agent for the backup repository of one CloudNativePG Cluster, serving evidence over in-cluster HTTPS.
      resources:
      - kind: Deployment
        version: apps/v1
      - kind: Service
        version: v1
      - kind: ServiceAccount
        version: v1
      - kind: Secret
        version: v1
      - kind: ConfigMap
        version: v1
      - kind: ClusterRole
        version: rbac.authorization.k8s.io/v1
      - kind: ClusterRoleBinding
        version: rbac.authorization.k8s.io/v1
    - name: pgtoolboxconsoles.pgtoolbox.fyannk.dev
      version: v1alpha1
      kind: PgToolBoxConsole
      displayName: PgToolBoxConsole
      description: The operational console of the CloudNativePG Clusters of one namespace, run by the operator (the chart's console, as a resource).
      resources:
      - kind: Deployment
        version: apps/v1
      - kind: Service
        version: v1
      - kind: ServiceAccount
        version: v1
      - kind: Secret
        version: v1
      - kind: ConfigMap
        version: v1
      - kind: PersistentVolumeClaim
        version: v1
      - kind: PodDisruptionBudget
        version: policy/v1
      - kind: Role
        version: rbac.authorization.k8s.io/v1
      - kind: RoleBinding
        version: rbac.authorization.k8s.io/v1
      - kind: ClusterRole
        version: rbac.authorization.k8s.io/v1
      - kind: ClusterRoleBinding
        version: rbac.authorization.k8s.io/v1
    - name: pgadmins.pgtoolbox.fyannk.dev
      version: v1alpha1
      kind: PgAdmin
      displayName: PgAdmin
      description: One pgAdmin for a team namespace, registered against the CloudNativePG Clusters of that namespace.
      resources:
      - kind: Deployment
        version: apps/v1
      - kind: Service
        version: v1
      - kind: ServiceAccount
        version: v1
      - kind: Role
        version: rbac.authorization.k8s.io/v1
      - kind: RoleBinding
        version: rbac.authorization.k8s.io/v1
      - kind: ConfigMap
        version: v1
      - kind: Job
        version: batch/v1
      - kind: PersistentVolumeClaim
        version: v1
      - kind: Database
        version: postgresql.cnpg.io/v1
      - kind: DatabaseRole
        version: postgresql.cnpg.io/v1
    - name: pgadminaccesses.pgtoolbox.fyannk.dev
      version: v1alpha1
      kind: PgAdminAccess
      displayName: PgAdminAccess
      description: A grant, in the namespace of the CloudNativePG Clusters it names, letting a PgAdmin of another namespace register them.
      resources:
      - kind: Role
        version: rbac.authorization.k8s.io/v1
      - kind: RoleBinding
        version: rbac.authorization.k8s.io/v1
  install:
    strategy: deployment
    spec:
      permissions:
      - serviceAccountName: pgtoolbox
        rules:
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
      clusterPermissions:
      - serviceAccountName: pgtoolbox
        rules:
        - apiGroups:
