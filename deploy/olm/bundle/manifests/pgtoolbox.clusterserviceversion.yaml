apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: pgtoolbox.v0.1.0
  namespace: placeholder
  annotations:
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
    capabilities: Basic Install
    categories: Database
    containerImage: ghcr.io/fyannk/pgtoolbox-operator:0.1.0
    createdAt: "2026-11-07T00:00:00Z"
    operatorframework.io/suggested-namespace: pgtoolbox
    operatorframework.io/suggested-namespace-template: '{"kind":"Namespace","apiVersion":"v1","metadata":{"name":"pgtoolbox","labels":{"pod-security.kubernetes.io/enforce":"restricted","pod-security.kubernetes.io/audit":"restricted","pod-security.kubernetes.io/warn":"restricted"}}}'
    repository: https://github.com/fyannk/pgToolBox
    support: https://github.com/fyannk/pgToolBox/issues
    description: Operator for pgToolBox on CloudNativePG — one pgAdmin per team
      namespace and a read-only evidence agent per backup repository.
    alm-examples: |-
      [
        {
          "apiVersion": "pgtoolbox.fyannk.dev/v1alpha1",
          "kind": "PgToolBoxConsole",
          "metadata": {
            "name": "console"
          },
          "spec": {
            "auth": {
              "provider": "oidc",
              "oidc": {
                "issuerURL": "https://idp.example.com/realms/corp",
                "clientID": "pgtoolbox-console-team-a",
                "clientSecretRef": {
                  "name": "pgtoolbox-console-team-a-oidc"
                }
              }
            },
            "exposure": {
              "type": "ingress",
              "hostname": "console.team-a.example.com"
            }
          }
        },
        {
          "apiVersion": "pgtoolbox.fyannk.dev/v1alpha1",
          "kind": "PgAdmin",
          "metadata": {
            "name": "team-a"
          },
          "spec": {
            "clusterRefs": [
              {
                "name": "orders"
              }
            ],
            "endpoints": [
              "rw",
              "ro"
            ],
            "credentials": {
              "superuser": false
            },
            "auth": {
              "oauth2": {
                "issuerURL": "https://idp.example.com/realms/corp",
                "clientID": "pgadmin-team-a",
                "clientSecretRef": {
                  "name": "pgadmin-team-a-oidc"
                },
                "requiredClaims": {
                  "groups": [
                    "team-a-dba"
                  ]
                }
              }
            },
            "admins": [
              "alice@example.com"
            ],
            "storage": {
              "size": "2Gi"
            }
          }
        },
        {
          "apiVersion": "pgtoolbox.fyannk.dev/v1alpha1",
          "kind": "EvidenceAgent",
          "metadata": {
            "name": "cluster-example"
          },
          "spec": {
            "allowedSecrets": [
              "backup-creds"
            ],
            "clusterRef": {
              "name": "cluster-example"
            },
            "refreshInterval": "5m"
          }
