  /api/v1/namespaces/{namespace}/clusters/{name}/instances/{pod}/logs/stream:
    get:
      description: "Server-sent events: line {at, text}, end {reason}; gap {at, reason} is reserved for lines known to be missed (draw a marker, never join across it). Starts with the last 100 lines. A comment line every 15 s. The stream ends when the session ends or is revoked, when your pods/log access is withdrawn (checked every 30 s), after an hour, or when the container stops. A refusal (403, 501, 404) is sent as a single end event with the reason."
      operationId: streamLogs
      parameters:
        - description: Namespace of the Cluster (one of the console's watched namespaces).
          in: path
          name: namespace
          required: true
          schema:
            description: Namespace of the Cluster (one of the console's watched namespaces).
            maxLength: 63
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
            type: string
        - description: Name of the Cluster.
          in: path
          name: name
          required: true
          schema:
            description: Name of the Cluster.
            maxLength: 253
            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
            type: string
        - description: Instance (pod) name.
          in: path
          name: pod
          required: true
          schema:
            description: Instance (pod) name.
            maxLength: 253
            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
            type: string
        - description: Container; default postgres.
          explode: false
          in: query
          name: container
          schema:
            description: Container; default postgres.
            maxLength: 63
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/LogStreamEnd"
                        event:
                          const: end
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event end
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/LogStreamGap"
                        event:
                          const: gap
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event gap
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/LogStreamLine"
                        event:
                          const: line
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event line
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
