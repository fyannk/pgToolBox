    get:
      description: "Server-sent events: hello on connect (refetch everything), invalidate {topic, namespace, name} (refetch that), resync (refetch everything), reauth {expiresAt, refreshable} before the session ends (call GET /api/v1/session). A comment line every 15 s; no byte for 35 s means the stream is dead. While it is down, poll every 2 s backing off to 10 s. The stream closes when the session ends."
      operationId: stream
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/Hello"
                        event:
                          const: hello
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event hello
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/Invalidate"
                        event:
                          const: invalidate
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event invalidate
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/Reauth"
                        event:
                          const: reauth
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
