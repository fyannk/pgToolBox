  securitySchemes:
    session:
      description: The sealed session cookie set by the sign-in pages (/auth/login).
      in: cookie
      name: __Host-pgtoolbox-console-0
      type: apiKey
info:
  description: "The JSON API of the pgToolBox console, the CloudNativePG observation console. Every operation acts as the signed-in user: the console asks the Kubernetes API server (SelfSubjectAccessReview, with your own token) before it reads anything on your behalf. Unsafe methods require the header X-PgToolBox-Request: 1 and a same-origin request."
  title: pgToolBox console API
  version: v1
openapi: 3.1.0
paths:
  /api/v1/access-requests:
    get:
      description: "Per watched namespace: every PgAccessRequest when the API server lets you list them, otherwise the ones naming you (your user, your ServiceAccount, a group you are in); with what you may do (request, approve or deny, revoke), each decided by a SelfSubjectAccessReview. An approval binds pgtoolbox-console-viewer or pgtoolbox-console-operator for every Cluster of the namespace. Refetch on the stream's clusters invalidation."
      operationId: listAccessRequests
      parameters:
        - description: Only this watched namespace.
          explode: false
          in: query
          name: namespace
          schema:
            description: Only this watched namespace.
            maxLength: 63
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequestList"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "501":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Implemented
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Access requests you may see
      tags:
        - access
  /api/v1/admin:
    get:
      description: Per watched namespace, the PgAdmin and EvidenceAgent objects you may list there; the console's own health if you may list pods in its namespace.
      operationId: getAdmin
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: PgAdmins, EvidenceAgents and console health
      tags:
        - admin
  /api/v1/assistant-setup:
    get:
      description: "Ready-to-paste setup of this console's MCP endpoint for Claude Code, Codex CLI, OpenCode and other MCP clients: the one-line add command, the configuration files, the static-token form when token sign-in is on, and the check command."
      operationId: getAssistantSetup
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSetupView"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Connect an assistant
      tags:
        - assistant
  /api/v1/assistant-setup/agents:
    get:
      description: An AGENTS.md section for Codex and OpenCode with the same content as the skill.
      operationId: getAssistantAgents
      responses:
        "200":
          content:
            text/markdown:
              schema:
                type: string
          description: Markdown
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: The AGENTS.md fragment of the prompt pack
      tags:
        - assistant
  /api/v1/assistant-setup/skill:
    get:
      description: "SKILL.md for .claude/skills/pgtoolbox/: what the tools are, that log and statement text is untrusted, and to cite the console page of each finding. Generated from the tool list."
      operationId: getAssistantSkill
      responses:
        "200":
          content:
            text/markdown:
              schema:
                type: string
          description: Markdown
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: The Claude Code skill of the prompt pack
      tags:
        - assistant
  /api/v1/clusters:
    get:
      description: Every Cluster of the watched namespaces that the API server lets you get (one SelfSubjectAccessReview per Cluster, cached 10 s).
      operationId: listClusters
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterListView"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Clusters you may see
      tags:
        - clusters
  /api/v1/compare:
    get:
      description: Versions, instances, parameters, resources, storage, backup configuration and topology of two Clusters, with the rows that differ marked. You must be allowed to get both (one SelfSubjectAccessReview each); either refusal answers 403 whether the Cluster exists or not.
      operationId: compareClusters
      parameters:
        - description: Namespace of the left Cluster.
          explode: false
          in: query
          name: leftNamespace
          required: true
          schema:
            description: Namespace of the left Cluster.
            maxLength: 63
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
            type: string
        - description: Name of the left Cluster.
          explode: false
          in: query
          name: leftName
          required: true
          schema:
            description: Name of the left Cluster.
            maxLength: 253
            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
            type: string
        - description: Namespace of the right Cluster.
          explode: false
          in: query
          name: rightNamespace
          required: true
          schema:
            description: Namespace of the right Cluster.
            maxLength: 63
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
            type: string
        - description: Name of the right Cluster.
          explode: false
          in: query
          name: rightName
          required: true
          schema:
            description: Name of the right Cluster.
            maxLength: 253
            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comparison"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Two Clusters side by side
      tags:
        - clusters
  /api/v1/digests:
    get:
      description: The console's daily summaries, newest first, each counted over the Clusters you may get.
      operationId: listDigests
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigestList"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Daily digests
      tags:
        - digests
