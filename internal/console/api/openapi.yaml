components:
  schemas:
    AccessAction:
      additionalProperties: false
      properties:
        allowed:
          type: boolean
        undecided:
          type: boolean
        why:
          type: string
      required:
        - allowed
      type: object
    AccessActions:
      additionalProperties: false
      properties:
        approve:
          $ref: "#/components/schemas/AccessAction"
        deny:
          $ref: "#/components/schemas/AccessAction"
        revoke:
          $ref: "#/components/schemas/AccessAction"
      required:
        - approve
        - deny
        - revoke
      type: object
    AccessCondition:
      additionalProperties: false
      properties:
        message:
          type: string
        observed:
          type: boolean
        reason:
          type: string
        status:
          enum:
            - "True"
            - "False"
            - Unknown
          type: string
      required:
        - status
        - reason
        - message
        - observed
      type: object
    AccessDecision:
      additionalProperties: false
      properties:
        note:
          description: Required to deny; shown to the requester.
          maxLength: 1024
          type: string
      type: object
    AccessNamespace:
      additionalProperties: false
      properties:
        canRequest:
          type: boolean
        canReview:
          type: boolean
        name:
          type: string
        readable:
          type: boolean
        seesAll:
          type: boolean
      required:
        - name
        - seesAll
        - canRequest
        - canReview
        - readable
      type: object
    AccessRequest:
      additionalProperties: false
      properties:
        actions:
          $ref: "#/components/schemas/AccessActions"
        capability:
          enum:
            - viewer
            - operator
          type: string
        cluster:
          description: The Cluster the requester named; informative, see scope.
          type: string
        clusterRole:
          description: "The ClusterRole an approval binds: pgtoolbox-console-viewer or pgtoolbox-console-operator."
          type: string
        condition:
          $ref: "#/components/schemas/AccessCondition"
        createdAt:
          format: date-time
          type: string
        decidedAt:
          format: date-time
          type: string
        decidedBy:
          type: string
        expiresAt:
          format: date-time
          type: string
        health:
          description: "How the request is drawn: Pending progressing, Approved ok (progressing until the operator confirms the grant), Denied/Expired/Revoked inactive, and warning whenever the operator reports the namespace's RBAC does not match (RoleBindingMissing, RoleBindingDrifted, ClusterNotFound, a reconcile error)."
          enum:
            - ok
            - progressing
            - warning
            - critical
            - inactive
            - unknown
            - info
          type: string
        justification:
          type: string
        mine:
          type: boolean
        name:
          type: string
        namespace:
          type: string
        note:
          description: The decider's note (required on deny), or the operator's explanation of a revocation.
          type: string
        phase:
          enum:
            - Pending
            - Approved
            - Denied
            - Expired
            - Revoked
          type: string
        revokedAt:
          format: date-time
          type: string
        revokedBy:
          type: string
        roleBinding:
          type: string
        scope:
          type: string
        subject:
          $ref: "#/components/schemas/AccessSubject"
      required:
        - namespace
        - name
        - subject
        - capability
        - clusterRole
        - justification
        - createdAt
        - phase
        - health
        - scope
        - mine
        - condition
        - actions
      type: object
    AccessRequestCreate:
      additionalProperties: false
      properties:
        capability:
          enum:
            - viewer
            - operator
          type: string
        cluster:
          description: "Informative: an approval covers every Cluster of the namespace."
          maxLength: 253
          pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
          type: string
        expiresAt:
          description: "When the access ends; must be in the future. Omitted: until revoked."
          format: date-time
          type: string
        justification:
          maxLength: 1024
          minLength: 1
          type: string
        subject:
          $ref: "#/components/schemas/AccessSubject"
      required:
        - capability
        - justification
      type: object
    AccessRequestList:
      additionalProperties: false
      properties:
        generatedAt:
          format: date-time
          type: string
        items:
          items:
            $ref: "#/components/schemas/AccessRequest"
          type:
            - array
            - "null"
        namespaces:
          items:
            $ref: "#/components/schemas/AccessNamespace"
          type:
            - array
            - "null"
        unchecked:
          format: int64
          type: integer
        writable:
          type: boolean
      required:
        - generatedAt
        - namespaces
        - items
        - writable
      type: object
    AccessSubject:
      additionalProperties: false
      properties:
        kind:
          description: User and Group as the API server names them; ServiceAccount of the request's namespace.
          enum:
            - User
            - Group
            - ServiceAccount
          type: string
        name:
          maxLength: 512
          minLength: 1
          type: string
      required:
        - kind
        - name
      type: object
    Admin:
      additionalProperties: false
      properties:
        console:
          $ref: "#/components/schemas/ConsoleHealth"
        generatedAt:
          format: date-time
          type: string
        namespaces:
          items:
            $ref: "#/components/schemas/AdminNamespace"
          type:
            - array
            - "null"
      required:
        - generatedAt
        - namespaces
      type: object
    AdminNamespace:
      additionalProperties: false
      properties:
        evidenceAgents:
          items:
            $ref: "#/components/schemas/EvidenceAgentRow"
          type:
            - array
            - "null"
        evidenceAgentsVisible:
          type: boolean
        name:
          type: string
        pgAdmins:
          items:
            $ref: "#/components/schemas/PgAdminRow"
          type:
            - array
            - "null"
        pgAdminsVisible:
          type: boolean
        sources:
          items:
            $ref: "#/components/schemas/SourceState"
          type:
            - array
            - "null"
      required:
        - name
        - pgAdminsVisible
        - pgAdmins
        - evidenceAgentsVisible
        - evidenceAgents
        - sources
      type: object
    Archiving:
      additionalProperties: false
      properties:
        conditionStatus:
          type: string
        health:
          enum:
            - ok
            - progressing
            - warning
            - critical
            - inactive
            - unknown
            - info
          type: string
        lastArchivedAt:
          description: pg_stat_archiver.last_archived_time on the archiving instance, its own report.
          format: date-time
          type: string
        lastArchivedWal:
          type: string
        lastFailedAt:
          description: pg_stat_archiver.last_failed_time on the archiving instance, its own report.
          format: date-time
          type: string
        lastFailedWal:
          type: string
        liveArchiving:
          type: boolean
        message:
          type: string
        provenance:
          $ref: "#/components/schemas/Provenance"
        readyWalFiles:
          format: int64
          type: integer
        reason:
          type: string
      required:
        - health
        - provenance
      type: object
    AssistantClientSetup:
      additionalProperties: false
      properties:
        add:
          description: The one-line command that adds this console (user scope).
          type: string
        check:
          description: The command that shows whether the client reaches the console, when the client has one.
          type: string
        checkNote:
          description: How to check it in words, for a client without a check command.
          type: string
        docs:
          description: The client's own documentation of MCP servers.
          type: string
        id:
          description: The client.
          enum:
            - claude-code
            - codex
            - opencode
            - generic
          type: string
        login:
          description: The command that signs in, when the client does not do it on first use.
          type: string
        name:
          description: Display name.
          type: string
        pack:
          $ref: "#/components/schemas/PromptPackSetup"
          description: Where this client reads the prompt pack, when it reads one.
        projectConfig:
          $ref: "#/components/schemas/ConfigFile"
          description: The project-scope (repository) configuration file form.
        staticToken:
          $ref: "#/components/schemas/StaticTokenSetup"
          description: The static-token form; present only while token sign-in is on.
        userConfig:
          $ref: "#/components/schemas/ConfigFile"
          description: The user-scope configuration file form.
      required:
        - id
        - name
        - docs
        - userConfig
      type: object
    AssistantSetupView:
      additionalProperties: false
      properties:
        access:
          description: "What a grant may give: read-only; or, with the write tools on, read and operate for a grant whose user chose it on the consent page (which proposes read-only first)."
          enum:
            - read
            - readOperate
          type: string
        agentsPath:
          description: The AGENTS.md fragment of the prompt pack (Codex, OpenCode).
          type: string
        clients:
          description: One entry per client.
          items:
            $ref: "#/components/schemas/AssistantClientSetup"
          type:
            - array
            - "null"
        mcpURL:
          description: This console's MCP endpoint.
          type: string
        serverName:
          description: The name the snippets give the server in each client.
          type: string
        skillPath:
          description: The Claude Code skill (SKILL.md) of the prompt pack.
          type: string
        tokenLogin:
          description: Token sign-in is on, so raw API-server tokens are accepted too (break-glass).
          type: boolean
      required:
        - mcpURL
        - serverName
        - access
        - tokenLogin
        - clients
        - skillPath
        - agentsPath
      type: object
    AutoGrow:
      additionalProperties: false
      properties:
        maxSize:
          type: string
        step:
          description: Growth per step, a quantity or a percentage.
          type: string
        threshold:
          description: Percent used that triggers a step.
          format: int64
          type: integer
      type: object
    BackupCadence:
      additionalProperties: false
      properties:
        basis:
          enum:
            - schedule
            - default
          type: string
        intervalSeconds:
          format: int64
          type: integer
        overdue:
          type: boolean
        thresholdSeconds:
          format: int64
          type: integer
      required:
        - basis
        - thresholdSeconds
      type: object
    BackupMethod:
      additionalProperties: false
      properties:
        configured:
          type: boolean
        inTreeObjectStore:
          description: spec.backup.barmanObjectStore is set (deprecated upstream).
          type: boolean
        objectStore:
          type: string
        pgbackrest:
          $ref: "#/components/schemas/PgBackRestMethod"
        pluginBased:
          type: boolean
        pluginName:
          type: string
        provenance:
          $ref: "#/components/schemas/Provenance"
        volumeSnapshot:
          description: spec.backup.volumeSnapshot is set.
          type: boolean
      required:
        - configured
        - provenance
      type: object
    BackupRecency:
      additionalProperties: false
      properties:
        cadence:
          $ref: "#/components/schemas/BackupCadence"
        configured:
          description: The Cluster declares a backup method or schedule.
          type: boolean
        health:
          enum:
            - ok
            - progressing
            - warning
            - critical
            - inactive
            - unknown
            - info
          type: string
        lastCompletedAt:
          description: Newest completed Backup.
          format: date-time
          type: string
        lastFailedAt:
          description: Newest failed Backup newer than the last completed one.
          format: date-time
          type: string
        pluginBased:
          description: Backups go through a CNPG-I plugin.
          type: boolean
        provenance:
          $ref: "#/components/schemas/Provenance"
      required:
        - health
        - configured
        - provenance
      type: object
    BackupRow:
      additionalProperties: false
      properties:
        backupId:
          type: string
        createdAt:
          format: date-time
          type: string
        error:
          description: status.error, bounded, rendered escaped.
          type: string
        health:
          enum:
            - ok
            - progressing
            - warning
            - critical
            - inactive
            - unknown
            - info
          type: string
        instance:
          description: "status.instanceID.podName: the instance the backup was taken from."
          type: string
        known:
          description: The phase is in the table of the observed CNPG minor.
          type: boolean
        method:
          type: string
        name:
          type: string
        notReportedWhileRunning:
          items:
            type: string
          type:
            - array
            - "null"
        online:
          type: boolean
        pgbackrest:
          $ref: "#/components/schemas/PgBackRestBackupRef"
        phase:
          type: string
        pluginName:
          type: string
        predatesCluster:
          type: boolean
        provenance:
          $ref: "#/components/schemas/Provenance"
        repository:
          enum:
            - present
            - absent
            - unknown
            - notChecked
          type: string
        schedule:
          type: string
        startedAt:
          format: date-time
          type: string
        stoppedAt:
          format: date-time
          type: string
        terminal:
          description: Nothing moves the backup forward from this phase.
          type: boolean
      required:
        - name
        - health
        - known
        - repository
        - provenance
      type: object
    BackupSummary:
      additionalProperties: false
      properties:
        archiving:
          $ref: "#/components/schemas/Archiving"
        cadence:
          $ref: "#/components/schemas/BackupCadence"
        configured:
          description: The Cluster declares a backup method or schedule.
          type: boolean
        health:
          enum:
            - ok
            - progressing
            - warning
            - critical
            - inactive
            - unknown
            - info
          type: string
        lastCompletedAt:
          description: Newest completed Backup.
          format: date-time
          type: string
        lastFailedAt:
          description: Newest failed Backup newer than the last completed one.
          format: date-time
          type: string
        nextScheduledAt:
          format: date-time
          type: string
        notReported:
          items:
            type: string
          type:
            - array
            - "null"
        pluginBased:
          description: Backups go through a CNPG-I plugin.
          type: boolean
        provenance:
          $ref: "#/components/schemas/Provenance"
        recoveryWindow:
          $ref: "#/components/schemas/RecoveryWindow"
      required:
        - archiving
        - health
        - configured
        - provenance
      type: object
    Backups:
      additionalProperties: false
      properties:
        blindSpots:
          items:
            $ref: "#/components/schemas/BlindSpot"
          type:
            - array
            - "null"
        drills:
          $ref: "#/components/schemas/RestoreDrills"
        evidence:
          $ref: "#/components/schemas/EvidenceCheck"
        generatedAt:
          format: date-time
          type: string
        items:
          items:
            $ref: "#/components/schemas/BackupRow"
          type:
            - array
            - "null"
        method:
          $ref: "#/components/schemas/BackupMethod"
        recoveryTimeline:
          $ref: "#/components/schemas/RecoveryTimeline"
        ref:
          $ref: "#/components/schemas/ClusterRef"
        schedules:
          items:
            $ref: "#/components/schemas/ScheduleRow"
          type:
            - array
            - "null"
        sources:
          items:
            $ref: "#/components/schemas/SourceState"
          type:
            - array
            - "null"
        summary:
          $ref: "#/components/schemas/BackupSummary"
      required:
        - ref
        - generatedAt
        - summary
        - method
        - items
        - schedules
        - evidence
        - recoveryTimeline
        - drills
        - sources
        - blindSpots
      type: object
    BlindSpot:
      additionalProperties: false
      properties:
        id:
          description: Stable key of the blind spot, used for translation.
          type: string
        panel:
          description: The view this blind spot affects.
          type: string
        text:
          description: English statement of what cannot be seen.
          type: string
      required:
        - id
        - panel
        - text
      type: object
    Capabilities:
      additionalProperties: false
      properties:
        backup:
          description: May create Backups in the namespace.
          type: boolean
        logs:
          description: May read pod logs in the Cluster's namespace.
          type: boolean
        operations:
          description: "May patch the Cluster and its status and create Backups: promote, restart, reload, backup."
          type: boolean
        promote:
          description: May patch the Cluster's status subresource.
          type: boolean
        reload:
          description: May patch the Cluster (annotation cnpg.io/reloadedAt).
          type: boolean
        restart:
          description: May patch the Cluster (annotation kubectl.kubernetes.io/restartedAt).
          type: boolean
        undecided:
          description: Capabilities the API server could not be asked about; they are false until it answers.
          items:
            enum:
              - view
              - logs
              - operations
              - backup
              - reload
              - restart
              - promote
            type: string
          type:
            - array
            - "null"
        view:
          description: May get the Cluster (the console shows nothing about a Cluster without it).
          type: boolean
      required:
        - view
        - logs
        - operations
        - backup
        - reload
        - restart
        - promote
      type: object
    CatalogImage:
      additionalProperties: false
      properties:
        image:
          type: string
        major:
          format: int64
          type: integer
      required:
        - major
        - image
      type: object
    CatalogView:
      additionalProperties: false
      properties:
        health:
          enum:
            - ok
            - progressing
            - warning
            - critical
            - inactive
            - unknown
            - info
          type: string
        image:
          description: The image the catalog gives for the selected major.
          type: string
        images:
          items:
            $ref: "#/components/schemas/CatalogImage"
          type:
            - array
            - "null"
        kind:
          enum:
            - ImageCatalog
            - ClusterImageCatalog
          type: string
        major:
          description: The major the Cluster selects.
          format: int64
          type: integer
        name:
          type: string
        provenance:
          $ref: "#/components/schemas/Provenance"
        reason:
          type: string
        state:
          enum:
            - readable
            - notFound
            - notReadable
          type: string
      required:
        - kind
        - name
        - state
        - health
        - provenance
      type: object
    ChangePreview:
      additionalProperties: false
      properties:
        atLeast:
          description: "Set when effect is unknown: the most disruptive effect of the changes that were classified, which the change does at least."
          enum:
            - none
            - reload
            - start
            - restart
            - rollout
            - shutdown
            - majorUpgrade
          type: string
        cnpgMinor:
          type: string
        effect:
          description: The most disruptive ordered effect; unknown as soon as one change could not be classified (atLeast then gives the floor).
          enum:
            - none
            - reload
            - start
            - restart
            - rollout
            - shutdown
            - majorUpgrade
            - unknown
          type: string
        fields:
          items:
            $ref: "#/components/schemas/PreviewField"
          type:
            - array
            - "null"
        method:
          description: primaryUpdateMethod in force after the change.
          enum:
            - restart
            - switchover
          type: string
        parameters:
          items:
            $ref: "#/components/schemas/PreviewParameter"
          type:
            - array
            - "null"
        postgresMajor:
          format: int64
          type: integer
        primary:
          description: What happens to the primary; unknown when a change could not be classified.
          enum:
            - none
            - reload
            - restartInPlace
            - recreate
            - switchover
            - waitForUser
            - restartFirst
            - majorUpgrade
            - shutdown
            - start
            - unknown
          type: string
        steps:
          description: The order in which instances are touched.
          items:
            $ref: "#/components/schemas/PreviewStep"
          type:
            - array
            - "null"
        strategy:
          description: primaryUpdateStrategy in force after the change.
          enum:
            - unsupervised
            - supervised
          type: string
        unknown:
          format: int64
          type: integer
        verified:
          type: boolean
      required:
        - effect
        - parameters
        - fields
        - strategy
        - method
        - primary
        - steps
        - verified
      type: object
    Check:
      additionalProperties: false
      properties:
        because:
          type: string
        describes:
          type: string
        layer:
          description: Kubernetes, Operator, PostgreSQL, Replication, Backup, ...
          type: string
        name:
          type: string
        outcome:
          enum:
            - matched
            - clear
            - unavailable
            - notApplicable
          type: string
        sourceOff:
          type: boolean
      required:
        - name
        - layer
        - describes
        - outcome
      type: object
    ClusterListView:
      additionalProperties: false
      properties:
        generatedAt:
          description: When the read model assembled this list.
          format: date-time
          type: string
        items:
          description: One row per Cluster.
          items:
            $ref: "#/components/schemas/ClusterRow"
          type:
            - array
            - "null"
        namespaces:
          description: The watched namespaces and whether their Clusters could be listed.
          items:
            $ref: "#/components/schemas/NamespaceState"
          type:
            - array
            - "null"
        unchecked:
          description: How many Clusters were left out because the API server could not be asked whether you may see them; retry later. Their names are not disclosed.
          format: int64
          type: integer
      required:
        - generatedAt
        - namespaces
        - items
      type: object
    ClusterOverviewView:
      additionalProperties: false
      properties:
        backups:
          $ref: "#/components/schemas/BackupSummary"
        blindSpots:
          items:
            $ref: "#/components/schemas/BlindSpot"
          type:
            - array
            - "null"
        capabilities:
          $ref: "#/components/schemas/Capabilities"
          description: What the API server lets you do with this Cluster; decides which buttons exist.
        cards:
          items:
            $ref: "#/components/schemas/InstanceCard"
          type:
            - array
            - "null"
        conditions:
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        escapeHatches:
          description: Annotations that switch operator behaviour off; each explains why nothing happens.
          items:
            $ref: "#/components/schemas/EscapeHatch"
          type:
            - array
            - "null"
        failover:
          $ref: "#/components/schemas/FailoverRehearsal"
        fencing:
          $ref: "#/components/schemas/Fencing"
        findings:
          $ref: "#/components/schemas/FindingCounts"
        generatedAt:
          description: When the read model assembled this view.
          format: date-time
          type: string
        hibernation:
          $ref: "#/components/schemas/Hibernation"
        instances:
          $ref: "#/components/schemas/InstanceCounts"
        labels:
          additionalProperties:
            type: string
          type: object
        pgAdmins:
          description: pgAdmins this Cluster is registered in that you may open (connect pgadmins/<name>).
          items:
            $ref: "#/components/schemas/PgAdminLink"
          type:
            - array
            - "null"
        pgAdminsUnread:
          description: "The console could not read the PgAdmins: pgAdmins may be incomplete."
          type: boolean
        phase:
          $ref: "#/components/schemas/Phase"
        present:
          description: The Cluster exists.
          type: boolean
        primary:
          $ref: "#/components/schemas/PrimaryElection"
        recentWarnings:
          description: Warning events of the last hour, newest first.
          items:
            $ref: "#/components/schemas/EventRow"
          type:
            - array
            - "null"
        ref:
          $ref: "#/components/schemas/ClusterRef"
        sources:
          description: Every source this view rests on and its state.
          items:
            $ref: "#/components/schemas/SourceState"
          type:
            - array
            - "null"
        verdict:
          $ref: "#/components/schemas/Verdict"
        version:
          $ref: "#/components/schemas/VersionInfo"
        waiting:
          $ref: "#/components/schemas/OperatorWaiting"
      required:
        - capabilities
        - pgAdmins
        - ref
        - generatedAt
        - present
        - verdict
        - phase
        - primary
        - instances
        - cards
        - conditions
        - recentWarnings
        - escapeHatches
        - fencing
        - failover
        - hibernation
        - backups
        - version
        - findings
        - sources
        - blindSpots
      type: object
    ClusterRef:
      additionalProperties: false
      properties:
        name:
          description: Name of the Cluster.
          type: string
        namespace:
          description: Namespace of the Cluster.
          type: string
        uid:
          description: Kubernetes UID of the observed Cluster.
          type: string
      required:
        - namespace
        - name
      type: object
    ClusterRow:
      additionalProperties: false
      properties:
        backup:
          $ref: "#/components/schemas/BackupRecency"
        findings:
          $ref: "#/components/schemas/FindingCounts"
        instances:
          $ref: "#/components/schemas/InstanceCounts"
        labels:
          additionalProperties:
            type: string
          description: Cluster labels, for filtering.
          type: object
        phase:
          $ref: "#/components/schemas/Phase"
        primary:
