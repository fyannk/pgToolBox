  # spec.prometheus.projectedToken: create on the console ServiceAccount's token.
  - name: projected token without create on serviceaccounts/token
    requester: mallory
    object: {kind: PgToolBoxConsole, metadata: {name: pt-mallory}, spec: {prometheus: {url: "https://attacker.example/", projectedToken: true}}}
    allowed: false
    refusedBy: projectedToken
