    requester: nsreader
    object: {kind: PgToolBoxConsole, metadata: {name: pt-nsreader}, spec: {prometheus: {url: "https://prometheus.example.com", projectedToken: true}}}
    allowed: false
    refusedBy: projectedToken
  - name: minting another console's token does not help
    requester: minter
    object: {kind: PgToolBoxConsole, metadata: {name: pt-other}, spec: {prometheus: {url: "https://prometheus.example.com", projectedToken: true}}}
    allowed: false
    refusedBy: projectedToken
