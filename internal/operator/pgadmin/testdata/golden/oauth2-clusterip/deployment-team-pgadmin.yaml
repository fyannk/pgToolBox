              timeout=4)
          failureThreshold: 3
          periodSeconds: 30
          timeoutSeconds: 5
        name: pgadmin
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /venv/bin/python3
            - -c
            - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/misc/ping',
