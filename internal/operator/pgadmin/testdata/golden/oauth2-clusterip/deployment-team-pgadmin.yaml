          readOnly: true
        - mountPath: /run/pgadmin/oauth2
          name: oauth2-client
          readOnly: true
      - command:
        - /opt/pgtoolbox/bin/manager
        - passfile-sync
        - --offer-secret
        - team-pgadmin-offer
        - --dir
        - /run/pgadmin/credentials
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        image: ghcr.io/fyannk/pgadmin:9.18-hardened@sha256:96576df8aba0d0057248644d6d5ad398869e42bcf3fcfba2c0f7c13d151ea17c
        imagePullPolicy: IfNotPresent
        name: passfile-sync
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /opt/pgtoolbox/bin
          name: pgtoolbox-bin
          readOnly: true
        - mountPath: /run/pgadmin/credentials
          name: credentials
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access
          readOnly: true
      enableServiceLinks: false
      initContainers:
      - command:
        - /manager
        - install
        - --target
        - /opt/pgtoolbox/bin/manager
        image: ghcr.io/fyannk/pgtoolbox-operator:2.0.0@sha256:1111111111111111111111111111111111111111111111111111111111111111
        imagePullPolicy: IfNotPresent
        name: install-passfile-sync
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /opt/pgtoolbox/bin
          name: pgtoolbox-bin
      securityContext:
        fsGroup: 5050
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: team-pgadmin
      terminationGracePeriodSeconds: 30
      volumes:
      - name: settings
        persistentVolumeClaim:
          claimName: team-pgadmin
      - emptyDir:
          sizeLimit: 512Mi
        name: tmp
      - emptyDir:
          sizeLimit: 16Mi
        name: run
      - emptyDir:
          medium: Memory
          sizeLimit: 4Mi
        name: credentials
      - emptyDir:
          sizeLimit: 256Mi
        name: pgtoolbox-bin
      - name: bootstrap
        secret:
          defaultMode: 288
          secretName: team-pgadmin-bootstrap
      - name: kube-api-access
        projected:
          defaultMode: 292
          sources:
          - serviceAccountToken:
