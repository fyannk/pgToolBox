              path: token
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
      - name: oauth2-client
        secret:
          defaultMode: 288
          items:
          - key: client-secret
            path: client-secret
          secretName: pgadmin-oidc
