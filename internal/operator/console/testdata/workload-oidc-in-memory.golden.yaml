apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    pgtoolbox.fyannk.dev/spec-hash: 487b9f9408b3f3f0
  labels:
    app.kubernetes.io/component: console
    app.kubernetes.io/instance: console
    app.kubernetes.io/managed-by: pgtoolbox
    app.kubernetes.io/name: pgtoolbox-console
    app.kubernetes.io/part-of: pgtoolbox
    pgtoolbox.fyannk.dev/console: console
    pgtoolbox.fyannk.dev/reconcile: "true"
  name: console
  namespace: team-a
  ownerReferences:
  - apiVersion: pgtoolbox.fyannk.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: PgToolBoxConsole
    name: console
    uid: u
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: console
      app.kubernetes.io/instance: console
      app.kubernetes.io/name: pgtoolbox-console
      pgtoolbox.fyannk.dev/console: console
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: console
        app.kubernetes.io/instance: console
        app.kubernetes.io/managed-by: pgtoolbox
        app.kubernetes.io/name: pgtoolbox-console
        app.kubernetes.io/part-of: pgtoolbox
        pgtoolbox.fyannk.dev/console: console
        pgtoolbox.fyannk.dev/reconcile: "true"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: console
                  app.kubernetes.io/instance: console
                  app.kubernetes.io/name: pgtoolbox-console
                  pgtoolbox.fyannk.dev/console: console
              topologyKey: kubernetes.io/hostname
            weight: 100
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: WATCH_NAMESPACES
          value: team-a
        - name: CLUSTER_SELECTOR
          value: team=a
        - name: LISTEN_ADDR
          value: :3000
        - name: PROBE_LISTEN_ADDR
          value: :3001
        - name: AUTH_PROVIDER
          value: oidc
        - name: SESSION_KEY_FILE
          value: /var/run/console/session/session-key
        - name: SESSION_IDLE_TIMEOUT
          value: 30m
        - name: OIDC_ISSUER_URL
          value: https://sso.example/realms/a
        - name: OIDC_CLIENT_ID
          value: console
        - name: OIDC_CLIENT_SECRET_FILE
          value: /var/run/console/oidc/client-secret
        - name: OIDC_REDIRECT_URL
          value: https://console.example/auth/callback
        - name: OIDC_SCOPES
          value: openid,email
        - name: OIDC_REQUIRE_EMAIL_VERIFIED
          value: "false"
        - name: OIDC_CA_FILE
          value: /var/run/console/oidc-ca/ca.crt
        - name: OIDC_GRANT_CLIENT_ID
          value: console-grants
        - name: OIDC_GRANT_CLIENT_SECRET_FILE
          value: /var/run/console/oidc-grant/client-secret
        - name: SESSION_MAX_AGE
          value: 12h
        - name: AUTH_TOKEN_LOGIN
          value: "false"
        - name: PUBLIC_URL
          value: https://console.example
        - name: LIFECYCLE_FILE
          value: /var/run/console/lifecycle/lifecycle.json
        - name: REVOCATION_CONFIGMAP
          value: console-revocations
        - name: STATE_CONFIGMAP
          value: console-state
        - name: INSTANCE_STATUS_CA_FILE
          value: /var/run/console/instance-ca/ca.crt
        - name: EVIDENCE_ENABLED
          value: "false"
        - name: OPERATIONS_ENABLED
          value: "false"
        - name: MONITORING_URL
          value: https://grafana.example
        - name: ALLOW_LOGS
          value: "false"
        - name: LOG_STREAM_ENABLED
          value: "false"
        - name: LOG_MATCH_MAX_AGE
          value: 6h
        image: registry.example/pgtoolbox-console:1.2.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
          periodSeconds: 20
        name: console
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        - containerPort: 3001
          name: probes
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
          periodSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access
          readOnly: true
        - mountPath: /var/run/console/session
          name: session
          readOnly: true
        - mountPath: /var/run/console/oidc
          name: oidc
          readOnly: true
        - mountPath: /var/run/console/oidc-ca
          name: oidc-ca
          readOnly: true
        - mountPath: /var/run/console/oidc-grant
          name: oidc-grant
          readOnly: true
        - mountPath: /var/run/console/instance-ca
          name: instance-ca
          readOnly: true
        - mountPath: /var/run/console/lifecycle
          name: lifecycle
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: console
      volumes:
      - emptyDir: {}
        name: tmp
      - name: kube-api-access
        projected:
          sources:
          - serviceAccountToken:
              expirationSeconds: 3600
              path: token
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  fieldPath: metadata.namespace
                path: namespace
      - name: session
        secret:
          items:
          - key: session-key
            path: session-key
          secretName: console-session
      - name: oidc
        secret:
          items:
          - key: client-secret
            path: client-secret
          secretName: oidc
      - configMap:
          items:
          - key: ca.crt
            path: ca.crt
          name: sso-ca
        name: oidc-ca
      - name: oidc-grant
        secret:
          items:
          - key: client-secret
            path: client-secret
          secretName: oidc-grants
      - configMap:
          items:
          - key: ca.crt
            path: ca.crt
          name: console-instance-ca
          optional: true
        name: instance-ca
      - configMap:
          items:
          - key: lifecycle.json
            path: lifecycle.json
          name: console-lifecycle
          optional: true
        name: lifecycle
status: {}
