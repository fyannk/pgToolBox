          readOnly: true
        - mountPath: /var/run/secrets/pgtoolbox.fyannk.dev/store
          name: store-credentials
          readOnly: true
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access
          readOnly: true
        - mountPath: /var/run/secrets/pgtoolbox.fyannk.dev/endpoint-ca
          name: endpoint-ca
          readOnly: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: orders-evidence-agent
      terminationGracePeriodSeconds: 30
      volumes:
      - name: serving-certificate
        secret:
          defaultMode: 292
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
          secretName: orders-evidence-agent-tls
      - name: store-credentials
        projected:
          defaultMode: 292
          sources:
          - secret:
              items:
              - key: ACCESS_KEY_ID
                path: access-key-id
              name: minio
          - secret:
              items:
              - key: ACCESS_SECRET_KEY
                path: secret-access-key
              name: minio
          - secret:
              items:
              - key: ENCRYPTION_KEY
                path: cipher-pass
              name: minio
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
      - name: kube-api-access
        projected:
          defaultMode: 292
          sources:
          - serviceAccountToken:
              expirationSeconds: 3600
              path: token
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
      - name: endpoint-ca
        secret:
          defaultMode: 292
          items:
          - key: ca.crt
            path: ca.crt
          secretName: minio-ca
status: {}
