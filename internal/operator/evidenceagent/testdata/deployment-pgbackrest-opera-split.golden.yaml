        - name: CNPG_CLUSTER_NAME
          value: orders
        - name: REPOSITORY_FORMAT
          value: pgbackrest
        - name: PROVIDER
          value: s3
        - name: DESTINATION_PATH
          value: s3://backups/orders
        - name: PGBACKREST_STANZA
          value: orders
        - name: PGBACKREST_ARCHIVE_STANZA
          value: orders-wal
        - name: PGBACKREST_REPOSITORY
          value: "1"
        - name: PGBACKREST_RETENTION_FULL
          value: "7"
        - name: PGBACKREST_RETENTION_FULL_TYPE
          value: time
        - name: PGBACKREST_RETENTION_ARCHIVE_TYPE
