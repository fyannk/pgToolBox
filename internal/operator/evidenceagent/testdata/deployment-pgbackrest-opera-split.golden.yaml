apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    pgtoolbox.fyannk.dev/spec-hash: sha256:59a3f5c3d1d9f1ecd25da12366625f9def3a646f3a7cc8ef3e73ad4da9300cf6
  labels:
    app.kubernetes.io/component: evidence-agent
    app.kubernetes.io/instance: orders
    app.kubernetes.io/managed-by: pgtoolbox
    app.kubernetes.io/name: evidence-agent
    app.kubernetes.io/part-of: pgtoolbox
    pgtoolbox.fyannk.dev/evidenceagent: orders
    pgtoolbox.fyannk.dev/reconcile: "true"
  name: orders-evidence-agent
  namespace: team-a
  ownerReferences:
  - apiVersion: pgtoolbox.fyannk.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: EvidenceAgent
    name: orders
    uid: 4d7c6c1e-8a51-4c43-9a0e-2b1d5f6e7a80
spec:
  progressDeadlineSeconds: 300
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: orders
      app.kubernetes.io/name: evidence-agent
  strategy:
