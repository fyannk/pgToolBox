        pgtoolbox.fyannk.dev/producer-epoch: "3"
      labels:
        app.kubernetes.io/component: evidence-agent
        app.kubernetes.io/instance: orders
        app.kubernetes.io/managed-by: pgtoolbox
        app.kubernetes.io/name: evidence-agent
        app.kubernetes.io/part-of: pgtoolbox
        pgtoolbox.fyannk.dev/evidenceagent: orders
        pgtoolbox.fyannk.dev/reconcile: "true"
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: RUNTIME_MODE
          value: agent
        - name: AWS_EC2_METADATA_DISABLED
          value: "true"
        - name: LISTEN_ADDR
          value: :8443
        - name: TLS_CERT_FILE
          value: /var/run/secrets/pgtoolbox.fyannk.dev/serving/tls.crt
        - name: TLS_KEY_FILE
          value: /var/run/secrets/pgtoolbox.fyannk.dev/serving/tls.key
        - name: AGENT_NAME
          value: orders
        - name: AGENT_NAMESPACE
          value: team-a
        - name: PRODUCER_EPOCH
          value: "3"
        - name: CNPG_CLUSTER_NAMESPACE
          value: team-a
        - name: CNPG_CLUSTER_UID
