# Minimal stand-in for Dalibo's pgBackRest plugin Stanza CRD: the group,
# version, kind and scope the operator reads, with an open spec. The
# resolver decodes only the fields of internal/backupresolve/pgbackrest.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stanzas.pgbackrest.dalibo.com
spec:
  group: pgbackrest.dalibo.com
  names:
    kind: Stanza
    listKind: StanzaList
    plural: stanzas
    singular: stanza
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
    subresources:
      status: {}
