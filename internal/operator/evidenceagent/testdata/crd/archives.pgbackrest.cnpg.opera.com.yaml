# Minimal stand-in for Opera's pgBackRest plugin Archive CRD: the group,
# version, kind and scope the operator reads, with an open spec. The
# resolver decodes only the fields of internal/backupresolve/pgbackrest.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: archives.pgbackrest.cnpg.opera.com
spec:
  group: pgbackrest.cnpg.opera.com
  names:
    kind: Archive
    listKind: ArchiveList
    plural: archives
    singular: archive
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
    subresources:
      status: {}
