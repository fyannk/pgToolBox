# The console for the CloudNativePG Clusters of this namespace, run by the
# operator: the same console the pgtools chart installs (console.enabled), as a
# resource. Sign-in through the corporate IdP; reachable on an Ingress.
apiVersion: pgtoolbox.fyannk.dev/v1alpha1
kind: PgToolBoxConsole
metadata:
  name: console
spec:
  auth:
    provider: oidc
    oidc:
      issuerURL: https://idp.example.com/realms/corp
      clientID: pgtoolbox-console-team-a
      clientSecretRef:
        name: pgtoolbox-console-team-a-oidc
  exposure:
    type: ingress
    hostname: console.team-a.example.com
    # Who may reach the console port: the ingress controller's Pods (here the
    # community ingress-nginx in its usual namespace; adjust both selectors to
    # yours). The operator then renders the console-ingress NetworkPolicy and
    # trusts X-Forwarded-For from these peers only, so each client keeps its own
    # sign-in budget. Without from, nothing confines the port and the header is
    # ignored: every user behind the controller shares one address and one
    # budget (ExposureConfined=False, ExposureOpen).
    networkPolicy:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
