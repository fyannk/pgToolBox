# The restore-drill delete guard, Kubernetes 1.30+.
#
# A console the operator runs holds, with spec.restoreDrills.enabled,
# get/list/watch/delete on clusters.postgresql.cnpg.io in its namespace
# (pgtoolbox-console-restore-drills): the console deletes only the drill
# Clusters it sealed, but a Pod run as its ServiceAccount could delete any
# Cluster there. This policy enforces the console's own check on the API
# server: a console ServiceAccount of the request's namespace that holds the
# role's marker (teardown on restoredrills.pgtoolbox.fyannk.dev) may delete
# a Cluster only when it carries the drill-owner label of that namespace,
# the restore-drill-of label and the drill seal annotation.
#
# Parameterless on purpose: a PgToolBoxConsole parameter would be looked up in the
# request's namespace, and a missing one must not mean "allow".
#
# Hand-written source of truth: hack/sync-manifests.sh copies it into the
# Helm chart, and hack/validate-packaging.sh compares them.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pgtoolbox-console-restore-drills
  labels:
    app.kubernetes.io/part-of: pgtoolbox
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - postgresql.cnpg.io
      apiVersions:
      - '*'
      operations:
      - DELETE
      resources:
      - clusters
  matchConditions:
  # A ServiceAccount of the Cluster's own namespace whose name is a
  # console's (PgToolBoxConsole WorkloadName: it contains "console").
  - name: console-service-account
    expression: >-
      request.userInfo.username.startsWith('system:serviceaccount:' + request.namespace + ':') &&
      request.userInfo.username.split(':')[3].contains('console')
  variables:
  # Bound to the drills ClusterRole in this namespace.
  - name: drillTeardown
    expression: >-
      authorizer.group('pgtoolbox.fyannk.dev').resource('restoredrills').namespace(request.namespace).check('teardown').allowed()
  validations:
  - expression: >-
      !variables.drillTeardown ||
      (has(oldObject.metadata.labels) &&
      'pgtoolbox.fyannk.dev/drill-owner' in oldObject.metadata.labels &&
      oldObject.metadata.labels['pgtoolbox.fyannk.dev/drill-owner'] == request.namespace &&
      'pgtoolbox.fyannk.dev/restore-drill-of' in oldObject.metadata.labels &&
      has(oldObject.metadata.annotations) &&
      'pgtoolbox.fyannk.dev/restore-drill-seal' in oldObject.metadata.annotations)
    message: a console's ServiceAccount may delete only the restore drill Clusters it created (drill-owner label, drill label, drill seal)
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pgtoolbox-console-restore-drills
  labels:
    app.kubernetes.io/part-of: pgtoolbox
spec:
  policyName: pgtoolbox-console-restore-drills
  validationActions:
  - Deny
