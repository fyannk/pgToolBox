# The restore-drill delete guard.
#
# A console the operator runs holds, with spec.restoreDrills.enabled,
# get/list/watch/delete on clusters.postgresql.cnpg.io in its namespace
# (pgtoolbox-console-restore-drills): the console deletes only the drill
# Clusters it sealed, but a Pod run as its ServiceAccount could delete any
# Cluster there. Two policies enforce the console's own check on the API
# server, as the pgtools chart's restoredrills-admissionpolicy.yaml does:
#
# - pgtoolbox-console-restore-drills, parameterless on purpose (a missing
#   parameter must not mean "allow"): any ServiceAccount that holds the drills
#   role's marker (teardown on restoredrills.pgtoolbox.fyannk.dev) in the
#   request's namespace, whatever its name or namespace, may delete a Cluster
#   only when it carries the drill-owner label of that namespace, the
#   restore-drill-of label and the drill seal annotation. Not concerned: an
#   administrator, a ServiceAccount holding every verb (*) on restoredrills in
#   the request's namespace (a namespaced GitOps controller with a */*/* Role
#   there, a tenant bound to cluster-admin by a RoleBinding). Any wildcard
#   rule satisfies teardown too, so without that exception every such
#   ServiceAccount would be held to the drill rules.
# - pgtoolbox-console-restore-drill-prefix, one evaluation per PgToolBoxConsole
#   of the namespace: that console's exact ServiceAccount (its WorkloadName:
#   the name when it contains "console", otherwise <name>-console) may delete
#   a Cluster only when its name starts with that console's drill prefix
#   (spec.restoreDrills.prefix, default drill-). It reads PgToolBoxConsoles as
#   parameters, so it fails open (failurePolicy Ignore, no console: nothing to
#   check) and the first policy stays the hard guard.
#
# Hand-written source of truth: hack/sync-manifests.sh copies it into the
# Helm chart, and hack/validate-packaging.sh compares them.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pgtoolbox-console-restore-drills
  labels:
    app.kubernetes.io/part-of: pgtoolbox
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - postgresql.cnpg.io
      apiVersions:
      - '*'
      operations:
      - DELETE
      resources:
      - clusters
  matchConditions:
  # Any ServiceAccount, whatever its name or namespace: the drills role's
  # marker, not a naming convention, says it is a console. A ServiceAccount of
  # another namespace is concerned too: the operator, which may bind the drills
  # role in the namespaces it watches, must not be able to delete their
  # Clusters by binding it to itself (or to anyone outside the namespace).
  - name: service-account
    expression: >-
      request.userInfo.username.startsWith('system:serviceaccount:')
  variables:
  # Bound to the drills ClusterRole in this namespace.
  - name: drillTeardown
    expression: >-
      authorizer.group('pgtoolbox.fyannk.dev').resource('restoredrills').namespace(request.namespace).check('teardown').allowed()
  # A ServiceAccount holding every verb on restoredrills in this namespace
  # (a wildcard rule: cluster-admin, admin of everything, a namespaced GitOps
  # controller's */*/* Role) is an administrator, not a console: not
  # concerned, wherever it lives. The drills role names the verb teardown,
  # never *, so binding it, even cluster-wide, does not make an
  # administrator; and nobody can grant * without holding it (RBAC
  # escalation prevention): the operator, whose bind covers only the three
  # console roles and which holds no right on restoredrills, cannot.
  - name: administrator
    expression: >-
      authorizer.group('pgtoolbox.fyannk.dev').resource('restoredrills').namespace(request.namespace).check('*').allowed()
  validations:
  - expression: >-
      !variables.drillTeardown || variables.administrator ||
      (has(oldObject.metadata.labels) &&
      'pgtoolbox.fyannk.dev/drill-owner' in oldObject.metadata.labels &&
      oldObject.metadata.labels['pgtoolbox.fyannk.dev/drill-owner'] == request.namespace &&
      'pgtoolbox.fyannk.dev/restore-drill-of' in oldObject.metadata.labels &&
      has(oldObject.metadata.annotations) &&
      'pgtoolbox.fyannk.dev/restore-drill-seal' in oldObject.metadata.annotations)
    message: a ServiceAccount holding the restore-drill teardown right may delete only the restore drill Clusters it created (drill-owner label, drill label, drill seal)
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pgtoolbox-console-restore-drills
  labels:
    app.kubernetes.io/part-of: pgtoolbox
spec:
  policyName: pgtoolbox-console-restore-drills
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pgtoolbox-console-restore-drill-prefix
  labels:
    app.kubernetes.io/part-of: pgtoolbox
spec:
  failurePolicy: Ignore
  paramKind:
    apiVersion: pgtoolbox.fyannk.dev/v1alpha1
    kind: PgToolBoxConsole
  matchConstraints:
    resourceRules:
    - apiGroups:
      - postgresql.cnpg.io
      apiVersions:
      - '*'
      operations:
      - DELETE
      resources:
      - clusters
  matchConditions:
  - name: namespace-service-account
    expression: >-
      request.userInfo.username.startsWith('system:serviceaccount:' + request.namespace + ':')
  variables:
  # The console's ServiceAccount: PgToolBoxConsole.WorkloadName().
  - name: account
    expression: >-
      'system:serviceaccount:' + params.metadata.namespace + ':' +
      (params.metadata.name.contains('console') ? params.metadata.name : params.metadata.name + '-console')
  - name: prefix
    expression: >-
      has(params.spec.restoreDrills) && has(params.spec.restoreDrills.prefix) && params.spec.restoreDrills.prefix != '' ?
      params.spec.restoreDrills.prefix : 'drill-'
  validations:
  - expression: >-
      request.userInfo.username != variables.account ||
      oldObject.metadata.name.startsWith(variables.prefix)
    message: a console's ServiceAccount may delete only Clusters named with its restore drill prefix
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pgtoolbox-console-restore-drill-prefix
  labels:
    app.kubernetes.io/part-of: pgtoolbox
spec:
  policyName: pgtoolbox-console-restore-drill-prefix
  paramRef:
    selector: {}
    parameterNotFoundAction: Allow
  validationActions:
  - Deny
