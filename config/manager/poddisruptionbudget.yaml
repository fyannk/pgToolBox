# Two replicas, one of them always up through a node drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgtoolbox
  namespace: system
  labels:
    app.kubernetes.io/name: pgtoolbox
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: pgtoolbox
