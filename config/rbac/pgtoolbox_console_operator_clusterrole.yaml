# The role of a person who may change things: the viewer's rules plus
# the three writes the console offers, each made with the person's own token
# (create backups; patch clusters and clusters/status for promote and fencing) and
# `get pgadmins`: pgAdmin is dba-only, because whoever may open it holds the
# credentials of every role it offers. On OpenShift the
# oauth-proxy in front of pgAdmin checks exactly that verb
# (--openshift-sar get pgadmins/<name>).
#
# Access requests: an operator decides the namespace's PgAccessRequests through
# the console, which creates the RoleBinding to pgtoolbox-console-viewer or pgtoolbox-console-operator
# with the approver's own token (create rolebindings; the API server's escalation
# check passes because the approver holds every rule of either role here) and records
# the decision (update pgaccessrequests/status).
#
# Bound per namespace with a RoleBinding; the product renders no ClusterRoleBinding.
# Hand-written source of truth, see pgtoolbox_console_viewer_clusterrole.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgtoolbox-console-operator
  labels:
    app.kubernetes.io/part-of: pgtoolbox
rules:
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - backups
  - clusters
  - databaseroles
  - databases
  - failoverquorums
  - imagecatalogs
  - poolers
  - publications
  - scheduledbackups
  - subscriptions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - backups
  verbs:
  - create
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - databaseroles
  verbs:
  - create
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  - clusters/status
  verbs:
  - patch
- apiGroups:
  - pgtoolbox.fyannk.dev
  resources:
  - pgadmins
  verbs:
  - get
- apiGroups:
  - pgtoolbox.fyannk.dev
  resources:
  - pgaccessrequests
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - pgtoolbox.fyannk.dev
  resources:
  - pgaccessrequests/status
  verbs:
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - create
- apiGroups:
  - barmancloud.cnpg.io
  resources:
  - objectstores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pgbackrest.dalibo.com
  resources:
  - stanzas
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pgbackrest.cnpg.opera.com
  resources:
  - archives
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  - persistentvolumeclaims
  - pods
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
