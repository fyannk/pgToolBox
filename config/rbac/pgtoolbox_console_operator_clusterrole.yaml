# The role of a person who may change things: the viewer's rules plus
# the three writes the console offers, each made with the person's own token
# (create backups; patch clusters and clusters/status for promote and fencing) and
# `connect pgadmins`: pgAdmin is dba-only, because whoever may open it holds the
# credentials of every role it offers. On OpenShift the
# oauth-proxy in front of pgAdmin checks exactly that verb
# (--openshift-sar connect pgadmins/<name>), and the console offers the link to
# whoever holds it. Not `get`: OLM aggregates get/list/watch on its owned CRDs
# into the built-in `view` role, so every namespace reader holds it there.
#
# Access requests: this role does NOT decide them. An approved PgAccessRequest
# binds this role (time-boxed), so it must hold neither `create rolebindings` nor
# `update pgaccessrequests/status`: a grantee could otherwise bind themselves a
# second, permanent RoleBinding or approve other people's requests. Deciding
# is pgtoolbox-console-approver's (pgtoolbox_console_approver_clusterrole.yaml),
# which no request can grant.
#
# Bound per namespace with a RoleBinding; the product renders no ClusterRoleBinding.
# Hand-written source of truth, see pgtoolbox_console_viewer_clusterrole.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgtoolbox-console-operator
  labels:
    app.kubernetes.io/part-of: pgtoolbox
rules:
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - backups
  - clusters
  - databaseroles
  - databases
  - failoverquorums
  - imagecatalogs
  - poolers
  - publications
  - scheduledbackups
  - subscriptions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - backups
  verbs:
  - create
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - databaseroles
  verbs:
  - create
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  - clusters/status
  verbs:
  - patch
- apiGroups:
  - pgtoolbox.fyannk.dev
  resources:
  - pgadmins
  verbs:
  - connect
  - get
- apiGroups:
  - pgtoolbox.fyannk.dev
  resources:
  - pgaccessrequests
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - barmancloud.cnpg.io
  resources:
  - objectstores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pgbackrest.dalibo.com
  resources:
  - stanzas
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pgbackrest.cnpg.opera.com
  resources:
  - archives
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  - persistentvolumeclaims
  - pods
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
