---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pgtoolbox-image-override
  labels:
    app.kubernetes.io/name: pgtoolbox
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [pgtoolbox.fyannk.dev]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [pgadmins, evidenceagents, pgtoolboxconsoles]
  variables:
    - name: allowedUsers
      expression: "[]"
    - name: allowedGroups
      expression: "[\"system:masters\"]"
    - name: identityUsers
      expression: "[]"
    - name: identityGroups
      expression: "[\"system:masters\"]"
    - name: specChanged
      expression: >-
        oldObject == null || has(object.spec) != has(oldObject.spec) || (has(object.spec) && object.spec != oldObject.spec)
    # The name of every Secret the spec references, one reference per line.
    - name: secretRefs
      expression: >-
        request.resource.resource == 'pgtoolboxconsoles' ? (
        (has(object.spec.auth) && has(object.spec.auth.oidc) ? [string(object.spec.auth.oidc.clientSecretRef.name)] : []) +
        (has(object.spec.auth) && has(object.spec.auth.oidc) && has(object.spec.auth.oidc.grantClient) ? [string(object.spec.auth.oidc.grantClient.clientSecretRef.name)] : []) +
        (has(object.spec.auth) && has(object.spec.auth.openshift) && has(object.spec.auth.openshift.clientSecretRef) ? [string(object.spec.auth.openshift.clientSecretRef.name)] : []) +
        (has(object.spec.prometheus) && has(object.spec.prometheus.tokenSecretRef) ? [string(object.spec.prometheus.tokenSecretRef.name)] : []) +
        (has(object.spec.digest) && has(object.spec.digest.delivery) && has(object.spec.digest.delivery.chatWebhookSecretRef) ? [string(object.spec.digest.delivery.chatWebhookSecretRef.name)] : []) +
        (has(object.spec.digest) && has(object.spec.digest.delivery) && has(object.spec.digest.delivery.webhookSecretRef) ? [string(object.spec.digest.delivery.webhookSecretRef.name)] : []) +
        (has(object.spec.digest) && has(object.spec.digest.delivery) && has(object.spec.digest.delivery.smtp) && has(object.spec.digest.delivery.smtp.passwordSecretRef) ? [string(object.spec.digest.delivery.smtp.passwordSecretRef.name)] : []) +
        (has(object.spec.tracing) && has(object.spec.tracing.headersSecretRef) ? [string(object.spec.tracing.headersSecretRef.name)] : []) +
        (has(object.spec.restoreDrills) && has(object.spec.restoreDrills.sealKeySecretRef) ? [string(object.spec.restoreDrills.sealKeySecretRef.name)] : []) +
        (has(object.spec.exposure) && has(object.spec.exposure.tls) && has(object.spec.exposure.tls.certificateSecretRef) ? [string(object.spec.exposure.tls.certificateSecretRef.name)] : []) +
        (has(object.spec.image) && has(object.spec.image.pullSecrets) ? object.spec.image.pullSecrets.map(s, string(s.name)) : [])
        ) : request.resource.resource == 'pgadmins' ? (
        (has(object.spec.auth) && has(object.spec.auth.oauth2) ? [string(object.spec.auth.oauth2.clientSecretRef.name)] : []) +
        (has(object.spec.auth) && has(object.spec.auth.openshiftOAuthProxy) && has(object.spec.auth.openshiftOAuthProxy.image) && has(object.spec.auth.openshiftOAuthProxy.image.pullSecrets) ? object.spec.auth.openshiftOAuthProxy.image.pullSecrets.map(s, string(s.name)) : []) +
        (has(object.spec.exposure) && has(object.spec.exposure.tls) && has(object.spec.exposure.tls.certificateSecretRef) ? [string(object.spec.exposure.tls.certificateSecretRef.name)] : []) +
        (has(object.spec.image) && has(object.spec.image.pullSecrets) ? object.spec.image.pullSecrets.map(s, string(s.name)) : [])
        ) : request.resource.resource == 'evidenceagents' ? (
        (has(object.spec.allowedSecrets) ? object.spec.allowedSecrets.map(s, string(s)) : [])
        ) : []
    - name: consoleServiceAccount
      expression: >-
        object.metadata.name.contains('console') ? object.metadata.name : object.metadata.name + '-console'
    - name: exposureType
      expression: >-
        request.resource.resource == 'evidenceagents' || !has(object.spec.exposure) || !has(object.spec.exposure.type) ? 'clusterIP' : string(object.spec.exposure.type)
  validations:
    - expression: >-
        request.resource.resource == 'pgtoolboxconsoles' ||
        !has(object.spec.image) ||
        (oldObject != null && has(oldObject.spec.image) && object.spec.image == oldObject.spec.image) ||
        request.userInfo.username in variables.allowedUsers ||
        request.userInfo.groups.exists(g, g in variables.allowedGroups)
      message: spec.image may be set only by the users and groups the platform team listed in the operator chart (operator.admissionPolicy.imageOverride); omit it to use the operator's default image
      reason: Forbidden
    - expression: >-
        request.resource.resource != 'evidenceagents' ||
        !has(object.spec.workloadIdentity) ||
        (oldObject != null && has(oldObject.spec.workloadIdentity) && object.spec.workloadIdentity == oldObject.spec.workloadIdentity) ||
        request.userInfo.username in variables.identityUsers ||
        request.userInfo.groups.exists(g, g in variables.identityGroups)
      message: spec.workloadIdentity may be set only by the users and groups the platform team listed in the operator chart (operator.admissionPolicy.workloadIdentity)
      reason: Forbidden
    - expression: >-
        !variables.specChanged || (variables.secretRefs.size() <= 2 ?
        variables.secretRefs.all(n, authorizer.group('').resource('secrets').namespace(object.metadata.namespace).name(n).check('get').allowed()) :
        authorizer.group('').resource('secrets').namespace(object.metadata.namespace).check('get').allowed())
      message: a PgToolBoxConsole, a PgAdmin or an EvidenceAgent requires get on every Secret it references, on create and on any change of its spec; one that references more than two requires get on every Secret of the namespace
      reason: Forbidden
    - expression: >-
        request.resource.resource != 'pgadmins' || !variables.specChanged ||
        !(has(object.spec.configDatabase) ||
        (((has(object.spec.clusterRefs) && object.spec.clusterRefs.size() > 0) || has(object.spec.clusterSelector)) &&
        (!has(object.spec.credentials) ||
        !has(object.spec.credentials.application) || object.spec.credentials.application ||
        !has(object.spec.credentials.databaseRoles) || object.spec.credentials.databaseRoles ||
        (has(object.spec.credentials.superuser) && object.spec.credentials.superuser)))) ||
        authorizer.group('').resource('secrets').namespace(object.metadata.namespace).check('get').allowed()
      message: a PgAdmin that offers the credentials of Clusters of its namespace (spec.credentials with clusterRefs or clusterSelector) or keeps its settings on one (spec.configDatabase) requires get on the Secrets of the namespace, on create and on any change of its spec
      reason: Forbidden
    - expression: >-
        request.resource.resource != 'pgtoolboxconsoles' || !variables.specChanged ||
        !(has(object.spec.prometheus) && has(object.spec.prometheus.projectedToken) && object.spec.prometheus.projectedToken) ||
        authorizer.group('').resource('serviceaccounts').subresource('token').namespace(object.metadata.namespace).name(variables.consoleServiceAccount).check('create').allowed()
      message: a PgToolBoxConsole that sends its projected ServiceAccount token to Prometheus (spec.prometheus.projectedToken) requires create on serviceaccounts/token for the console's ServiceAccount, on create and on any change of its spec
      reason: Forbidden
    - expression: >-
        !variables.specChanged || variables.exposureType == 'clusterIP' ||
        !((has(object.spec.exposure.annotations) && object.spec.exposure.annotations.size() > 0) ||
        (has(object.spec.metadataPropagation) && object.spec.metadataPropagation.exists(r,
        r.target in ['All', 'Exposure', 'Service'] && has(r.annotations) && r.annotations.size() > 0))) ||
        authorizer.group(variables.exposureType == 'route' ? 'route.openshift.io' : variables.exposureType == 'gateway' ? 'gateway.networking.k8s.io' : 'networking.k8s.io').resource(variables.exposureType == 'route' ? 'routes' : variables.exposureType == 'gateway' ? 'httproutes' : 'ingresses').namespace(object.metadata.namespace).check('create').allowed()
      message: annotations on the exposure object or the Service (spec.exposure.annotations, metadataPropagation for All, Exposure or Service) require create on the exposure kind (ingresses, routes or httproutes) in the namespace, on create and on any change of its spec
      reason: Forbidden


