    # create the exposure object. Adding or changing one takes create on
    # that kind in the namespace.
    - expression: >-
        variables.exposureAnnotationsKept ||
        authorizer.group(variables.exposureType == 'route' ? 'route.openshift.io' : variables.exposureType == 'gateway' ? 'gateway.networking.k8s.io' : 'networking.k8s.io').resource(variables.exposureType == 'route' ? 'routes' : variables.exposureType == 'gateway' ? 'httproutes' : 'ingresses').namespace(object.metadata.namespace).check('create').allowed()
      message: an exposure annotation that an ingress controller reads as configuration (a snippet, authentication, a source range, a redirect, a canary, an extra host, a load-balancer scheme or group, mirroring, a middleware or plugin; see the security documentation), on the exposure object or the Service, requires create on the exposure kind (ingresses, routes or httproutes) in the namespace; adding or changing one, or changing the exposure type, is checked again
      reason: Forbidden


