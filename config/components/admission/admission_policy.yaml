      message: a PgToolBoxConsole that sends its projected ServiceAccount token to Prometheus (spec.prometheus.projectedToken) requires create on serviceaccounts/token for the console's ServiceAccount; changing the URL, the CA ConfigMap or the audience is checked again
      reason: Forbidden
    - expression: >-
        request.resource.resource != 'pgadmins' ||
        ((variables.credentialKinds.size() == 0 || variables.credentialSources.size() == 0) && !has(object.spec.configDatabase)) ||
        (oldObject != null &&
        variables.credentialKinds.all(k, k in variables.oldCredentialKinds) &&
        variables.credentialSources.all(s, s in variables.oldCredentialSources) &&
        (!has(object.spec.clusterSelector) || (has(oldObject.spec.clusterSelector) && object.spec.clusterSelector == oldObject.spec.clusterSelector)) &&
        (!has(object.spec.configDatabase) || (has(oldObject.spec.configDatabase) && object.spec.configDatabase == oldObject.spec.configDatabase)) &&
        variables.pgadminAudienceKept) ||
        authorizer.group('').resource('secrets').namespace(object.metadata.namespace).check('get').allowed()
      message: a PgAdmin that offers the credentials of Clusters of its namespace (spec.credentials) or keeps its settings on one (spec.configDatabase, whose login role pgAdmin holds) requires get on the Secrets of the namespace, since whoever opens pgAdmin holds them; adding a credential kind or a Cluster, changing who may sign in (spec.auth, spec.admins) or raising the OpenShift proxy's sessionMaxAge is checked again
      reason: Forbidden
    # An ingress controller reads some annotations as configuration
