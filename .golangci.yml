version: "2"

# The one golangci-lint configuration of the repository. The rule for this file:
# a linter is either enforced everywhere or listed in the `exclusions` block
# below with the reason it is excluded for that area. Nothing is excluded
# silently.
run:
  timeout: 10m

# Report every finding, not a sample of each kind. The defaults cap a repeated
# issue at three occurrences per linter, which is how six identical gosec
# cookie findings first read as three.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - godot
    - godox
    - gosec
    - govet
    - importas
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - prealloc
    - revive
    - sloglint
    - staticcheck
    - unparam
    - unused
    - usestdlibvars

  settings:
    staticcheck:
      checks:
        - all
        # Comment-form and naming rules stay off: this code documents packages
        # and exported symbols where that adds meaning, not to satisfy a shape.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Quickfix refactors (De Morgan, tagged switch, naming an embedded
        # field in a selector): the explicit forms mirror the grammars they
        # check and document which type owns a validation.
        - -QF1001
        - -QF1003
        - -QF1008
    revive:
      enable-all-rules: false
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: indent-error-flow
        - name: receiver-naming
        - name: unexported-return
        - name: var-declaration
    godox:
      keywords:
        - TODO
        - FIXME
        - HACK
    importas:
      no-unaliased: true
      alias:
        - pkg: k8s.io/api/core/v1
          alias: corev1
        - pkg: k8s.io/api/apps/v1
          alias: appsv1
        - pkg: k8s.io/api/networking/v1
          alias: networkingv1
        - pkg: k8s.io/api/rbac/v1
          alias: rbacv1
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
        - pkg: github.com/cloudnative-pg/api/pkg/api/v1
          alias: cnpgv1
        - pkg: github.com/fyannk/pgToolBox/api/v1alpha1
          alias: pgtoolboxv1alpha1
        - pkg: github.com/fyannk/pgToolBox/pkg/evidence/v1alpha1
          alias: evidencev1alpha1
    sloglint:
      no-mixed-args: true
    exhaustive:
      # A `default:` is a decision about the values not listed.
      default-signifies-exhaustive: true

  exclusions:
    generated: lax
    # Dependencies of the front ends are not this repository's code: a package
    # in an npm tree can ship Go files (headlamp/node_modules/flatted does).
    paths:
      - node_modules
    rules:
      # ---- Rules that are about the code, not about an area -----------------
      # Tests may use hostile fixtures, fixed-mode files and canary credentials;
      # their security properties are asserted by the tests, not by gosec.
      - path: _test\.go
        linters:
          - gosec
      # Contract-suite helpers are test code in every respect except the name.
      - path: (storetest|providertest)/
        linters:
          - gosec
          - errcheck
      # G304 (file inclusion via variable) is inherent to the evidence agent:
      # every credential, CA bundle and token is deliberately read from an
      # operator-mounted path. The controls are the validation in
      # internal/evidence/config and evidenceapi (absolute clean paths, mode and
      # symlink gates, size ceilings), not a constant filename.
      - path: ^internal/evidence/
        text: "G304"
        linters:
          - gosec
      - path: ^internal/evidence/.*_test\.go
        linters:
          - errcheck
      # option.WithCredentialsJSON is deprecated upstream in favour of
      # credential files/ADC; changing how the GCS adapter builds a credential
      # is a credential-path change that needs its own proof update.
      - path: ^internal/evidence/provider/gcs/store\.go
        text: "SA1019"

      # The evidence-artifacts generator is a development tool that reads the
      # path it is told to check; it never runs in a product binary.
      - path: ^pkg/evidence/cmd/evidence-artifacts/
        text: "G304"
        linters: [gosec]

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gofumpt:
      module-path: github.com/fyannk/pgToolBox
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/fyannk/pgToolBox)
