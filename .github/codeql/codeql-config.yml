# CodeQL configuration for security.yml (the queries are set there:
# security-extended). Only code that never ships and that a scan has nothing
# to say about is left out; each entry says why.
name: pgToolBox CodeQL
paths-ignore:
  # The Mock Service Worker script (generated by `msw init`) and the API
  # fixtures: they run only under Vitest, Storybook and Playwright, never in
  # the console image (ui/dist is built from ui/src).
  - ui/mocks/**
