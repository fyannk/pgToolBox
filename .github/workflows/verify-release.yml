name: Verify release

# What a stranger does with a release, with no registry credentials: pull every
# image and chart by tag, verify the keyless cosign signature and the GitHub
# attestation of each by digest (hack/release.sh verify-published). Two ways in:
#
#   workflow_call   release.yml: a release that cannot be verified anonymously
#                   is not finished.
#   workflow_dispatch  by hand, for any published tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag (vX.Y.Z or vX.Y.Z-rc.N)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to verify (empty: the latest stable release)"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: verify-release-${{ inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the published packages anonymously
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository, read the release list
    steps:
      # Only mise.toml and the verification script are used; no registry login
      # follows, on purpose.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick the release to verify
        id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          if [[ -z "${tag}" ]]; then
            # /releases/latest is the newest published, non-draft, non-prerelease one.
            tag="$(gh api "repos/${REPO}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          fi
          if [[ -z "${tag}" ]]; then
            echo "::notice::no stable release is published yet; nothing to verify"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Install the pinned tools
        if: steps.pick.outputs.tag != ''
        uses: ./.github/actions/toolchain
        with:
          tools: helm
          mise-cache: "false"
      - name: Set up Buildx
        if: steps.pick.outputs.tag != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install cosign
        if: steps.pick.outputs.tag != ''
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"
      # The token is the workflow's read-only GitHub token, for the attestation
      # API only; the registry is read without credentials.
      - name: Pull, verify the signature and the attestation
        if: steps.pick.outputs.tag != ''
        env:
          TAG: ${{ steps.pick.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./hack/release.sh verify-published "${TAG}"
