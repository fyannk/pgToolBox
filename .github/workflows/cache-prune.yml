name: Cache prune

# GitHub keeps 10 GB of Actions cache per repository and evicts the least
# recently used entry when it is full, at whatever moment a build happens to
# need it. Caches here are written from main only, but every go.sum or lockfile
# change leaves the previous hash's entries behind. After every CI and Security
# run on main (a run is what writes ~4 GB) and once a day, this deletes the
# caches of pull requests that are not open, all but the newest of each logical
# cache and, past 4 GiB, buildkit blobs and rebuildable build caches first
# (hack/prune-caches.sh): the budget plus one full run's writes stays under the
# 10 GB cap.
# `actions: write` is held by this one job and nothing else.
on:
  schedule:
    - cron: "17 3 * * *"
  # The run that wrote the caches is the moment to prune them: a daily job alone
  # lets a busy day on main pass the cap. Only runs on main write caches.
  workflow_run: # zizmor: ignore[dangerous-triggers] checks out the default branch only, runs one script, reads nothing from the triggering run
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted, delete nothing
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: cache-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Prune the Actions cache
    # A run of a pull request or of a fork never writes a cache; skip it.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the script
      actions: write # delete cache entries
      pull-requests: read # which pull requests are still open
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "${DRY_RUN}" == "true" ]]; then
            ./hack/prune-caches.sh --dry-run
          else
            ./hack/prune-caches.sh
          fi
