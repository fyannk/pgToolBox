name: Cache prune

# GitHub keeps 10 GB of Actions cache per repository and evicts the least
# recently used entry when it is full, at whatever moment a build happens to
# need it. Caches here are written from main only, but every go.sum or lockfile
# change leaves the previous hash's entries behind. Once a day this deletes the
# caches of pull requests that are not open, all but the newest of each logical
# cache and, past 6 GiB, buildkit blobs and rebuildable build caches first (hack/prune-caches.sh).
# `actions: write` is held by this one job and nothing else.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted, delete nothing
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: cache-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Prune the Actions cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the script
      actions: write # delete cache entries
      pull-requests: read # which pull requests are still open
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "${DRY_RUN}" == "true" ]]; then
            ./hack/prune-caches.sh --dry-run
          else
            ./hack/prune-caches.sh
          fi
