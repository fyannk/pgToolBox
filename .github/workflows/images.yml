name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build and push container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The git tag is v0.1.0; the image tag is 0.1.0. They have to agree
      # with the Helm chart's appVersion and the OLM CSV's version, both of
      # which are plain semver — a chart installed at 0.1.0 must resolve an
      # image that exists.
      - name: Compute image tag
        id: imgtag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "tag=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push manager image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: manager
          push: true
          build-args: |
            VERSION=${{ steps.imgtag.outputs.tag }}
            IMG=ghcr.io/${{ github.repository_owner }}/pgtoolbox:${{ steps.imgtag.outputs.tag }}
          tags: ghcr.io/${{ github.repository_owner }}/pgtoolbox:${{ steps.imgtag.outputs.tag }}

      - name: Build and push proxy image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: proxy
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pgtoolbox-proxy:${{ steps.imgtag.outputs.tag }}

      - name: Build and push OLM bundle image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: deploy/olm/bundle
          file: deploy/olm/bundle.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pgtoolbox-bundle:${{ steps.imgtag.outputs.tag }}

      - name: Build and push OLM catalog image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: deploy/olm/catalog
          file: deploy/olm/catalog.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pgtoolbox-catalog:${{ steps.imgtag.outputs.tag }}
