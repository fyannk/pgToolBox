name: Matrix

# The kind x CloudNativePG matrix (hack/matrix.sh defines the cells): each
# supported Kubernetes minor against the supported CloudNativePG release, and
# CloudNativePG main as a non-blocking cell. ci.yml runs the scenarios on one
# pinned cell; this finds the break a new Kubernetes or CloudNativePG minor
# causes. Nightly, and by hand for one cell. Every Kubernetes x CNPG x
# scenario row is its own job on its own runner, and the images are built once
# for the run (images job) and loaded by every row.
on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:
    inputs:
      kubernetes:
        description: Kubernetes minor
        type: choice
        options: [all, "1.34", "1.36"]
        default: all
      cnpg:
        description: CloudNativePG version (main is non-blocking)
        type: choice
        options: [all, 1.30.1, main]
        default: all
      scenario:
        description: Scenario
        type: choice
        options: [all, console, evidenceagent, pgadmin]
        default: all

permissions: {}

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the cells
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the repository
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Print the matrix
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          KUBERNETES: ${{ inputs.kubernetes || 'all' }}
          CNPG: ${{ inputs.cnpg || 'all' }}
          SCENARIO: ${{ inputs.scenario || 'all' }}
        run: |
          set -euo pipefail
          NIGHTLY=false
          if [[ "${EVENT}" == "schedule" ]]; then NIGHTLY=true; fi
          export NIGHTLY
          echo "matrix=$(./hack/matrix.sh plan)" >> "${GITHUB_OUTPUT}"

  # The same build as ci.yml's e2e-images job, from the same gha cache.
  images:
    name: Image ${{ matrix.image }} (linux/amd64, for kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        image: [operator, console, evidence-agent]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 into an archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/amd64
          build-args: |
            VERSION=e2e
          tags: pgtoolbox-${{ matrix.image }}:prebuilt
          outputs: type=docker,dest=${{ runner.temp }}/pgtoolbox-${{ matrix.image }}.tar
          cache-from: type=gha,scope=image-${{ matrix.image }}
      - name: Hand the image to the cells
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-image-${{ matrix.image }}
          path: ${{ runner.temp }}/pgtoolbox-${{ matrix.image }}.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  cell:
    name: ${{ matrix.name }}
    needs: [plan, images]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    # CloudNativePG main is a moving target: its cell reports, it does not fail
    # the run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      E2E_REQUIRE_KUBECONFIG: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: go kind kubectl helm
          go-cache: "true"
      - name: Download the images of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - name: Load the images
        run: |
          set -euo pipefail
          for archive in "${RUNNER_TEMP}"/images/pgtoolbox-*.tar; do
            docker load --input "${archive}"
          done
          rm -rf "${RUNNER_TEMP}/images"
          echo "PREBUILT_IMAGES=1" >> "${GITHUB_ENV}"
      - name: Run the cell
        env:
          SCENARIO: ${{ matrix.scenario }}
          NODE_IMAGE: ${{ matrix.node_image }}
          CNPG_MANIFEST: ${{ matrix.cnpg_manifest }}
          CELL: ${{ matrix.name }}
        run: |
          set -euo pipefail
          export KUBECONFIG="${RUNNER_TEMP}/kubeconfig"
          echo "::notice::cell ${CELL}: ${NODE_IMAGE}"
          ./hack/matrix.sh run "${SCENARIO}"
      - name: Keep the failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-${{ matrix.name }}
          path: artifacts
          retention-days: 7
          if-no-files-found: ignore
