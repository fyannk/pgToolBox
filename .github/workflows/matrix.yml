name: Matrix

# The kind x CloudNativePG matrix (hack/matrix.sh defines the cells): each
# supported Kubernetes minor against the supported CloudNativePG release, and
# CloudNativePG main as a non-blocking cell. ci.yml runs the scenarios on one
# pinned cell; this finds the break a new Kubernetes or CloudNativePG minor
# causes. Nightly, and by hand for one cell.
on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:
    inputs:
      kubernetes:
        description: Kubernetes minor
        type: choice
        options: [all, "1.34", "1.36"]
        default: all
      cnpg:
        description: CloudNativePG version (main is non-blocking)
        type: choice
        options: [all, 1.30.1, main]
        default: all
      scenario:
        description: Scenario
        type: choice
        options: [all, console, evidenceagent, pgadmin]
        default: all

permissions: {}

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the cells
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the repository
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Print the matrix
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          KUBERNETES: ${{ inputs.kubernetes || 'all' }}
          CNPG: ${{ inputs.cnpg || 'all' }}
        run: |
          set -euo pipefail
          NIGHTLY=false
          if [[ "${EVENT}" == "schedule" ]]; then NIGHTLY=true; fi
          export NIGHTLY
          echo "matrix=$(./hack/matrix.sh plan)" >> "${GITHUB_OUTPUT}"

  cell:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read # check out the repository
    # CloudNativePG main is a moving target: its cell reports, it does not fail
    # the run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      E2E_REQUIRE_KUBECONFIG: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: go kind kubectl helm
          go-cache: "true"
      - name: Run the cell
        env:
          SCENARIO: ${{ inputs.scenario || 'all' }}
          NODE_IMAGE: ${{ matrix.node_image }}
          CNPG_MANIFEST: ${{ matrix.cnpg_manifest }}
          CELL: ${{ matrix.name }}
        run: |
          set -euo pipefail
          export KUBECONFIG="${RUNNER_TEMP}/kubeconfig"
          echo "::notice::cell ${CELL}: ${NODE_IMAGE}"
          ./hack/matrix.sh run "${SCENARIO}"
      - name: Keep the failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-${{ matrix.name }}
          path: artifacts
          retention-days: 7
          if-no-files-found: ignore
