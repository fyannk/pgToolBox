name: Release

on:
  push:
    tags: ["v*"]
  # Publishing the chart for a tag that already shipped, without inventing a
  # release to carry it. The release step below stays on the push trigger,
  # so a dispatch republishes the chart and nothing else.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to package and publish the chart from (e.g. v0.1.3)
        required: true
        type: string

# Restrictive at the top; the one job that publishes asks for the scope.
permissions:
  contents: read

jobs:
  release:
    name: Package Helm chart and create release
    permissions:
      contents: write # create the release
      packages: write # push the chart to ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Package Helm chart
        run: |
          mkdir -p dist
          helm package deploy/helm/pgtoolbox -d dist

      # The chart goes to the registry the images already live in, as an OCI
      # artifact rather than a repository index: it needs no hosting of its
      # own, it authenticates the way everything else here does, and Argo and
      # Flux both read it. The version comes from Chart.yaml, which
      # validate-packaging has already checked against the tag.
      - name: Log in to ghcr.io
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Push the chart
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          chart=$(ls dist/pgtoolbox-*.tgz)
          helm push "$chart" "oci://ghcr.io/${OWNER}/charts"
          echo "::notice::pushed ${chart} to oci://ghcr.io/${OWNER}/charts"

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*.tgz
          generate_release_notes: true
