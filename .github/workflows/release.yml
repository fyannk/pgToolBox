name: Release

# One workflow publishes everything a release is made of, from one tagged commit:
#
#   vX.Y.Z               the operator, console and evidence-agent images
#                        (linux/amd64 and linux/arm64), the OLM bundle and
#                        catalog images and the two Helm charts, pushed to
#                        GHCR; each signed keyless with cosign and attested
#                        (GitHub build provenance, BuildKit SLSA provenance and
#                        SBOM); then a GitHub release with notes from the
#                        CHANGELOG, the charts, the installer manifests, the
#                        SBOMs and a signed SHA256SUMS. A tag with a
#                        pre-release part (v0.2.0-rc.1) makes a pre-release and
#                        never moves `latest`.
#   pkg/evidence/vX.Y.Z  the nested evidence module: module path, semver,
#                        annotation and zero-requirements checks, green CI on
#                        the tagged commit, a release with no images.
#
# The dry run (the same build, nothing pushed) is release-dry-run.yml: a
# workflow that a pull request or a schedule starts never holds the publishing
# permissions, and nothing here checks out or runs a ref other than the tag.
#
# Order matters: the images are pushed with their version tag only, scanned by
# digest, and only then does `latest` move and the release become visible. A
# fixable critical in a pushed image stops the release before anyone is told.
# Nothing is published from main. hack/release.sh holds the logic; make
# release-check and make release-dry-run run it on a laptop.
#
# No cache is read or written here: a release is built from the tagged commit
# alone. The digest and release-file artifacts expire after 7 days: past that, a
# failed run cannot be finished, and the next release candidate (rc.N+1)
# supersedes it. After the optional prune, verify-release.yml pulls everything with no
# credentials and verifies it.
on:
  push:
    tags: ["v*", "pkg/evidence/v*"]
  # Republishing for a tag that already exists. A published release is left as
  # it is. To finish a run that failed part-way, use "Re-run failed jobs" on
  # that run, not a new dispatch: a new run rebuilds the images and publishes
  # new digests under the same tag (see docs/site/docs/development/ci.md#when-a-release-fails).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (vX.Y.Z or pkg/evidence/vX.Y.Z)
        required: true
        type: string

# Nothing is granted by default; each job states what it needs.
permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  OWNER: ${{ github.repository_owner }}

jobs:
  # The release environment admits only refs that are v* or pkg/evidence/v*
  # tags (repository protected-tag ruleset: no update, no deletion) and waits
  # for the maintainer's approval, once, here: every publishing job needs this
  # one. A dispatch from a branch therefore never starts, and every signature
  # names release.yml@refs/tags/..., which is what the verification on the
  # release page requires.
  prepare:
    name: Resolve and verify the release
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 70
    permissions:
      contents: read # check out the repository and read the release list
      checks: read # read the check runs of the tagged commit
      actions: read # hack/release.sh wait-ci lists the workflow runs of the tagged commit (full-tier check)
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      kind: ${{ steps.resolve.outputs.kind }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      published: ${{ steps.resolve.outputs.published }}
      created: ${{ steps.resolve.outputs.created }}
    steps:
      - name: Check out the repository with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: go
          mise-cache: "false"
      - name: Resolve the release
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            # The workflow file that runs (and signs: release.yml@refs/tags/...)
            # is the one of the ref the dispatch was started from; it must be
            # the tag being published, or a release of one tag would be built
            # by the workflow of another.
            if [[ "${DISPATCH_TAG}" != "${REF_NAME}" ]]; then
              echo "dispatch input tag ${DISPATCH_TAG} is not the ref the workflow runs from (${REF_NAME}); start it with --ref ${DISPATCH_TAG}" >&2
              exit 1
            fi
            tag="${DISPATCH_TAG}"
          else
            tag="${REF_NAME}"
          fi
          kind=product
          [[ "${tag}" != pkg/evidence/v* ]] || kind=module
          if [[ "${kind}" == product ]]; then
            [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
              || { echo "release tag must be semantic and start with v: ${tag}" >&2; exit 1; }
          fi
          sha="$(git rev-list -n 1 "refs/tags/${tag}")"
          # GITHUB_SHA is the tagged commit on a push of an annotated tag (the
          # event's `after` is the tag object); peel it anyway so that a tag
          # object SHA would still compare as the commit it points at.
          if [[ "${EVENT}" == "push" && "${sha}" != "$(git rev-parse --verify "${GITHUB_SHA}^{commit}")" ]]; then
            echo "tag moved after the release workflow started" >&2
            exit 1
          fi
          version="${tag##*/v}"
          prerelease=false
          [[ "${version}" != *-* ]] || prerelease=true
          # The tagged commit's time: the `created` label, so two builds of a
          # tag carry the same one. Images are NOT bit-for-bit reproducible
          # (BuildKit provenance mode=max records the build itself).
          source_date_epoch="$(git log -1 --format=%ct "${sha}")"
          created="$(date -u -d "@${source_date_epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          published=false
          if [[ "$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft == false' 2>/dev/null || true)" == "true" ]]; then
            published=true
            echo "::notice::${tag} is already published; nothing will be pushed again"
          fi
          {
            echo "mode=publish"; echo "kind=${kind}"; echo "tag=${tag}"; echo "version=${version}"
            echo "sha=${sha}"; echo "prerelease=${prerelease}"; echo "published=${published}"
            echo "created=${created}"
          } >> "${GITHUB_OUTPUT}"
      - name: Check semver, annotated tag on main, chart versions and CHANGELOG
        env:
          KIND: ${{ steps.resolve.outputs.kind }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${KIND}" == module ]]; then
            REQUIRE_TAG=1 REQUIRE_MAIN=1 ./hack/release.sh check-module "${TAG}"
          else
            REQUIRE_TAG=1 REQUIRE_MAIN=1 ./hack/release.sh check "${TAG}"
          fi
      # ci-ok and security-gate on the exact commit: the release publishes what
      # the pipeline already approved, not what it hopes will pass.
      - name: Wait for green CI and security on the tagged commit
        if: steps.resolve.outputs.mode == 'publish' && steps.resolve.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
          CI_WAIT_ATTEMPTS: "120" # 60 minutes: main's run of the commit is normally done before the tag
        run: |
          set -euo pipefail
          ./hack/release.sh wait-ci "${SHA}"

  images:
    name: Image ${{ matrix.image }} (build, push, sign, attest)
    needs: prepare
    if: needs.prepare.outputs.mode == 'publish' && needs.prepare.outputs.kind == 'product' && needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read # check out the tagged commit
      packages: write # push the image and its signature to GHCR
      id-token: write # keyless cosign signature and build provenance
      attestations: write # GitHub artifact attestations
    strategy:
      fail-fast: false
      matrix:
        image: [operator, console, evidence-agent]
        # Per-image OCI title and description, passed to metadata-action below:
        # its defaults (the repository's name and description) would replace the
        # Dockerfile's labels and make the three images read alike.
        include:
          - image: operator
            title: pgToolBox operator
            description: Kubernetes operator that deploys the pgToolBox access stack for CloudNativePG clusters
          - image: console
            title: pgToolBox console
            description: Operational console for one CloudNativePG cluster
          - image: evidence-agent
            title: pgToolBox evidence agent
            description: Read-only viewer and evidence producer for a PostgreSQL backup repository
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/pgtoolbox-${{ matrix.image }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REF }}
          tags: type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
      # The version tag only. `latest` moves after the scan, in the release job.
      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            IMG=ghcr.io/${{ github.repository_owner }}/pgtoolbox-operator:${{ needs.prepare.outputs.version }}
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest the build provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # By digest, never by tag: a tag that moves later takes no signature with it.
      - name: Sign by digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_REF}@${DIGEST}"
      # What a user runs (release page), run here: a signature or attestation
      # that does not verify fails the release before anything points at it.
      - name: Verify the signature and the provenance
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The Sigstore entry and the attestation can lag the push by a minute:
          # the same bounded retry as verify-published (VERIFY_ATTEMPTS x VERIFY_SLEEP).
          ./hack/release.sh retry cosign verify "${IMAGE_REF}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          ./hack/release.sh retry gh attestation verify "oci://${IMAGE_REF}@${DIGEST}" --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          echo "verified ${IMAGE_REF}@${DIGEST}"
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir -p digests
          echo "${IMAGE_REF}@${DIGEST}" > "digests/${IMAGE}.txt"
      - name: Hand the digest to the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digests
          retention-days: 7

  publish:
    name: OLM images, charts, manifests, SBOMs
    needs: [prepare, images]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # check out the tagged commit
      packages: write # push the bundle, catalog and charts to GHCR
      id-token: write # keyless cosign signatures and build provenance
      attestations: write # GitHub artifact attestations
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      OUT_DIR: ${{ github.workspace }}/dist/release
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: helm kubectl
          mise-cache: "false"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"
      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect the image digests
        id: collect-digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Say what to do when the artifacts are gone
        if: failure() && steps.collect-digests.outcome == 'failure'
        run: |
          echo "::error::The digest or release-file artifacts of this run are kept 7 days and are gone. A re-run after that cannot reuse them, and a new run of the same tag would push NEW digests under it. Cut the next release candidate instead (rc.N+1, never move or delete a tag): see docs/site/docs/development/ci.md#when-a-release-fails."
      - name: Write digests.txt
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          cat digests/*.txt | LC_ALL=C sort > "${OUT_DIR}/digests.txt"
          [[ "$(wc -l < "${OUT_DIR}/digests.txt")" -eq 3 ]] || { echo "expected three image digests" >&2; cat "${OUT_DIR}/digests.txt" >&2; exit 1; }
          cat "${OUT_DIR}/digests.txt"
      # The bundle names the operator and the evidence agent by digest, so it is
      # built from a copy of deploy/olm/bundle in which repo:VERSION is repo@digest.
      - name: Pin the bundle to the image digests
        run: |
          set -euo pipefail
          rm -rf olm/bundle
          mkdir -p olm
          cp -r deploy/olm/bundle olm/bundle
          while IFS= read -r f; do
            ./hack/release.sh pin-refs "${f}" "${OUT_DIR}/digests.txt" "${VERSION}"
          done < <(grep -rlE "ghcr\.io/[^/]+/pgtoolbox-" olm/bundle || true)
      - name: Bundle labels
        id: bundle-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/pgtoolbox-bundle
          tags: type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=pgToolBox OLM bundle
            org.opencontainers.image.description=Operator Lifecycle Manager bundle of the pgToolBox operator
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
      - name: Build and push the bundle
        id: bundle
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: olm/bundle
          file: deploy/olm/bundle.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.bundle-meta.outputs.tags }}
          labels: ${{ steps.bundle-meta.outputs.labels }}
      - name: Sign the bundle
        env:
          DIGEST: ${{ steps.bundle.outputs.digest }}
          REF: ghcr.io/${{ github.repository_owner }}/pgtoolbox-bundle
        run: |
          set -euo pipefail
          cosign sign --yes "${REF}@${DIGEST}"
          echo "${REF}@${DIGEST}" >> "${OUT_DIR}/digests.txt"
      - name: Attest the bundle provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/pgtoolbox-bundle
          subject-digest: ${{ steps.bundle.outputs.digest }}
          push-to-registry: true
      # The catalog names the bundle, so it is built after the bundle exists.
      - name: Pin the catalog to the bundle digest
        run: |
          set -euo pipefail
          rm -rf olm/catalog
          cp -r deploy/olm/catalog olm/catalog
          while IFS= read -r f; do
            ./hack/release.sh pin-refs "${f}" "${OUT_DIR}/digests.txt" "${VERSION}"
          done < <(grep -rlE "ghcr\.io/[^/]+/pgtoolbox-" olm/catalog || true)
      - name: Catalog labels
        id: catalog-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/pgtoolbox-catalog
          tags: type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=pgToolBox OLM catalog
            org.opencontainers.image.description=Operator Lifecycle Manager file-based catalog that serves the pgToolBox bundle
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
      - name: Build and push the catalog
        id: catalog
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: olm/catalog
          file: deploy/olm/catalog.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.catalog-meta.outputs.tags }}
          labels: ${{ steps.catalog-meta.outputs.labels }}
      - name: Sign the catalog
        env:
          DIGEST: ${{ steps.catalog.outputs.digest }}
          REF: ghcr.io/${{ github.repository_owner }}/pgtoolbox-catalog
        run: |
          set -euo pipefail
          cosign sign --yes "${REF}@${DIGEST}"
          echo "${REF}@${DIGEST}" >> "${OUT_DIR}/digests.txt"
      - name: Attest the catalog provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/pgtoolbox-catalog
          subject-digest: ${{ steps.catalog.outputs.digest }}
          push-to-registry: true
      # Each chart is a copy whose images are the digests just pushed (the tag
      # stays in a comment), rendered and checked before it is packaged. The
      # bundle and the catalog are not charts' images, so only the three go in.
      - name: Package the charts and render the installer manifests
        run: |
          set -euo pipefail
          grep -E 'pgtoolbox-(operator|console|evidence-agent)@' "${OUT_DIR}/digests.txt" > "${OUT_DIR}/image-digests.txt"
          ./hack/release.sh package-charts "${OUT_DIR}/image-digests.txt" "${VERSION}"
          ./hack/release.sh install-manifests "${OUT_DIR}/image-digests.txt" "${VERSION}"
          rm "${OUT_DIR}/image-digests.txt"
      - name: Push and sign the charts
        id: charts
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Explicit: Helm's fallback to the docker credentials is not relied on.
          printf '%s' "${GHCR_TOKEN}" | helm registry login ghcr.io --username "${GHCR_ACTOR}" --password-stdin
          for chart in pgtoolbox pgtools; do
            helm push "${OUT_DIR}/${chart}-${VERSION}.tgz" "oci://ghcr.io/${OWNER,,}/charts" 2>&1 | tee push.log
            digest="$(sed -n 's/^Digest: *//p' push.log)"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest in helm push output" >&2; exit 1; }
            ref="ghcr.io/${OWNER,,}/charts/${chart}"
            cosign sign --yes "${ref}@${digest}"
            echo "${chart}=${digest}" >> "${GITHUB_OUTPUT}"
            echo "${ref}@${digest}" >> "${OUT_DIR}/chart-digests.txt"
          done
      - name: Attest the pgtoolbox chart (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/pgtoolbox
          subject-digest: ${{ steps.charts.outputs.pgtoolbox }}
          push-to-registry: true
      - name: Attest the pgtools chart (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/pgtools
          subject-digest: ${{ steps.charts.outputs.pgtools }}
          push-to-registry: true
      # One SPDX SBOM per image and platform, taken from the registry by digest.
      - name: SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          while read -r ref; do
            name="${ref##*/}"
            name="${name%@*}"
            for platform in linux/amd64 linux/arm64; do
              "${SYFT}" "registry:${ref}" --platform "${platform}" -o "spdx-json=${OUT_DIR}/sbom-${name}-${platform#linux/}.spdx.json" -q
            done
          done < "${OUT_DIR}/digests.txt"
      - name: Checksums, signed keyless
        run: |
          set -euo pipefail
          ./hack/release.sh sums
          cd "${OUT_DIR}"
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Hand the release files to the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/release
          retention-days: 7

  scan:
    name: Scan the pushed digests
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the workflow's commit
      packages: read # pull the pushed images
    steps:
      # Only mise.toml is read here (the scanner's pinned version), so the
      # checkout is the commit this workflow runs from, not the tag: the
      # scanner and its policy come from the trusted ref, and nothing of the
      # tagged tree runs in this job.
      - name: Check out the workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: aqua:anchore/grype
          mise-cache: "false"
      # New GHCR packages are private: without a login the scanner gets a 401.
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect the release files
        id: collect-files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist/release
      - name: Say what to do when the artifacts are gone
        if: failure() && steps.collect-files.outcome == 'failure'
        run: |
          echo "::error::The digest or release-file artifacts of this run are kept 7 days and are gone. A re-run after that cannot reuse them, and a new run of the same tag would push NEW digests under it. Cut the next release candidate instead (rc.N+1, never move or delete a tag): see docs/site/docs/development/ci.md#when-a-release-fails."
      # SECURITY.md: a fixable critical blocks the release (exit 1). A registry
      # or authentication error is a different failure (exit 2) and says so.
      # Both platforms of every image are scanned. Everything else is listed in
      # the job log and on the Security page, not hidden.
      - name: Scan every image by digest and platform
        run: ./hack/release.sh scan-digests dist/release/digests.txt

  release:
    name: Move latest, create the GitHub release
    needs: [prepare, publish, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 55 # includes up to 20 minutes of waiting for package visibility
    permissions:
      contents: write # create the release and upload its assets
      packages: write # move the latest tag of a stable release
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Collect the release files
        id: collect-files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist/release
      - name: Say what to do when the artifacts are gone
        if: failure() && steps.collect-files.outcome == 'failure'
        run: |
          echo "::error::The digest or release-file artifacts of this run are kept 7 days and are gone. A re-run after that cannot reuse them, and a new run of the same tag would push NEW digests under it. Cut the next release candidate instead (rc.N+1, never move or delete a tag): see docs/site/docs/development/ci.md#when-a-release-fails."
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Write the release notes
        run: |
          set -euo pipefail
          {
            ./hack/release.sh notes "${VERSION}"
            echo
            echo "## Commits"
            echo
            # The CHANGELOG section above is the story; the commit log is a link,
            # not a paste (the first release would list the whole history).
            ./hack/release.sh commits-link "${TAG}"
            echo
            echo "## Artifacts"
            echo
            echo "Signed by digest with cosign (keyless) and attested; see the [release page](https://fyannk.github.io/pgToolBox/docs/release/) for the verification commands. Pin by digest."
            echo
            while read -r ref; do echo "- \`${ref}\`"; done < dist/release/digests.txt
            echo
            while read -r ref; do echo "- chart \`${ref}\`"; done < dist/release/chart-digests.txt
          } > notes.md
      # A draft first: the release becomes visible only when every file is
      # attached, so a failed upload never leaves a half-published release.
      - name: Create the draft release
        run: |
          set -euo pipefail
          # A re-run after the visibility check failed finds its own draft.
          if [[ "$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)" == "true" ]]; then
            gh release delete "${TAG}" --yes
          fi
          flags=(--draft --verify-tag --title "pgToolBox ${TAG}" --notes-file notes.md)
          # latest is the product's stable release only; a candidate never is. A
          # draft cannot be latest, so a stable release says nothing here: the
          # publish step below passes --latest.
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "${TAG}" "${flags[@]}" \
            dist/release/pgtoolbox-*.tgz dist/release/pgtools-*.tgz \
            dist/release/install-*.yaml dist/release/sbom-*.spdx.json \
            dist/release/digests.txt dist/release/chart-digests.txt dist/release/SHA256SUMS dist/release/SHA256SUMS.sigstore.json
      # A release that points at packages nobody can pull is not a release.
      # New GHCR packages start private; if any digest is not publicly pullable
      # this step fails and the release stays a draft. Recovery: make the named
      # packages public, then "Re-run failed jobs" on this run.
      - name: Check that every digest is publicly pullable
        run: ./hack/release.sh check-public dist/release/digests.txt dist/release/chart-digests.txt
      # latest is a promise that this is a stable release that passed the scan
      # and whose packages are public. It moves last, after the visibility check,
      # and points at the digest that was signed, so nothing new needs signing.
      - name: Move latest (stable releases only)
        if: needs.prepare.outputs.prerelease != 'true'
        run: |
          set -euo pipefail
          while read -r ref; do
            name="${ref%@*}"
            case "${name}" in
              *pgtoolbox-bundle | *pgtoolbox-catalog) continue ;;
            esac
            docker buildx imagetools create --tag "${name}:latest" "${ref}"
          done < dist/release/digests.txt
      - name: Publish the release
        run: |
          set -euo pipefail
          if [[ "${PRERELEASE}" == "true" ]]; then
            gh release edit "${TAG}" --draft=false --latest=false
          else
            gh release edit "${TAG}" --draft=false --latest
          fi

  module:
    name: Release the nested module
    needs: prepare
    if: needs.prepare.outputs.mode == 'publish' && needs.prepare.outputs.kind == 'module' && needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create the release
        run: |
          set -euo pipefail
          module="$(awk '$1 == "module" { print $2; exit }' pkg/evidence/go.mod)"
          {
            echo "Go module \`${module}\`, version \`v${VERSION}\` (tag \`${TAG}\`)."
            echo
            echo "\`go get ${module}@v${VERSION}\`"
            echo
            echo "The module has no dependencies; its wire contract changes only in a release of its own."
            echo
            ./hack/release.sh commits "${TAG}"
          } > notes.md
          flags=(--verify-tag --title "pkg/evidence v${VERSION}" --notes-file notes.md)
          [[ "${PRERELEASE}" != "true" ]] || flags+=(--prerelease)
          # The nested module is never the repository's "latest release": that
          # badge and /releases/latest belong to the product release.
          flags+=(--latest=false)
          gh release create "${TAG}" "${flags[@]}"

  pages:
    name: Refresh the documentation site
    needs: [prepare, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch the Pages workflow
    steps:
      # The Pages environment only deploys from the default branch, and an event
      # raised with the Actions token starts no other workflow: dispatching it
      # on main is the supported way to publish the site for this release. The
      # tag is passed as `docs_ref`, so the site is built from the tagged
      # commit (main may have moved since), and deployed through main's
      # workflow definition.
      - name: Dispatch the Pages workflow on main, building the tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "${REPO}" --ref main -f "docs_ref=refs/tags/${TAG}"

  # Each push orphans the untagged manifests a retag replaced. Prune only what no
  # tagged index, signature or attestation references.
  #
  # Opt-in: set the repository variable PRUNE_GHCR to "true". It is off by
  # default because a prune cannot be undone and verify runs after it: a
  # signature or attestation that is linked to its image only through the OCI
  # `subject` field (a referrer, not a tag) could be taken for an orphan by the
  # action, and the release would turn red after it is public. Enable it once
  # a release has verified cleanly with it off, and look at one run's log
  # first (dry-run: set PRUNE_GHCR_DRY_RUN to "true").
  prune:
    name: Prune untagged ${{ matrix.package }}
    needs: [prepare, release]
    if: vars.PRUNE_GHCR == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write # delete untagged package versions
    strategy:
      fail-fast: false
      matrix:
        package:
          - pgtoolbox-operator
          - pgtoolbox-console
          - pgtoolbox-evidence-agent
          - pgtoolbox-bundle
          - pgtoolbox-catalog
    steps:
      # Do not enable delete-ghost-images: it can delete tagged release versions.
      - name: Prune orphaned GHCR manifests
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ matrix.package }}
          delete-untagged: true
          validate: true
          dry-run: ${{ vars.PRUNE_GHCR_DRY_RUN == 'true' }}

  # The release as a stranger sees it, once the packages are in their final
  # state (pruned): pull by tag with no credentials, verify the signature and
  # the attestation of every image and chart. The same workflow runs weekly
  # against the latest stable release.
  verify:
    name: Verify the published release anonymously
    needs: [prepare, release, prune]
    # always(): a skipped (the default) or failed prune (it needs package admin
    # rights on a user-owned package) must not skip the verification of a release that was published.
    if: always() && needs.release.result == 'success' && needs.prepare.outputs.kind == 'product'
    permissions:
      contents: read # check out the repository, read the release list
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
