name: Scorecard

# OpenSSF Scorecard audits the repository's own supply-chain posture: pinned
# actions, token permissions, branch protection, release signing, dangerous
# workflow patterns. It files what it finds as code-scanning alerts and, with
# publish_results, publishes the score that the Security page and the badge
# read. It is the check that notices when a later change quietly undoes one of
# the guarantees the other workflows give.
on:
  # No branch_protection_rule trigger. It fires for classic branch protection
  # only, and this repository's protection is a ruleset: editing the ruleset
  # starts nothing, so the trigger would be dead config claiming a coverage it
  # does not have. The weekly run and the push runs catch posture drift.
  schedule:
    - cron: "45 5 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # The event is part of the key because the schedule and a push to main run on
  # the same ref; without it they share a group and cancel-in-progress lets one
  # kill the other.
  group: scorecard-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Analyze repository posture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the result to the OpenSSF API
      contents: read # check out the repository
      actions: read # read workflow metadata for the Token-Permissions check
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the OpenSSF REST API, which is what makes the badge and
          # the public score work. It uploads the score only, no source.
          publish_results: true

      - name: Retain the raw result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
