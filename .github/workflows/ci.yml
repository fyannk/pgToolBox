name: CI

# The one pipeline a change has to pass. Every job runs a Makefile target, so
# the same command reproduces a failure on a laptop (`make help`). Tools come
# from mise.toml through the local toolchain action; nothing else states a
# tool version.
#
# Path filters live in hack/changed-paths.sh (the `changes` job), not in
# `on.<event>.paths`: a required check that a path filter skips never reports
# and blocks the merge. A family of jobs that does not apply is skipped, and
# the final `ci-ok` job treats skipped as passed and failed or cancelled as
# not. Make `ci-ok` the required check; it names no individual job, so adding
# a job never means editing the ruleset.
#
# Security scanning (CodeQL, govulncheck, osv-scanner, grype, gitleaks,
# kube-linter, zizmor) is security.yml; the supply-chain posture is
# scorecard.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A merge made with the Actions token starts no push run, and two changes that
  # pass apart can break together: nightly is the interval at which that is
  # worth hearing about. It also runs every job family.
  schedule:
    - cron: "17 4 * * *"
  # Every family on any branch: the full run a release wants on the commit it
  # tags when no nightly run covered it.
  workflow_dispatch:

# Nothing is granted by default; each job states what it needs.
permissions: {}

concurrency:
  # A new push to a pull request replaces the run of the previous one. Runs on
  # main are never cancelled: each merge keeps its own result, because the next
  # merge's run only tests its own diff.
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the repository to diff it
    outputs:
      go: ${{ steps.paths.outputs.go }}
      operator: ${{ steps.paths.outputs.operator }}
      console: ${{ steps.paths.outputs.console }}
      evidence: ${{ steps.paths.outputs.evidence }}
      charts: ${{ steps.paths.outputs.charts }}
      docs: ${{ steps.paths.outputs.docs }}
      ui: ${{ steps.paths.outputs.ui }}
      headlamp: ${{ steps.paths.outputs.headlamp }}
      workflows: ${{ steps.paths.outputs.workflows }}
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide which job families this change needs
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./hack/changed-paths.sh | tee -a "${GITHUB_OUTPUT}"

  # ------------------------------------------------------------ static checks

  lint:
    name: Lint (golangci-lint, gofumpt, vet, repository checks)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: go go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint
          go-cache: "true"
      - name: Lint both Go modules and run the repository checks
        run: |
          set -euo pipefail
          make lint

  lint-files:
    name: Lint (workflows, Dockerfiles, shell)
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: actionlint zizmor hadolint aqua:koalaman/shellcheck
      # actionlint for syntax and embedded shell; zizmor for injection,
      # permissions, unpinned actions and credential persistence. The token is
      # read-only and lets zizmor's online audits (impostor commits, known
      # vulnerable actions) run.
      - name: actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make lint-workflows
      - name: hadolint
        run: |
          set -euo pipefail
          make lint-docker
      - name: shellcheck
        run: |
          set -euo pipefail
          make lint-shell

  generated:
    name: Generated files are current
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.charts == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: go go:sigs.k8s.io/controller-tools/cmd/controller-gen go:github.com/elastic/crd-ref-docs
          go-cache: "true"
      # Regenerates deepcopy code, CRDs, RBAC and their Helm/OLM copies, the
      # OpenAPI document and its fixtures, the check reference, the API
      # reference and the insight pack, then fails on any difference. The SPA's
      # own generated files are checked by `pnpm generate:check` in the ui job.
      - name: Regenerate and compare
        run: |
          set -euo pipefail
          make verify-generated

  # --------------------------------------------------------------------- Go

  test:
    name: Go build and unit tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: go
          go-cache: "true"
      - name: Build and test
        run: |
          set -euo pipefail
          make build test

  race-fuzz:
    name: Race detector and fuzz smoke runs
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: go
          go-cache: "true"
      # FUZZ_TIME is seconds per target: a smoke run on every change, not a
      # campaign. `FUZZ_TIME=10m make test-fuzz` is the campaign.
      - name: Race detector, then every fuzz target for a few seconds
        run: |
          set -euo pipefail
          make test-race test-fuzz

  envtest:
    name: Envtest (CRD rules, reconcilers, operator wiring)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: go helm go:sigs.k8s.io/controller-tools/cmd/controller-gen go:sigs.k8s.io/controller-runtime/tools/setup-envtest
          go-cache: "true"
      # A real API server, on the oldest Kubernetes the OLM bundle declares and
      # on the newest the e2e uses: what a fake client cannot fail on (CEL
      # rules, RBAC escalation prevention, server-side apply, the generated
      # manager Role).
      - name: Envtest suites
        run: |
          set -euo pipefail
          make test-envtest test-envtest-evidenceagent test-envtest-admissionpolicy test-envtest-operator test-envtest-manager

  console-core:
    name: Console core (envtest per CloudNativePG minor, authz, bounds, pins)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: go go:sigs.k8s.io/controller-runtime/tools/setup-envtest
          go-cache: "true"
      - name: Informer cache, write path, authorization semantics and read-model pins
        run: |
          set -euo pipefail
          make verify-pins test-console-core test-e2e-console-authz test-bounds

  # ------------------------------------------------------------- front ends

  ui:
    name: Console UI (Biome, knip, tsc, Vitest, stories with axe, build, budgets)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    env:
      CI: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: node pnpm
          node-cache: "true"
      - name: Dependencies and the browser
        run: |
          set -euo pipefail
          make ui-install
          cd ui
          pnpm exec playwright install --with-deps chromium
      # Generated drift (`pnpm generate:check`), lint, types, unused code,
      # tokens, unit tests, stories with axe, build and size budgets.
      - name: Gate
        run: |
          set -euo pipefail
          make ui-check
      - name: Runtime dependency audit
        run: |
          set -euo pipefail
          make ui-audit

  ui-e2e:
    name: Console UI end to end (Playwright, axe, screenshots)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    env:
      CI: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: node pnpm
          node-cache: "true"
      # The screenshots are compared against baselines rendered in a fixed
      # container image, so the fonts match whatever the runner image ships.
      - name: Playwright in the baseline image
        run: |
          set -euo pipefail
          make ui-e2e
      - name: Keep the report when a screenshot differs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-e2e-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7
          if-no-files-found: ignore

  headlamp:
    name: Headlamp plugin (npm ci, lint, tsc, tests, build)
    needs: changes
    if: needs.changes.outputs.headlamp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    env:
      CI: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: node
          node-cache: "true"
      - name: Install and check
        run: |
          set -euo pipefail
          make headlamp-check

  docs:
    name: Documentation (build, links, spelling, generated references)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: go node go:github.com/elastic/crd-ref-docs aqua:lycheeverse/lychee pipx:codespell
          go-cache: "true"
          node-cache: "true"
      # Docusaurus fails the build on a broken internal link or anchor; the CRD
      # reference, the condition reasons and the settings page must be current;
      # the console's embedded documentation bundle must be buildable.
      - name: Build the site and check it
        run: |
          set -euo pipefail
          make docs
      - name: Spelling
        run: |
          set -euo pipefail
          make docs-spell
      # A third-party site being down must not block a change: reported, not
      # failed.
      - name: External links (informational)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make docs-links

  # -------------------------------------------------------------- packaging

  packaging:
    name: Packaging (Helm, kustomize, OLM bundle, parity)
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: go helm kubectl aqua:yannh/kubeconform github:stackrox/kube-linter github:helm-unittest/helm-unittest aqua:helm/chart-testing go:github.com/norwoodj/helm-docs/cmd/helm-docs aqua:prometheus/prometheus github:operator-framework/operator-sdk
      # validate-packaging reads YAML with PyYAML and ct lint wants yamllint.
      - name: Python packages for the chart gates
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --disable-pip-version-check pyyaml==6.0.3 yamllint==1.38.0
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"
      # helm lint and template, dashboards, alert rules (promtool), helm-unittest,
      # ct lint, kubeconform, kube-linter, README values, and Helm vs kustomize
      # vs OLM compared field by field (CRDs, RBAC, versions, images).
      - name: Chart gates
        run: |
          set -euo pipefail
          make chart-gates
      - name: OLM bundle and kustomize renderings
        run: |
          set -euo pipefail
          make bundle-validate kustomize-validate

  # ----------------------------------------------------------------- images

  # One build per image per run. The linux/amd64 image is held to the
  # container profile here and handed, as an archive, to every e2e scenario
  # (e2e-kind.yml loads it), so the e2e jobs run the bytes this job checked and
  # none of them builds an image. linux/arm64 is built to prove it builds; the
  # Go stages cross-compile, so there is no emulation. Layers come from the gha
  # cache, which only main writes (a pull request's cache would serve that pull
  # request alone and push main's out of the 10 GB budget).
  images:
    name: Image ${{ matrix.image }} (multi-arch build, container profile)
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.charts == 'true' || needs.changes.outputs.console == 'true' || needs.changes.outputs.evidence == 'true' || needs.changes.outputs.operator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        image: [operator, console, evidence-agent]
    env:
      IMAGE: pgtoolbox-${{ matrix.image }}:prebuilt
      ARCHIVE: ${{ runner.temp }}/pgtoolbox-${{ matrix.image }}.tar
      CACHE_TO: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('type=gha,mode=max,ignore-error=true,scope=image-{0}', matrix.image) || '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 into an archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/amd64
          build-args: |
            VERSION=ci
          tags: ${{ env.IMAGE }}
          outputs: type=docker,dest=${{ env.ARCHIVE }}
          cache-from: type=gha,scope=image-${{ matrix.image }}
          cache-to: ${{ env.CACHE_TO }}
      - name: Build linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/arm64
          build-args: |
            VERSION=ci
          push: false
          cache-from: type=gha,scope=image-${{ matrix.image }}
          cache-to: ${{ env.CACHE_TO }}
      - name: Load the linux/amd64 image
        run: |
          set -euo pipefail
          docker load --input "${ARCHIVE}"
      # Numeric non-root user, exec-form entrypoint, OCI labels, a licence, no
      # shell, no setuid binary, and a start under an arbitrary UID in group 0
      # with a read-only root filesystem and every capability dropped.
      - name: Container profile
        run: |
          set -euo pipefail
          ./hack/image-profile.sh "${IMAGE}"
      - name: Behavioural container test (console)
        if: matrix.image == 'console'
        run: |
          set -euo pipefail
          ./hack/console/test-container.sh "${IMAGE}"
      - name: Behavioural container tests (evidence agent)
        if: matrix.image == 'evidence-agent'
        run: |
          set -euo pipefail
          ./hack/evidence/test-container.sh "${IMAGE}"
          ./hack/evidence/test-agent-container.sh "${IMAGE}"
      - name: Hand the image to the e2e scenarios
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-image-${{ matrix.image }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  olm-images:
    name: OLM bundle and catalog images build
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          set -euo pipefail
          make bundle-build catalog-build

  evidence-integration:
    name: Evidence fixtures and provider parity (Docker)
    needs: changes
    if: needs.changes.outputs.evidence == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read # check out the repository
    env:
      EVIDENCE_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        uses: ./.github/actions/toolchain
        with:
          tools: go
          go-cache: "true"
      - name: Barman and pgBackRest fixtures, S3 / Azure / GCS provider parity
        run: |
          set -euo pipefail
          make test-evidence-integration

  # ------------------------------------------------------------ kind e2e
  #
  # Each scenario is one reusable workflow call (e2e-kind.yml): a fresh runner,
  # a fresh kind cluster, one make target, the images of the images job. They run
  # in parallel; a runner is disposable, so nothing needs a lock or a sweep.

  e2e-console:
    name: E2E console
    needs: [changes, images]
    if: needs.changes.outputs.console == 'true'
    permissions:
      contents: read # the called workflow checks out the repository
    uses: ./.github/workflows/e2e-kind.yml
    with:
      target: test-e2e-console
      tools: go kind kubectl
      timeout: 40

  e2e-chart:
    name: E2E chart (two team consoles, RBAC proof, ct install)
    needs: [changes, images]
    if: needs.changes.outputs.charts == 'true' || needs.changes.outputs.console == 'true'
    permissions:
      contents: read # the called workflow checks out the repository
    uses: ./.github/workflows/e2e-kind.yml
    with:
      target: test-e2e-chart
      tools: go kind kubectl helm aqua:helm/chart-testing
      timeout: 60

  e2e-chart-netpol:
    name: E2E chart (NetworkPolicy on Calico)
    needs: [changes, images]
    if: needs.changes.outputs.charts == 'true'
    permissions:
      contents: read # the called workflow checks out the repository
    uses: ./.github/workflows/e2e-kind.yml
    with:
      target: test-e2e-chart-netpol
      tools: go kind kubectl helm aqua:helm/chart-testing
      timeout: 50

  e2e-evidenceagent:
    name: E2E EvidenceAgent
    needs: [changes, images]
    if: needs.changes.outputs.operator == 'true' || needs.changes.outputs.evidence == 'true'
    permissions:
      contents: read # the called workflow checks out the repository
    uses: ./.github/workflows/e2e-kind.yml
    with:
      target: test-e2e-evidenceagent
      tools: go kind kubectl helm
      timeout: 40

  e2e-pgadmin:
    name: E2E PgAdmin
    needs: [changes, images]
    if: needs.changes.outputs.operator == 'true'
    permissions:
      contents: read # the called workflow checks out the repository
    uses: ./.github/workflows/e2e-kind.yml
    with:
      target: test-e2e-pgadmin
      tools: go kind kubectl
      timeout: 40

  e2e-access:
    name: E2E access requests
    needs: [changes, images]
    if: needs.changes.outputs.operator == 'true' || needs.changes.outputs.console == 'true'
    permissions:
      contents: read # the called workflow checks out the repository
    uses: ./.github/workflows/e2e-kind.yml
    with:
      target: test-e2e-access
      tools: go kind kubectl helm
      timeout: 40

  e2e-team:
    name: E2E team mode (pgtools without the operator)
    needs: [changes, images]
    if: needs.changes.outputs.charts == 'true' || needs.changes.outputs.console == 'true' || needs.changes.outputs.evidence == 'true' || needs.changes.outputs.operator == 'true'
    permissions:
      contents: read # the called workflow checks out the repository
    uses: ./.github/workflows/e2e-kind.yml
    with:
      target: test-e2e-team
      tools: go kind kubectl helm
      timeout: 60

  e2e-pgbackrest:
    name: E2E pgBackRest (two plugins, MinIO over TLS)
    needs: [changes, images]
    if: needs.changes.outputs.charts == 'true' || needs.changes.outputs.console == 'true' || needs.changes.outputs.evidence == 'true' || needs.changes.outputs.operator == 'true'
    permissions:
      contents: read # the called workflow checks out the repository
    uses: ./.github/workflows/e2e-kind.yml
    with:
      target: test-e2e-pgbackrest
      tools: go kind kubectl helm
      timeout: 75

  olm-scorecard:
    name: OLM scorecard (basic and olm suites)
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    permissions:
      contents: read # the called workflow checks out the repository
    uses: ./.github/workflows/e2e-kind.yml
    with:
      target: scorecard
      images: false
      tools: go kind kubectl github:operator-framework/operator-sdk
      timeout: 30

  # ------------------------------------------------------------------ gate

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - lint
      - lint-files
      - generated
      - test
      - race-fuzz
      - envtest
      - console-core
      - ui
      - ui-e2e
      - headlamp
      - docs
      - packaging
      - images
      - olm-images
      - evidence-integration
      - e2e-console
      - e2e-chart
      - e2e-chart-netpol
      - e2e-evidenceagent
      - e2e-pgadmin
      - e2e-access
      - e2e-team
      - e2e-pgbackrest
      - olm-scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # reads only the results of the jobs it needs
    steps:
      # Skipped is a decision of the `changes` job and counts as passed; a
      # failed or cancelled job does not.
      - name: Every job passed or was skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          bad="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<<"${RESULTS}")"
          if [[ -n "${bad}" ]]; then
            echo "::error::These jobs did not pass:"
            echo "${bad}"
            exit 1
          fi
          echo "All jobs passed or were skipped on purpose."
