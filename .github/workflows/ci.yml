name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1

      # The Helm chart and the OLM bundle carry their own copies of the CRDs
      # and the manager ClusterRole. Regenerating here catches the copy a
      # change forgot, which no other job would notice: a stale bundle
      # installs an operator whose RBAC does not match its controllers.
      - name: Verify generated manifests are in sync
        run: make verify-manifests

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make vuln

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # No install: npm audit resolves the advisory set from the lockfile,
      # so this reads the tree without building it.
      - run: make audit

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # `make lint` rather than golangci-lint-action: the action installs a
      # prebuilt binary, and a binary built with an older Go than the one
      # go.mod targets refuses to load the config at all ("the Go language
      # version used to build golangci-lint is lower than the targeted Go
      # version"). `go run` compiles the same pinned version with the
      # toolchain from go.mod, so CI and a developer's machine run the same
      # linter against the same language version.
      - run: make lint

  e2e:
    name: e2e smoke test
    runs-on: ubuntu-latest
    # Provisions a kind cluster and pulls the real component images, so it is
    # minutes rather than seconds. It earns that: it is the only job that can
    # catch RBAC escalation prevention refusing a generated Role rule, or a
    # component container rejecting the environment the operator rendered.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - run: ./hack/e2e.sh

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - run: helm lint deploy/helm/pgtoolbox
      - run: helm template pgtoolbox deploy/helm/pgtoolbox --namespace pgtoolbox > /dev/null

      - name: Validate rendered YAML
        run: |
          helm template pgtoolbox deploy/helm/pgtoolbox --namespace pgtoolbox | \
            python3 -c "import sys, yaml; list(yaml.safe_load_all(sys.stdin))"

  olm:
    name: OLM bundle & catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Building the images proves the YAML parses. This proves the two
      # install paths say the same thing as the generated manifests and as
      # each other, which is the failure these copies actually have.
      - name: Validate packaging consistency
        run: make validate-packaging

      - name: Build bundle image
        run: docker build -f deploy/olm/bundle.Dockerfile -t pgtoolbox-bundle:ci deploy/olm/bundle

      - name: Build catalog image (validates the catalog via opm)
        run: docker build -f deploy/olm/catalog.Dockerfile -t pgtoolbox-catalog:ci deploy/olm/catalog

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
