name: Feature request
description: Propose a change or an addition.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you have?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: input
    id: context
    attributes:
      label: Your environment
      description: pgToolBox, CloudNativePG and Kubernetes or OpenShift versions, and how you install it.
