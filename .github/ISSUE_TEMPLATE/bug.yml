name: Bug report
description: Something does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security vulnerabilities do not belong here: use a
        [private advisory](https://github.com/fyannk/pgToolBox/security/advisories/new).
        Remove secrets, hostnames and credentials from anything you paste.
  - type: input
    id: version
    attributes:
      label: pgToolBox version
      description: The image tag or chart version, ideally the image digest (`kubectl get pod -o jsonpath='{..image}'`).
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: cnpg
    attributes:
      label: CloudNativePG version
      placeholder: "1.30.1"
    validations:
      required: true
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes or OpenShift version
      placeholder: "Kubernetes 1.34, OpenShift 4.21"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Helm (pgtoolbox chart)
        - Helm (pgtools chart)
        - kustomize
        - OLM
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of objects and commands that shows it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and status
      description: Relevant component logs and the `status.conditions` of the object involved. No secrets.
      render: shell
