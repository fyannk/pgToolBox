# Dependency updates, in the house style of the other fyannk repositories:
# weekly on Monday morning (Europe/Paris), at most five open pull requests per
# ecosystem, a seven-day cooldown so a release that is yanked or fixed within a
# week is never proposed, and Conventional Commit prefixes. Minor and patch
# updates are grouped into one pull request per ecosystem and merged by
# automerge.yml when the required checks pass; a major update is its own pull
# request, left for a person (the quarterly toolchain day,
# docs/site/docs/development/ci.md). The tool versions in mise.toml and the
# pins in hack/*.sh are not read by Dependabot; that day bumps them by hand.
version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /pkg/evidence
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    groups:
      kubernetes:
        applies-to: version-updates
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          - "github.com/cloudnative-pg/*"
        update-types:
          - minor
          - patch
      go-routine:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          - "github.com/cloudnative-pg/*"
        update-types:
          - minor
          - patch

  # The opm module is a tool pin (deploy/olm/catalog/opm/tools.go): its direct
  # requirements are opm and grpc-health-probe, and everything else follows the
  # versions opm releases with. Updating the indirect requirements one by one
  # (k8s.io/api, docker/distribution v3, ...) cannot be resolved without moving
  # opm, which failed with dependency_file_not_resolvable. Only the direct ones
  # are proposed; the quarterly toolchain day moves opm itself
  # (docs/site/docs/development/ci.md).
  - package-ecosystem: gomod
    directory: /deploy/olm/catalog/opm
    schedule:
      interval: weekly
      day: monday
      time: "06:35"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    allow:
      - dependency-type: direct
    groups:
      opm-tools:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - /ui
      - /docs/site
      - /headlamp
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    groups:
      # The Playwright packages move together and with the image of
      # ui/e2e.Dockerfile (docker ignores that image below: npm drives it).
      # A bump re-renders the screenshot baselines, so automerge.yml leaves
      # this group to a person: bump the image tag and digest, run
      # `make ui-e2e-update`, review the image diff.
      playwright:
        applies-to: version-updates
        patterns:
          - "@playwright/test"
          - "playwright"
      npm-routine:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@playwright/test"
          - "playwright"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /
      - /deploy/olm
      - /ui # e2e.Dockerfile: the Playwright image, kept in step with npm by hack/check-toolchain.sh
    schedule:
      interval: weekly
      day: monday
      time: "06:50"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Versioned with @playwright/test (the `playwright` npm group); a lone
      # image bump fails hack/check-toolchain.sh and the baselines.
      - dependency-name: "mcr.microsoft.com/playwright"
      # The Go and Node builders are the mise.toml pins (hack/check-toolchain.sh
      # fails on any other tag); the quarterly toolchain day bumps both together.
      - dependency-name: "golang"
      - dependency-name: "node"
    groups:
      container-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/toolchain
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
