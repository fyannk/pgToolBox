# The operator for the access-request e2e: the generated manager
# ClusterRole (config/rbac/role.yaml, applied separately) bound to its own
# ServiceAccount, one replica without leader election, watching the scenario's
# namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgtoolbox-access
  namespace: pgtoolbox-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgtoolbox-access-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-role
subjects:
- kind: ServiceAccount
  name: pgtoolbox-access
  namespace: pgtoolbox-access
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgtoolbox-access
  namespace: pgtoolbox-access
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: pgtoolbox-access}
  template:
    metadata:
      labels: {app.kubernetes.io/name: pgtoolbox-access}
    spec:
      serviceAccountName: pgtoolbox-access
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: manager
        image: "@MANAGER_IMG@"
        imagePullPolicy: Never
        args:
        - --leader-elect=false
        - --operator-image=@MANAGER_IMG@
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        env:
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: OPERATOR_IMAGE
          value: "@MANAGER_IMG@"
        - name: WATCH_NAMESPACES
          value: "@NS@"
        readinessProbe:
          httpGet: {path: /readyz, port: 8081}
        livenessProbe:
          httpGet: {path: /healthz, port: 8081}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
