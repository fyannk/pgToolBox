#
# An object store for the e2e test to archive into.
#
# It exists so the CloudNativePG cluster can actually archive: a cluster
# pointed at an unreachable endpoint may never reach a running primary,
# and the admin-sync assertions need one. With a real store the whole
# chain is genuine — archive, ObjectStore resolution, evidence scan —
# rather than a composition that merely looks right.
#
# This is test infrastructure, not a shipped component. The pgtoolbox
# family images (pgConsole, pgAdmin, pgObjectStoreViewer) are the ones
# under test; MinIO here plays the same role CloudNativePG does.
apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: minio
stringData:
  # Fixed and non-secret: this store exists for the length of one test run
  # in a throwaway cluster and is never reachable from outside it.
  ACCESS_KEY_ID: e2eaccesskey
  ACCESS_SECRET_KEY: e2esecretkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # Chainguard's build of MinIO from source, pinned by digest. MinIO
          # deleted its Docker Hub repositories in September 2026 and on
          # 2026-09-24 quay.io/minio/minio stopped serving anonymous pulls,
          # which is what turned this rollout into a five-minute timeout.
          # Docker Hub mirror of cgr.dev/chainguard/minio; the digest is the
          # multi-arch index (amd64 + arm64). Runs as uid 65532 and ships
          # /usr/bin/sh, mc and minio, so the bucket-directory trick below
          # still works; emptyDir is world-writable so no fsGroup is needed.
          image: docker.io/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
          # MinIO serves a top-level directory of its data dir as a bucket,
          # so creating the directory is the whole bucket setup.
          command:
            - /usr/bin/sh
            - -c
            - mkdir -p /data/e2e-backups && exec minio server /data --address :9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: minio-credentials, key: ACCESS_KEY_ID }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: minio-credentials, key: ACCESS_SECRET_KEY }
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
